        if (statLine) extraLine.push(statLine);
        if (ownLine) extraLine.push(ownLine);

          meta += '<div style="font-size:11px;color:var(--muted);margin-top:2px;">' + extraLine.join(" · ") + "</div>";
        }

      '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">STARTER</div>' +
      '<div>' + renderKaderGroup(split.starters) + "</div>" +

      (taxiIds.length ? '<div style="font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;">TAXI SQUAD (' + taxiIds.length + ')</div><div>' + renderKaderGroup(sortPidsByPosition(taxiIds), "Taxi") + "</div>" : "") + "</div>"));
    return wrap;

  function potentialCardEl(teams, title) {
    var calcLabel = state.calcMode === "starters" ? "nur Starter" : "gesamter Kader";
    var potTitle = (title || "Saisonpunkte bis zu den Playoffs") + " (" + calcLabel + ")";
    if (state.projectionsLoading || state.weeklyProjectionsLoading || state.seasonMatchupsLoading) {
      return el('<div class="card"><h2>' + potTitle + '</h2><div class="loading">Projektionen werden geladen…</div></div>');
    } else if (state.projectionsError) {
      return el('<div class="card"><h2>' + potTitle + '</h2><div class="error" style="margin-top:0;">' + escapeHtml(state.projectionsError) + "</div></div>");
    } else if (state.projections) {
      var potPositions = activePositions();
      function actualByPosition(rosterId) {
        var out = {};
        for (var aw = 1; aw < state.week; aw++) {
          var entry = getRosterWeekEntry(aw, rosterId);
          if (!entry || !entry.players_points) continue;
          (entry.starters || []).forEach(function (pid) {
            if (!pid || pid === "0") return;
            var pos = positionOf(pid);
            if (potPositions.indexOf(pos) === -1) return;
            if (pos === "K" && state.excludeK) return;
            if (pos === "DEF" && state.excludeDEF) return;
            var pts = entry.players_points[pid];
            if (typeof pts === "number") out[pos] = (out[pos] || 0) + pts;
          });
        }
        return out;
      }
      var potRows = teams.map(function (t) {
        var act = actualByPosition(t.rosterId);
        var restArr = positionProjectionBreakdown(rosterById(t.rosterId));
        var rest = {};
        restArr.forEach(function (b2) { rest[b2.pos] = b2.points; });
        var actTotal = 0, restTotal = 0;
        potPositions.forEach(function (pp) { actTotal += act[pp] || 0; restTotal += rest[pp] || 0; });
        return { rosterId: t.rosterId, name: t.name, act: act, rest: rest, actTotal: actTotal, restTotal: restTotal, total: actTotal + restTotal };
      }).sort(function (a2, b2) { return b2.total - a2.total; });
      var maxPot = Math.max.apply(null, potRows.map(function (t) { return t.total; }).concat([1]));
      var posUsed = {};
      var potBars = potRows.map(function (t) {
        var segs = "";
        var firstRest = true;
        potPositions.forEach(function (pp) {
          var v = t.act[pp] || 0;
          if (v > 0) {
            posUsed[pp] = true;
            segs += '<div class="pp-seg" style="width:' + (v / maxPot * 100) + "%;background:" + (POSITION_COLORS[pp] || "#78909C") + ';" title="' + escapeHtml(t.name + " · " + pp + " · erzielt " + v.toFixed(1)) + '"></div>';
          }
        });
        potPositions.forEach(function (pp) {
          var v = t.rest[pp] || 0;
          if (v > 0) {
            posUsed[pp] = true;
            segs += '<div class="pp-seg rest' + (firstRest ? " first" : "") + '" style="width:' + (v / maxPot * 100) + "%;background:" + (POSITION_COLORS[pp] || "#78909C") + ';" title="' + escapeHtml(t.name + " · " + pp + " · erwartet " + v.toFixed(1)) + '"></div>';
            firstRest = false;
          }
        });
        var mineRow = t.rosterId === state.myRosterId;
        return '<div class="bar-row"><div class="bar-label" title="' + escapeHtml(t.name) + '"' + (mineRow ? ' style="font-weight:800;color:var(--gold);"' : "") + ">" + escapeHtml(t.name) + "</div>" +
          '<div class="pp-track">' + segs + "</div>" +
          '<div class="pp-value"><b>' + t.total.toFixed(1) + '</b><span>' + t.actTotal.toFixed(0) + " + " + t.restTotal.toFixed(0) + "</span></div></div>";
      }).join("");
      var potLegend = potPositions.filter(function (pp) { return posUsed[pp]; }).map(function (pp) {
        return '<span><span class="dot" style="background:' + (POSITION_COLORS[pp] || "#78909C") + ';"></span>' + escapeHtml(pp) + "</span>";
      }).join("") +
        '<span><span class="dot" style="background:#5C6B5F;"></span>kräftig = schon erzielt</span><span><span class="dot" style="background:#5C6B5F;opacity:.4;"></span>blass = noch erwartet</span>';
      return el('<div class="card"><h2>' + potTitle + infoBtn("moegl-punkte") + "</h2>" +
        infoBox("moegl-punkte", "Summe aus bereits erzielten Punkten (tatsächliche Punkte deiner Starter in den gespielten Wochen) und den noch erwarteten Punkten (wochenspezifische Projektionen von der aktuellen Woche bis zum Ende der regulären Saison deiner Liga, inkl. Bye-Wochen und Verletzungen). Die Playoffs und der Rest des NFL-Spielplans zählen nicht mit. Rechts: Gesamt, darunter erzielt + erwartet. Die Farben zeigen die Positionsgruppen." + (state.calcMode === "starters" ? " Erwartet wird für die aktuelle Startaufstellung." : " Erwartet wird für den gesamten Kader, erzielt sind immer nur die Punkte der Starter.")) +
        '<div class="legend" style="margin:0 0 12px;">' + potLegend + "</div>" +
        potBars + "</div>");
    }

    return el('<div class="card"></div>');
  }

  function renderVergleich(s) {
    var wrap = el("<div></div>");
    var opponents = s.filter(function (t) { return t.rosterId !== state.myRosterId; });
    var optsHtml = '<option value=""' + (state.compareRosterId === null ? " selected" : "") + ">Gegner wählen …</option>" + opponents.map(function (t) {
      return '<option value="' + t.rosterId + '"' + (t.rosterId === state.compareRosterId ? " selected" : "") + ">" + escapeHtml(t.name) + "</option>";
    }).join("");

    wrap.appendChild(el('<div class="card"><h2>Gegner wählen</h2><select id="opp-select" class="ex-select" style="min-width:240px;max-width:100%;">' + optsHtml + "</select></div>"));

    if (state.compareRosterId !== null && state.players && !state.playersLoading) {
      if (state.projectionsLoading || !state.projections) {
        wrap.appendChild(el('<div class="card"><div class="loading">Punkte-Projektionen werden geladen…</div></div>'));
        return wrap;
      }
      if (state.projectionsError) {
        wrap.appendChild(el('<div class="card"><div class="error" style="margin-top:0;">' + escapeHtml(state.projectionsError) + "</div></div>"));
        return wrap;
      }

      var myRoster = rosterById(state.myRosterId);
      var compRoster = rosterById(state.compareRosterId);
      var myBreak = positionProjectionBreakdown(myRoster);
      var compBreak = positionProjectionBreakdown(compRoster);
      var allPos = [];
      myBreak.concat(compBreak).forEach(function (b) {
        if (b.pos !== "—" && allPos.indexOf(b.pos) === -1) allPos.push(b.pos);
      });
      allPos.sort(function (a, b) {
        var ai = POSITION_ORDER.indexOf(a); var bi = POSITION_ORDER.indexOf(b);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });

      var maxPts = 1;
      allPos.forEach(function (pos) {
        var mine = (myBreak.filter(function (b) { return b.pos === pos; })[0] || {}).points || 0;
        var opp = (compBreak.filter(function (b) { return b.pos === pos; })[0] || {}).points || 0;
        maxPts = Math.max(maxPts, mine, opp);
      });

      var rows = allPos.map(function (pos) {
        var mine = (myBreak.filter(function (b) { return b.pos === pos; })[0] || {}).points || 0;
        var opp = (compBreak.filter(function (b) { return b.pos === pos; })[0] || {}).points || 0;
        var minePct = Math.max(mine > 0 ? 8 : 0, (mine / maxPts) * 100);
        var oppPct = Math.max(opp > 0 ? 8 : 0, (opp / maxPts) * 100);
        return '<div class="compare-pair">' +
          '<div class="num" style="width:38px;">' + mine.toFixed(1) + "</div>" +
          '<div class="side"><div class="track"><div class="fill-mine" style="width:' + minePct + '%;"></div></div></div>' +
          '<div class="pos-name" style="text-align:center;">' + escapeHtml(pos) + "</div>" +
          '<div class="side"><div class="track"><div class="fill-opp" style="width:' + oppPct + '%;"></div></div></div>' +
          '<div class="num" style="width:38px;">' + opp.toFixed(1) + "</div>" +
          "</div>";
      }).join("");

      wrap.appendChild(el(
        '<div class="card"><h2>Erwartete Punkte je Position: Du vs. ' + escapeHtml(teamName(compRoster)) + "</h2>" +
        '<div class="legend"><span><span class="dot" style="background:var(--gold);"></span>Du</span><span><span class="dot" style="background:var(--green);"></span>' + escapeHtml(teamName(compRoster)) + "</span></div>" +
        rows + "</div>"
      ));

      var duelTeams = s.filter(function (t) { return t.rosterId === state.myRosterId || t.rosterId === state.compareRosterId; })
        .sort(function (x, y) { return (x.rosterId === state.myRosterId ? 0 : 1) - (y.rosterId === state.myRosterId ? 0 : 1); });
      wrap.appendChild(potentialCardEl(duelTeams, "Saisonpunkte bis zu den Playoffs: Du vs. " + teamName(compRoster)));
    } else if (state.compareRosterId !== null) {
      wrap.appendChild(el('<div class="card"><div class="loading">Spielerdaten werden geladen…</div></div>'));
    }

    return wrap;
  }

  function renderAnalyse() {
    var wrap = el("<div></div>");
    var myRoster = rosterById(state.myRosterId);

    if (state.seasonMatchupsLoading || state.projectionsLoading) {
      wrap.appendChild(el('<div class="card"><h2>Wochenübersicht – Prognose</h2><div class="loading">Prognose wird berechnet…</div></div>'));

  // ---------- Spielerkarte: Stats (Wochen-Diagramm, Wochen-Tabelle, Saisonwerte) ----------

    });

  // Platz eines Spielers unter allen Spielern seiner Position in einer Woche (1 = bester), nach Liga-Wertung
  function positionWeekRank(week, pid, pos) {
    var st = state.weeklyStats && state.weeklyStats[week];
    var raw = st && st[pid];
    if (!raw || (raw.gp !== undefined && !(parseFloat(raw.gp) > 0))) return null;
    var mine = parseFloat(recScore(raw, pid));
    if (isNaN(mine)) return null;
    var better = 0;
    Object.keys(st).forEach(function (op) {
      var po = state.players[op];

      var ro = st[op];
      if (ro.gp !== undefined && !(parseFloat(ro.gp) > 0)) return;

  // ---------- Profil-Tab: aDOT, Time-to-Throw, Separation usw. (nflverse + Next Gen Stats) ----------
  function ngsFetchUrl(kind) {
    return "https://github.com/nflverse/nflverse-data/releases/download/nextgen_stats/ngs_" + kind + ".csv";
  }

  function parseNgsCsv(text, kind) {
    var rows = parseCsv(text);
    var head = rows[0] || [];
    var idx = {};
    head.forEach(function (h, i) { idx[h] = i; });
    if (idx.player_gsis_id === undefined || idx.week === undefined) throw new Error("Unerwartetes Format (player_gsis_id/week fehlen)");
    var wantSeason = state.league ? String(state.league.season) : null;
    var cols = kind === "passing"
      ? ["avg_time_to_throw", "avg_completed_air_yards", "avg_intended_air_yards", "avg_air_yards_differential", "aggressiveness", "completion_percentage_above_expectation", "completion_percentage", "expected_completion_percentage", "attempts"]
      : ["avg_cushion", "avg_separation", "avg_intended_air_yards", "percent_share_of_intended_air_yards", "catch_percentage", "avg_yac", "avg_expected_yac", "avg_yac_above_expectation", "targets", "receptions"];
    var out = {};
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (r.length < head.length) continue;
      if (idx.season !== undefined && wantSeason && r[idx.season] !== wantSeason) continue;
      if (idx.season_type !== undefined && r[idx.season_type] !== "REG") continue;
      if (parseInt(r[idx.week], 10) !== 0) continue;
      var rec = { pos: idx.player_position !== undefined ? r[idx.player_position] : null };
      cols.forEach(function (c) { var v = idx[c] !== undefined ? parseFloat(r[idx[c]]) : NaN; rec[c] = isNaN(v) ? null : v; });
      out[r[idx.player_gsis_id]] = rec;
    }
    return out;
  }

  function loadNgs() {
    if (!state.league || state.ngsLoading || state.ngsError || (state.ngsPassing && state.ngsReceiving)) return;
    state.ngsLoading = true;
    Promise.all(["passing", "receiving"].map(function (kind) {
      return fetch(ngsFetchUrl(kind)).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (t) { return parseNgsCsv(t, kind); });
    })).then(function (res) { state.ngsPassing = res[0]; state.ngsReceiving = res[1]; })
      .catch(function () { state.ngsError = "cors"; })
      .finally(function () { state.ngsLoading = false; render(); });
  }

  // Erkennt die Art der hochgeladenen nflverse-Datei anhand der Kopfzeile

    if (first.indexOf("avg_separation") !== -1) { state.ngsReceiving = parseNgsCsv(text, "receiving"); return "Next Gen Stats Receiving"; }
    state.nflverse = parseNflverseCsv(text);

  }

      '<div style="font-weight:700;margin-bottom:6px;">Zusatzdaten laden (nflverse / Next Gen Stats)</div>' +
      '<div class="hint" style="margin-bottom:10px;">GitHub lässt Webseiten diese Dateien nicht automatisch laden (Browser-Sicherheitsregel). Lade die Dateien einmal herunter und wähle sie unten aus (mehrere auf einmal möglich, die Art wird erkannt). Sie bleiben nur für diese Sitzung gespeichert.<br>' +
      "Spielerstatistiken (aDOT, Air-Yards-Anteil, YAC): " + ok(!!state.nflverse) + " · Next Gen Passing (Time-to-Throw): " + ok(!!state.ngsPassing) + " · Next Gen Receiving (Separation): " + ok(!!state.ngsReceiving) + "</div>" +
      link("https://github.com/nflverse/nflverse-data/releases/tag/stats_player", "stats_player_week_" + escapeHtml(season) + ".csv") +
      link("https://github.com/nflverse/nflverse-data/releases/tag/nextgen_stats", "ngs_passing.csv / ngs_receiving.csv") +
      (state.nflverseUploadError ? '<div class="error" style="margin-bottom:10px;">' + escapeHtml(state.nflverseUploadError) + "</div>" : "") +
      '<div><input type="file" class="nfl-file-input" accept=".csv" multiple style="font-size:12px;" /></div></div>';
  }

  function nflSeasonAgg() {
    if (state._nflAgg && state._nflAggRef === state.nflverse) return state._nflAgg;
    var out = {};
    var sumCols = ["attempts", "passing_air_yards", "targets", "receiving_air_yards", "receptions", "receiving_yards_after_catch"];
    var avgCols = ["air_yards_share", "target_share", "wopr"];
    Object.keys(state.nflverse || {}).forEach(function (wk) {
      var wkMap = state.nflverse[wk];
      Object.keys(wkMap).forEach(function (gsis) {
        var rec = wkMap[gsis];
        var a = out[gsis] || (out[gsis] = { pos: rec.pos, sums: {}, avgS: {}, avgN: {} });
        if (rec.pos) a.pos = rec.pos;
        sumCols.forEach(function (c) { if (rec[c] !== null && rec[c] !== undefined) a.sums[c] = (a.sums[c] || 0) + rec[c]; });
        avgCols.forEach(function (c) { if (rec[c] !== null && rec[c] !== undefined) { a.avgS[c] = (a.avgS[c] || 0) + rec[c]; a.avgN[c] = (a.avgN[c] || 0) + 1; } });
      });
    });
    Object.keys(out).forEach(function (g) {
      var a = out[g], s = a.sums;
      a.adotQb = s.attempts > 0 && s.passing_air_yards !== undefined ? s.passing_air_yards / s.attempts : null;
      a.adotRec = s.targets > 0 && s.receiving_air_yards !== undefined ? s.receiving_air_yards / s.targets : null;
      a.yacRec = s.receptions > 0 && s.receiving_yards_after_catch !== undefined ? s.receiving_yards_after_catch / s.receptions : null;
      a.aysh = a.avgN.air_yards_share ? a.avgS.air_yards_share / a.avgN.air_yards_share : null;
      a.tgsh = a.avgN.target_share ? a.avgS.target_share / a.avgN.target_share : null;
      a.wopr = a.avgN.wopr ? a.avgS.wopr / a.avgN.wopr : null;
    });
    state._nflAgg = out; state._nflAggRef = state.nflverse;
    return out;
  }

  // Rang eines Wertes innerhalb der Vergleichsliste (1 = höchster Wert, bei low = niedrigster)
  function profRank(list, gsis, low) {
    var vals = list.filter(function (x) { return x.v !== null && x.v !== undefined; });
    var me = vals.filter(function (x) { return x.id === gsis; })[0];
    if (!me) return null;
    var better = vals.filter(function (x) { return low ? x.v < me.v : x.v > me.v; }).length;
    return { rank: better + 1, of: vals.length };
  }

  function renderProfileTab(pid, p, pos) {
    loadNflverse();
    loadPlayerIdCrosswalk();
    loadNgs();
    var gsis = (state.sleeperGsisMap && state.sleeperGsisMap[pid]) || p.gsis_id;
    if (state.nflverseLoading || state.ngsLoading || state.sleeperGsisMapLoading) return '<div class="hint" style="margin:0;">Zusatzdaten werden geladen…</div>';
    if (!gsis) return '<div class="hint" style="margin:0;">Für diesen Spieler fehlt die ID-Zuordnung (GSIS), daher gibt es kein Profil.</div>';
    var tiles = [];
    function tile(label, val, rk, note) {
      tiles.push('<div class="item" style="background:var(--bg);border-radius:12px;padding:10px 12px;"><div class="v" style="font-size:20px;font-weight:800;">' + val + '</div><div class="k">' + label + (rk ? ' · <span style="color:var(--muted);">Rang ' + rk.rank + "/" + rk.of + (note ? " " + note : "") + "</span>" : "") + "</div></div>");
    }
    function f(v, d, suf) { return v === null || v === undefined ? "–" : v.toFixed(d) + (suf || ""); }
    var agg = state.nflverse ? nflSeasonAgg() : null;
    var me = agg ? agg[gsis] : null;
    function poolOf(key, volKey, posList) {
      var arr = Object.keys(agg).filter(function (g) { return posList.indexOf(agg[g].pos) !== -1; });
      var maxVol = Math.max.apply(null, arr.map(function (g) { return agg[g].sums[volKey] || 0; }).concat([1]));
      return arr.filter(function (g) { return (agg[g].sums[volKey] || 0) >= maxVol * 0.35; }).map(function (g) { return { id: g, v: agg[g][key] }; });
    }
    var any = false;
    if (me) {
      if (pos === "QB") {
        var pq = poolOf("adotQb", "attempts", ["QB"]);
        tile("aDOT (Passtiefe)", f(me.adotQb, 1), profRank(pq, gsis, false)); any = true;
      } else {
        var pl = ["RB", "WR", "TE"];
        var po = function (k) { return poolOf(k, "targets", [pos]); };
        tile("aDOT (Target-Tiefe)", f(me.adotRec, 1), profRank(po("adotRec"), gsis, false));
        tile("YAC pro Catch", f(me.yacRec, 1), profRank(po("yacRec"), gsis, false));
        tile("Air-Yards-Anteil", f(me.aysh !== null ? me.aysh * 100 : null, 1, " %"), profRank(po("aysh"), gsis, false));
        tile("Target-Anteil", f(me.tgsh !== null ? me.tgsh * 100 : null, 1, " %"), profRank(po("tgsh"), gsis, false));
        tile("WOPR", f(me.wopr, 2), profRank(po("wopr"), gsis, false));
        any = true;
      }
    }
    var ngsRec = null;
    if (pos === "QB" && state.ngsPassing) {
      ngsRec = state.ngsPassing[gsis];
      var plist = function (k) { return Object.keys(state.ngsPassing).map(function (g) { return { id: g, v: state.ngsPassing[g][k] }; }); };
      if (ngsRec) {
        tile("Time-to-Throw (Sek.)", f(ngsRec.avg_time_to_throw, 2), profRank(plist("avg_time_to_throw"), gsis, true), "(1 = schnellster)");
        tile("Ø Intended Air Yards", f(ngsRec.avg_intended_air_yards, 1), profRank(plist("avg_intended_air_yards"), gsis, false));
        tile("Aggressiveness", f(ngsRec.aggressiveness, 1, " %"), profRank(plist("aggressiveness"), gsis, false));
        tile("CPOE", f(ngsRec.completion_percentage_above_expectation, 1, " %"), profRank(plist("completion_percentage_above_expectation"), gsis, false));
        tile("Completion % (erwartet)", f(ngsRec.completion_percentage, 1, " %") + " (" + f(ngsRec.expected_completion_percentage, 1, " %") + ")", null);
        any = true;
      }
    } else if (pos !== "QB" && state.ngsReceiving) {
      ngsRec = state.ngsReceiving[gsis];
      var rlist = function (k) { return Object.keys(state.ngsReceiving).filter(function (g) { return state.ngsReceiving[g].pos === pos; }).map(function (g) { return { id: g, v: state.ngsReceiving[g][k] }; }); };
      if (ngsRec) {
        tile("Separation (Yards)", f(ngsRec.avg_separation, 2), profRank(rlist("avg_separation"), gsis, false));
        tile("Cushion (Yards)", f(ngsRec.avg_cushion, 2), profRank(rlist("avg_cushion"), gsis, false));
        tile("Ø Intended Air Yards", f(ngsRec.avg_intended_air_yards, 1), profRank(rlist("avg_intended_air_yards"), gsis, false));
        tile("Anteil Intended Air Yards", f(ngsRec.percent_share_of_intended_air_yards, 1, " %"), profRank(rlist("percent_share_of_intended_air_yards"), gsis, false));
        tile("YAC über Erwartung", f(ngsRec.avg_yac_above_expectation, 2), profRank(rlist("avg_yac_above_expectation"), gsis, false));
        tile("Catch-Quote", f(ngsRec.catch_percentage, 1, " %"), profRank(rlist("catch_percentage"), gsis, false));
        any = true;
      }
    }
    var missing = !state.nflverse || (pos === "QB" ? !state.ngsPassing : !state.ngsReceiving);
    var out = "";
    if (any) {
      out += '<div class="hint" style="margin:0 0 8px;">Profil der Saison ' + escapeHtml(state.league ? state.league.season : "") + '. Rang = Platz unter den Spielern derselben Position mit nennenswertem Volumen (1 = höchster Wert).</div>' +
        '<div class="player-card-bio" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;">' + tiles.join("") + "</div>" +
        '<div class="hint" style="margin:10px 0 0;font-size:12px;">aDOT = durchschnittliche Tiefe des Passes bzw. Targets (Air Yards je Versuch/Target). Time-to-Throw, Separation, Cushion und CPOE stammen von den Next Gen Stats der NFL. Werte wie Pressure-to-Sack-Rate oder Big-Time Throws sind PFF-intern und nicht verfügbar.</div>';
    } else {
      out += '<div class="hint" style="margin:0 0 10px;">Für diesen Spieler liegen (noch) keine Profil-Daten vor.</div>';
    }
    if (missing) out += nflUploadCardHtml();
    return out;
  }

  function renderPlayerStatsTab(pid, p, pos) {
    var lastWeek = (state.week || 1) - 1;
    if (lastWeek < 1) return '<div class="hint" style="margin:0;">Noch keine gespielte Woche in dieser Saison.</div>';
    ensureDefenseStatsLoaded();
    for (var lw = 1; lw <= lastWeek; lw++) {
      if (!state.weeklyStats || !state.weeklyStats[lw]) return '<div class="hint" style="margin:0;">Statistiken werden geladen…</div>';
    }
    var cols = PSTAT_COLS[pos] || [];
    var rows = [];
    for (var w = 1; w <= lastWeek; w++) {
      var raw = state.weeklyStats[w][pid];
      var played = raw && (raw.gp === undefined || parseFloat(raw.gp) > 0);
      var r = played ? computeStatsRow(pid, w) : null;
      var rank = played ? positionWeekRank(w, pid, pos) : null;
      var oppInfo = p.team && state.nflWeekOpponents && state.nflWeekOpponents[w] ? state.nflWeekOpponents[w][p.team] : null;
      rows.push({ w: w, r: r, rank: rank, opp: oppInfo });
    }
    var played = rows.filter(function (x) { return x.r && x.r.pts !== null; });
    if (played.length === 0) return '<div class="hint" style="margin:0;">Keine Spiele in dieser Saison.</div>';

    var chart = weeklyLineChartSvg(rows.map(function (x) { return { w: x.w, v: x.r && x.r.pts !== null ? x.r.pts : null }; }));
    var head = '<tr><th>Woche</th><th>Gegner</th>' + cols.map(function (c) { return "<th>" + c.h + "</th>"; }).join("") + '<th class="grp-l">Punkte</th><th>Rang</th><th>Snap%</th></tr>';
    var body = rows.map(function (x) {
      var opp = x.opp ? (x.opp.isHome ? "vs " : "@ ") + x.opp.opp : "—";
      if (!x.r) return "<tr><td>" + x.w + "</td><td>" + escapeHtml(opp) + '</td><td colspan="' + (cols.length + 3) + '" style="color:var(--muted);">kein Einsatz</td></tr>';
      return "<tr><td>" + x.w + "</td><td>" + escapeHtml(opp) + "</td>" +
        cols.map(function (c) { return sc(c.f ? c.f(x.r) : x.r[c.k]); }).join("") +
        '<td class="grp-l" style="font-weight:800;">' + (x.r.pts !== null ? x.r.pts.toFixed(1) : "–") + "</td><td>" + (x.rank ? escapeHtml(pos) + x.rank : "–") + "</td><td>" + (x.r.snapPct !== null ? x.r.snapPct + "%" : "–") + "</td></tr>";
    }).join("");

    // Saisonwerte
    var n = played.length;
    var totalPts = played.reduce(function (a, x) { return a + x.r.pts; }, 0);
    var best = 0, bestWeek = null;
    played.forEach(function (x) { if (x.r.pts > best || bestWeek === null) { best = x.r.pts; bestWeek = x.w; } });
    var teamGames = 0;
    for (var tg = 1; tg <= lastWeek; tg++) if (!state.nflWeekOpponents || (p.team && state.nflWeekOpponents[tg] && state.nflWeekOpponents[tg][p.team])) teamGames++;
    if (!teamGames) teamGames = lastWeek;
    function tile(label, big, small) {
      return '<div class="item" style="background:var(--bg);border-radius:12px;padding:10px 12px;"><div class="v" style="font-size:20px;font-weight:800;">' + big + '</div><div class="k">' + label + (small ? ' · <span style="color:var(--muted);">' + small + "</span>" : "") + "</div></div>";
    }
    var tiles = tile("Spiele", n, String(teamGames)) + tile("Punkte", totalPts.toFixed(1), "Ø " + (totalPts / n).toFixed(1)) + tile("Beste Woche", best.toFixed(1), "(" + bestWeek + ")");
    cols.forEach(function (c) {
      if (!c.sum) return;
      var tot = 0, any = false;
      played.forEach(function (x) { var v = x.r[c.k]; if (v !== null && v !== undefined && !isNaN(v)) { tot += v; any = true; } });
      if (any) tiles += tile(c.h, Math.round(tot * 10) / 10, "Ø " + (tot / n).toFixed(1));
    });
    return '<div class="hint" style="margin:0 0 8px;">Fantasy-Punkte pro Woche (nach den Regeln deiner Liga). „Rang“ ist der Platz unter allen ' + escapeHtml(pos) + "s in dieser Woche (z. B. " + escapeHtml(pos) + '12).</div>' +
      chart +
      '<h3 style="margin:14px 0 6px;">Wochenwerte</h3><div style="overflow-x:auto;"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
      '<h3 style="margin:14px 0 6px;">Saisonwerte</h3><div class="player-card-bio" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;">' + tiles + "</div>";
  }

  function renderTeamCompareTab(pid, p, pos, reviewWeek) {
    if (!p.team) return '<div class="hint" style="margin:0;">Kein NFL-Team zugeordnet (Free Agent).</div>';
    var lastDone = Math.max(1, (state.week || 1) - 1);
    var week = state.teamCompareWeek !== null && state.teamCompareWeek !== undefined ? state.teamCompareWeek : reviewWeek;
    week = Math.max(1, Math.min(lastDone, week));
    loadWeeklyStats(week);
    var nav = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
      '<button type="button" class="secondary team-week-nav" data-dir="-1" ' + (week <= 1 ? "disabled" : "") + ' style="padding:6px 12px;">← Woche ' + (week - 1) + "</button>" +
      '<div style="font-weight:800;">Woche ' + week + "</div>" +
      '<button type="button" class="secondary team-week-nav" data-dir="1" ' + (week >= lastDone ? "disabled" : "") + ' style="padding:6px 12px;">Woche ' + (week + 1) + " →</button></div>";
    var statsMap = state.weeklyStats && state.weeklyStats[week];
    if (!statsMap) return nav + '<div class="hint" style="margin:0;">Statistik-Daten für Woche ' + week + " werden geladen…</div>";
    var teammates = Object.keys(state.players).filter(function (otherId) {
      var o = state.players[otherId];
      return o && o.team === p.team && o.position === pos;
    });
    var cols = PSTAT_COLS[pos] || [];
    var rows = teammates.map(function (otherId) {
      var r = computeStatsRow(otherId, week);
      var raw = statsMap[otherId];
      var played = raw && (raw.gp === undefined || parseFloat(raw.gp) > 0);
      return { pid: otherId, r: played ? r : null, rank: played ? positionWeekRank(week, otherId, pos) : null };
    }).filter(function (x) { return x.r; }).sort(function (a, b) { return (b.r.pts || 0) - (a.r.pts || 0); });
    if (rows.length === 0) {
      return nav + '<div class="hint" style="margin:0;">Keine ' + escapeHtml(pos) + "s von " + escapeHtml(p.team) + " mit Einsatz in Woche " + week + ".</div>";
    }
    var rowsHtml = rows.map(function (x) {
      var isSelf = x.pid === pid;
      var r = x.r;
      return "<tr" + (isSelf ? ' class="mine"' : "") + "><td>" + pnLink(x.pid) + (isSelf ? ' <span style="color:var(--gold);">★</span>' : "") + "</td>" +
        cols.map(function (c) { return sc(c.f ? c.f(r) : r[c.k]); }).join("") +
        '<td class="grp-l" style="font-weight:800;">' + (r.pts !== null ? r.pts.toFixed(1) : "–") + "</td><td>" + (x.rank ? escapeHtml(pos) + x.rank : "–") + "</td><td>" + (r.snapPct !== null ? r.snapPct + "%" : "–") + "</td></tr>";
    }).join("");
    return nav + '<div class="hint" style="margin:0 0 10px;">Vergleich mit allen ' + escapeHtml(pos) + "s im Team " + escapeHtml(p.team) + " in Woche " + week + ". Ein Klick auf einen Namen öffnet dessen Karte.</div>" +
      '<div style="overflow-x:auto;"><table><thead><tr><th>Spieler</th>' + cols.map(function (c) { return "<th>" + c.h + "</th>"; }).join("") +
      '<th class="grp-l">Punkte</th><th>Rang</th><th>Snap%</th></tr></thead><tbody>' + rowsHtml + "</tbody></table></div>";
  }


  // Matchup-Einfluss je Spieler für das aktive eigene Ranking (nur auf der Seite "Ranking Experten")
  function expertMatchupEditorHtml(pid, pos) {
    if (!(state.tab === "ranking" && state.rankSub === "expert")) return "";
    var cfg = expertActive();
    if (!cfg) return "";
    var box = '<div style="margin-top:22px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--gold-light);">';
    if (cfg.base !== "week") {
      return box + '<div style="font-weight:800;margin-bottom:4px;">Matchup-Einfluss im Ranking „' + escapeHtml(cfg.name) + '“</div>' +
        '<div class="hint" style="margin:0;">Das Ranking nutzt die Basis „Rest of Season“ — Matchups wirken nur bei der Basis „Woche“.</div></div>';
    }
    var mi = matchupInfoFor(pid, cfg.week);
    var pct = cfg.matchupPlayers[pid] !== undefined ? cfg.matchupPlayers[pid] : 100;
    var info = "";
    if (!mi) {
      info = "Für Woche " + cfg.week + " ist kein Gegner bekannt (Bye-Week oder Spielplan fehlt) — ein Matchup-Einfluss hätte keine Wirkung.";
    } else if (mi.rank === null) {
      info = "Gegner Woche " + cfg.week + ": " + escapeHtml(mi.opp) + " — Verteidigungsrang noch nicht verfügbar (benötigt gespielte Wochen).";
    } else {
      var full = matchupMultiplier(mi.rank);
      var eff = 1 + (pct / 100) * (full - 1);
      var base = rankValueFor(pid, "week", cfg.week);
      info = "Gegner Woche " + cfg.week + ": " + escapeHtml(mi.opp) + (mi.isHome ? " (Heim)" : " (Auswärts)") + " · Def. vs " + escapeHtml(pos) + ": Rang " + mi.rank + " von 32 · volle Wirkung (100 %): " +
        (full >= 1 ? "+" : "") + ((full - 1) * 100).toFixed(1) + " %";
      if (pct !== 0 && base !== null) info += "<br>Aktuell " + pct + " %: " + (eff >= 1 ? "+" : "") + ((eff - 1) * 100).toFixed(1) + " % → " + (base * eff).toFixed(1) + " statt " + base.toFixed(1) + " Pkt.";
    }
    return box + '<div style="font-weight:800;margin-bottom:4px;">Matchup-Einfluss im Ranking „' + escapeHtml(cfg.name) + '“</div>' +
      '<div class="hint" style="margin:0 0 10px;font-size:13px;">Gilt nur für diesen Spieler. Standard ist 100 % (volle Wirkung); 0 % = Matchup wird ignoriert, bis 200 % wird es verstärkt.</div>' +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">' +
      '<input type="range" id="ex-card-matchup" data-pid="' + escapeHtml(pid) + '" min="0" max="200" step="10" value="' + pct + '" style="width:220px;" />' +
      '<span id="ex-card-matchup-val" style="font-weight:800;min-width:48px;">' + pct + ' %</span>' +
      '<button type="button" class="ex-btn sm" id="ex-card-matchup-reset" data-pid="' + escapeHtml(pid) + '"' + (pct !== 100 ? "" : " disabled") + '>Auf 100 % zurücksetzen</button></div>' +
      '<div style="font-size:13px;margin-top:10px;color:var(--muted);line-height:1.5;">' + info + "</div></div>";
  }

        (state.nflverseUploadError ? '<div class="error" style="margin-bottom:10px;">' + escapeHtml(state.nflverseUploadError) + "</div>" : "") +
        '<div><input type="file" class="nfl-file-input" accept=".csv" multiple style="font-size:12px;" /></div>' +

      nflNote = '<div class="error" style="margin:0 0 10px;">' + escapeHtml(state.nflverseError) + "</div>";

      nflNote +

  function renderManualTradeBuilder() {
    var wrap = el("<div></div>");

      '<div class="chip-list">' + others.map(function (r) {

      }).join("") + "</div></div>"
    ));

    if (state.manualPartnerId === null) return wrap;
    var partnerRoster = rosterById(state.manualPartnerId);

    if (state.playersLoading || !state.players || state.projectionsLoading || !state.projections) {

    function playerToggleRow(pid, roster, side) {

      var selected = selArr.indexOf(pid) !== -1;

      var checkMark = selected ? '<span style="color:' + (side === "give" ? "var(--red)" : "var(--green)") + ';font-weight:800;">✓ ausgewählt</span>' : "";
      var meta = badge + '<span style="font-size:12px;color:var(--muted);">' + pts.toFixed(1) + " Pkt.</span>" + checkMark;

    var theirItems = groupLabel("STARTER") + theirSplit.starters.map(function (pid) { return playerToggleRow(pid, partnerRoster, "receive"); }).join("") +

    wrap.appendChild(el(

      '<div style="display:flex;gap:16px;flex-wrap:wrap;">' +
      '<div style="flex:1;min-width:220px;"><div class="label" style="color:var(--red);font-weight:700;font-size:12px;margin-bottom:8px;">Dein Kader</div>' + myItems + "</div>" +
      '<div style="flex:1;min-width:220px;"><div class="label" style="color:var(--green);font-weight:700;font-size:12px;margin-bottom:8px;">Kader ' + escapeHtml(teamName(partnerRoster)) + "</div>" + theirItems + "</div>" +
      "</div></div>"
    ));

    if (state.manualGive.length === 0 || state.manualReceive.length === 0) {
      wrap.appendChild(el('<div class="card"><div class="hint" style="margin:0;">Wähle mindestens einen Spieler auf beiden Seiten, um die Bewertung zu sehen.</div></div>'));
      return wrap;
    }

    var giveObjs = state.manualGive.map(function (pid) { return { pid: pid, name: nameOf(pid), pts: projPointsFor(pid), starter: isStarter(myRoster, pid), pos: positionOf(pid) }; });
    var receiveObjs = state.manualReceive.map(function (pid) { return { pid: pid, name: nameOf(pid), pts: projPointsFor(pid), starter: isStarter(partnerRoster, pid), pos: positionOf(pid) }; });

    var mcBase = ensureForecastSimulation();
    var impact = mcBase ? simulateTradeImpact(myRoster, partnerRoster, { give: giveObjs, receive: receiveObjs }) : null;

    if (impact) {
      var verdictDiff = impact.myDelta - impact.partnerDelta;
      var verdict = verdictDiff > 1.5 ? "Vorteil für dich" : (verdictDiff < -1.5 ? "Vorteil für Gegner" : "Ausgeglichen");
      var verdictColor = verdictDiff > 1.5 ? "var(--green)" : (verdictDiff < -1.5 ? "var(--red)" : "var(--gold)");
      var accept = impact.partnerDelta >= 0 && Math.abs(verdictDiff) <= 3 ? "Hoch"
        : impact.partnerDelta >= -1 ? "Mittel" : "Niedrig";
      var acceptColor = accept === "Hoch" ? "var(--green)" : (accept === "Niedrig" ? "var(--red)" : "var(--gold)");
      var mineBeforePct = mcBase.byRoster[state.myRosterId] ? mcBase.byRoster[state.myRosterId].playoffPct : 0;
      var partnerBeforePct = mcBase.byRoster[partnerRoster.roster_id] ? mcBase.byRoster[partnerRoster.roster_id].playoffPct : 0;
      var playoffDeltaMine = (impact.myAfterPct !== null ? impact.myAfterPct : mineBeforePct) - mineBeforePct;
      var playoffDeltaPartner = (impact.partnerAfterPct !== null ? impact.partnerAfterPct : partnerBeforePct) - partnerBeforePct;

      wrap.appendChild(el(
        '<div class="card"><h2>Bewertung</h2>' +

        '<div class="stat-col"><div class="label">Progn. Punkte (Rest-Saison)</div><div style="font-size:13px;">Du: ' + fmtDelta(impact.myDelta) + '</div><div style="font-size:13px;">Gegner: ' + fmtDelta(impact.partnerDelta) + "</div></div>" +
        '<div class="stat-col"><div class="label">Playoff-Chance</div><div style="font-size:13px;">Du: ' + fmtDelta(playoffDeltaMine, "%") + '</div><div style="font-size:13px;">Gegner: ' + fmtDelta(playoffDeltaPartner, "%") + "</div></div>" +
        "</div></div>"
      ));
    }

    return wrap;
  }

  function renderTradeFinder() {
    var wrap = el("<div></div>");
    var myRoster = rosterById(state.myRosterId);
    var positions = activePositions();

    wrap.appendChild(renderManualTradeBuilder());
    wrap.appendChild(el('<div class="hint" style="margin:4px 0 14px;font-weight:700;color:var(--muted);">— oder automatische Vorschläge nach Position —</div>'));

    function tile(pos, mode) {
      var selArr = mode === "give" ? state.tradeGive : state.tradeReceive;

      var cls = "pos-tile trade-" + mode + "-choice" + (isActive ? (" active-" + mode) : "") + (atCap ? " disabled" : "");
      var check = isActive ? '<span class="tile-check" style="background:' + (mode === "give" ? "var(--red)" : "var(--green)") + ';">✓</span>' : "";
      return '<div class="' + cls + '" data-pos="' + pos + '" data-mode="' + mode + '">' + check + escapeHtml(pos) + "</div>";

    wrap.appendChild(el(
      '<div class="card"><h2>Positionsbasierte Suche</h2>' +

      return wrap;

    if (state.playersLoading || !state.players || state.projectionsLoading || !state.projections) {
      wrap.appendChild(el('<div class="card"><div class="loading">Daten werden geladen…</div></div>'));
      return wrap;
    }
    if (state.projectionsError) {
      wrap.appendChild(el('<div class="card"><div class="error" style="margin-top:0;">' + escapeHtml(state.projectionsError) + "</div></div>"));

      .map(function (r) {

      });

      });

      var impactHtml = "";
      if (impact) {

          '<div class="stat-col"><div class="label">Playoff-Chance</div><div style="font-size:13px;">Du: ' + fmtDelta(playoffDeltaMine, "%") + '</div><div style="font-size:13px;">Gegner: ' + fmtDelta(playoffDeltaPartner, "%") + "</div></div>" +

    if (lastCompletedWeek < 1) {
      wrap.appendChild(el('<div class="card"><div class="hint" style="margin:0;">Noch keine abgeschlossene Woche in dieser Saison — der Wochenrückblick startet nach der ersten gespielten Woche.</div></div>'));

    }

    if (state.reviewWeek === null) state.reviewWeek = lastCompletedWeek;
    if (state.reviewWeek > lastCompletedWeek) state.reviewWeek = lastCompletedWeek;
    if (state.reviewWeek < 1) state.reviewWeek = 1;

    var week = state.reviewWeek;
    var myRoster = rosterById(state.myRosterId);

    wrap.appendChild(el(
      '<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;">' +
      '<button class="secondary review-week-nav" data-dir="-1" ' + (week <= 1 ? "disabled" : "") + ' style="padding:8px 14px;">← Woche ' + (week - 1) + "</button>" +
      '<div style="font-weight:800;font-size:16px;">Woche ' + week + "</div>" +
      '<button class="secondary review-week-nav" data-dir="1" ' + (week >= lastCompletedWeek ? "disabled" : "") + ' style="padding:8px 14px;">Woche ' + (week + 1) + " →</button>" +
      "</div>"
    ));

    if (state.playersLoading || !state.players || !state.seasonMatchups) {
      wrap.appendChild(el('<div class="card"><div class="loading">Daten werden geladen…</div></div>'));
      return wrap;
    }

    var rosterEntry = getRosterWeekEntry(week, state.myRosterId);
    ensureWeekProjection(week);
    if (!rosterEntry) {
      wrap.appendChild(el('<div class="card"><div class="hint" style="margin:0;">Für diese Woche liegen keine Daten vor.</div></div>'));
      return wrap;
    }

    // ---- Optimales Lineup ----
    var optimal = optimalLineupForWeek(rosterEntry);
    var actualStarted = (rosterEntry.starters || []).filter(function (pid) { return pid && pid !== "0"; })
      .reduce(function (sum, pid) { return sum + weeklyActualPointsFor(rosterEntry, pid); }, 0);
    var wasted = Math.max(0, optimal.total - actualStarted);

    var swaps = [];
    var actualRaw = (rosterEntry.starters || []);
    var actualSet = actualRaw.filter(function (pid) { return pid && pid !== "0"; });
    var optPicks = (optimal.bySlot || []).filter(function (p) { return p && p.pid; });
    var optSet = optPicks.map(function (p) { return p.pid; });
    // Spieler, die raus müssten (inkl. leere Slots) und Spieler, die rein müssten — unabhängig von der Slot-Verteilung
    var outs = actualRaw.filter(function (pid) { return !pid || pid === "0" || optSet.indexOf(pid) === -1; })
      .map(function (pid) { return { pid: pid, name: (pid && pid !== "0") ? nameOf(pid) : "(leerer Slot)", pts: (pid && pid !== "0") ? weeklyActualPointsFor(rosterEntry, pid) : 0, pos: (pid && pid !== "0") ? positionOf(pid) : "" }; });
    var ins = optPicks.filter(function (p) { return actualSet.indexOf(p.pid) === -1; })
      .map(function (p) { return { pid: p.pid, name: p.name || nameOf(p.pid), pts: p.pts, pos: positionOf(p.pid) }; });
    ins.sort(function (x, y) { return y.pts - x.pts; });
    outs.sort(function (x, y) { return x.pts - y.pts; });
    ins.forEach(function (inn) {
      var idx = -1;
      for (var k = 0; k < outs.length; k++) { if (outs[k].pos && outs[k].pos === inn.pos) { idx = k; break; } }
      if (idx < 0) idx = 0;
      var out = outs.splice(idx, 1)[0];
      if (!out) return;
      var gain = inn.pts - out.pts;
      if (Math.abs(gain) > 0.05) swaps.push({ slotType: "", actualName: out.name, actualPts: out.pts, optimalName: inn.name, optimalPts: inn.pts, gain: gain });
    });
    swaps.sort(function (a, b) { return b.gain - a.gain; });

    wrap.appendChild(el(
      '<div class="card"><h2>Optimales Lineup</h2>' +
      '<div class="stat-cols" style="margin-bottom:' + (swaps.length ? "14px" : "0") + ';">' +
      '<div class="stat-col"><div class="label">Tatsächlich aufgestellt</div><div class="score-num" style="font-size:22px;">' + actualStarted.toFixed(1) + "</div></div>" +
      '<div class="stat-col"><div class="label">Optimal möglich gewesen</div><div class="score-num" style="font-size:22px;color:var(--green);">' + optimal.total.toFixed(1) + "</div></div>" +
      '<div class="stat-col"><div class="label">Auf der Bank liegen gelassen</div><div class="score-num" style="font-size:22px;color:' + (wasted > 0.5 ? "var(--red)" : "var(--muted)") + ';">' + wasted.toFixed(1) + "</div></div>" +
      "</div>" +
      (swaps.length
        ? swaps.map(function (s) {
            return '<div class="alt-row"><span>' + escapeHtml(s.actualName) + " (" + s.actualPts.toFixed(1) + ")</span><span>→ " + escapeHtml(s.optimalName) + " (" + s.optimalPts.toFixed(1) + ") <b style=\"color:var(--red);\">+" + s.gain.toFixed(1) + "</b></span></div>";
          }).join("")
        : '<div class="hint" style="margin:0;">Lineup war optimal — keine bessere Aufstellung möglich.</div>') +
      "</div>"
    ));

    // ---- Beste & schlechteste Leistung ----
    var allEntries = Object.keys(rosterEntry.players_points || {}).map(function (pid) {
      return { pid: pid, name: nameOf(pid), pos: positionOf(pid), pts: rosterEntry.players_points[pid], starter: (rosterEntry.starters || []).indexOf(pid) !== -1 };
    }).filter(function (e) { return typeof e.pts === "number"; });

    var starterEntries = allEntries.filter(function (e) { return e.starter; });

    if (starterEntries.length > 0) {
      var best = starterEntries.slice().sort(function (a, b) { return b.pts - a.pts; })[0];
      var worst = starterEntries.slice().sort(function (a, b) { return a.pts - b.pts; })[0];
      function perfCard(label, e, color) {
        var badge = e.starter ? '<span class="badge-start">Start</span>' : '<span class="badge-bench">Bank</span>';
        return '<div class="stat-col"><div class="label" style="color:' + color + ';font-weight:700;">' + label + "</div>" +
          '<div style="font-weight:700;font-size:15px;margin:4px 0;">' + pnObj(e) + "</div>" +
          '<div style="display:flex;gap:6px;align-items:center;justify-content:center;">' + posTag(e.pos) + badge + '<span style="font-weight:800;color:' + color + ';">' + e.pts.toFixed(1) + "</span></div></div>";
      }
      wrap.appendChild(el(
        '<div class="card"><h2>Beste &amp; schlechteste Leistung</h2><div class="stat-cols">' +
        perfCard("Beste Leistung", best, "var(--green)") +
        perfCard("Schlechteste Leistung", worst, "var(--red)") +
        "</div></div>"
      ));
    }

    // ---- Größte Steigerung ggü. Vorwoche ----
    if (week > 1) {
      var prevEntry = getRosterWeekEntry(week - 1, state.myRosterId);
      if (prevEntry) {
        var deltas = allEntries.map(function (e) {
          var prevPts = prevEntry.players_points && prevEntry.players_points[e.pid];
          if (typeof prevPts !== "number") return null;
          return { name: e.name, pos: e.pos, pts: e.pts, prevPts: prevPts, delta: e.pts - prevPts };
        }).filter(Boolean);
        if (deltas.length > 0) {
          var topDelta = deltas.sort(function (a, b) { return b.delta - a.delta; })[0];
          if (topDelta.delta > 0.05) {
            wrap.appendChild(el(
              '<div class="card"><h2>Größte Steigerung ggü. Vorwoche</h2>' +
              '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
              posTag(topDelta.pos) + '<span style="font-weight:700;font-size:15px;">' + pnObj(topDelta) + "</span>" +
              '<span style="color:var(--muted);">' + topDelta.prevPts.toFixed(1) + " → " + topDelta.pts.toFixed(1) + "</span>" +
              '<span style="font-weight:800;color:var(--green);">+' + topDelta.delta.toFixed(1) + "</span>" +
              "</div></div>"
            ));
          }
        }
      }
    }

    // ---- Größte Prognose-Verfehlungen & Übertreffer ----
    if (state.weekProjLoading[week]) {
      wrap.appendChild(el('<div class="card"><h2>Prognose-Verfehlungen &amp; Übertreffer</h2><div class="loading">Prognose-Daten für diese Woche werden geladen…</div></div>'));
    } else if (state.weeklyProjections && state.weeklyProjections[week]) {
      var missList = allEntries.map(function (e) {
        var proj = weeklyProjPointsFor(week, e.pid);
        if (proj === null) return null;
        return { name: e.name, pos: e.pos, pts: e.pts, proj: proj, diff: proj - e.pts, starter: e.starter };
      }).filter(Boolean);

      function diffRow(item, color, sign) {
        var badge = item.starter ? '<span class="badge-start">Start</span>' : '<span class="badge-bench">Bank</span>';
        return '<div class="roster-item"><span>' + pnObj(item) + "</span>" +
          '<span style="display:flex;gap:8px;align-items:center;">' +
          '<span style="font-size:12px;color:var(--muted);">Prognose ' + item.proj.toFixed(1) + " → Ist " + item.pts.toFixed(1) + "</span>" +
          badge + posTag(item.pos) +
          '<span style="font-weight:800;color:' + color + ';">' + sign + Math.abs(item.diff).toFixed(1) + "</span>" +
          "</span></div>";
      }

      if (missList.length > 0) {
        var worstMisses = missList.filter(function (m) { return m.diff > 0.05; }).sort(function (a, b) { return b.diff - a.diff; }).slice(0, 3);
        var bestBeats = missList.filter(function (m) { return m.diff < -0.05; }).sort(function (a, b) { return a.diff - b.diff; }).slice(0, 3);

        wrap.appendChild(el(
          '<div class="card"><h2>Größte Prognose-Verfehlungen' + infoBtn("prognose-miss") + "</h2>" +
          infoBox("prognose-miss", "Die Spieler, die am weitesten hinter ihrer Wochen-Projektion zurückgeblieben sind.") +
          (worstMisses.length > 0
            ? worstMisses.map(function (m) { return diffRow(m, "var(--red)", "−"); }).join("")
            : '<div class="hint" style="margin:0;">Alle Spieler haben ihre Projektion in dieser Woche erreicht oder übertroffen.</div>') +
          "</div>"
        ));

        wrap.appendChild(el(
          '<div class="card"><h2>Größte Prognose-Übertreffer' + infoBtn("prognose-beat") + "</h2>" +
          infoBox("prognose-beat", "Die Spieler, die ihre Wochen-Projektion am deutlichsten übertroffen haben.") +
          (bestBeats.length > 0
            ? bestBeats.map(function (m) { return diffRow(m, "var(--green)", "+"); }).join("")
            : '<div class="hint" style="margin:0;">Kein Spieler hat seine Projektion in dieser Woche übertroffen.</div>') +
          "</div>"
        ));
      }
    } else {
      wrap.appendChild(el('<div class="card"><h2>Prognose-Verfehlungen &amp; Übertreffer</h2><div class="hint" style="margin:0;">Für diese Woche sind keine Prognose-Daten verfügbar (inoffizielle Sleeper-Schnittstelle).</div></div>'));
    }

    // ---- Marktbeobachtung ----
    if (week === lastCompletedWeek) {
      loadTrendingAdds();
      if (state.trendingAddsLoading) {
        wrap.appendChild(el('<div class="card"><h2>Marktbeobachtung</h2><div class="loading">Trend-Daten werden geladen…</div></div>'));
      } else if (state.trendingAddsError) {
        wrap.appendChild(el('<div class="card"><h2>Marktbeobachtung</h2><div class="error" style="margin-top:0;">' + escapeHtml(state.trendingAddsError) + "</div></div>"));
      } else if (state.trendingAdds && state.players) {
        var rosteredIds = {};
        (state.rosters || []).forEach(function (r) { (r.players || []).forEach(function (pid) { rosteredIds[pid] = true; }); });
        var allFreeAgents = state.trendingAdds.filter(function (t) { return !rosteredIds[t.player_id] && state.players[t.player_id]; });

        if (allFreeAgents.length === 0) {
          wrap.appendChild(el('<div class="card"><h2>Marktbeobachtung</h2><div class="hint" style="margin:0;">Aktuell keine plattformweit gefragten Spieler, die in eurer Liga noch frei sind.</div></div>'));
        } else {
          var posRankForMarket = computePositionRankRows(state.myRosterId);
          var weakPositions = posRankForMarket.rankRows.filter(function (r) { return r.percentile <= 0.4; }).map(function (r) { return r.pos; });

          function faRow(t) {
            var pos = positionOf(t.player_id);
            return '<div class="roster-item"><span>' + pnLink(t.player_id) + '</span><span style="display:flex;gap:8px;align-items:center;">' +
              '<span style="font-size:12px;color:var(--muted);">' + t.count.toLocaleString("de-DE") + " Adds (24h)</span>" +
              posTag(pos) + "</span></div>";
          }

          function byPositionOrder(a, b) {
            var ia = POSITION_ORDER.indexOf(positionOf(a.player_id)); var ib = POSITION_ORDER.indexOf(positionOf(b.player_id));
            ia = ia === -1 ? 99 : ia; ib = ib === -1 ? 99 : ib;
            return ia - ib;
          }

          var recommended = allFreeAgents.filter(function (t) { return weakPositions.indexOf(positionOf(t.player_id)) !== -1; }).slice(0, 5).sort(byPositionOrder);
          var rest = allFreeAgents.filter(function (t) { return recommended.indexOf(t) === -1; }).slice(0, 8).sort(byPositionOrder);

          var recHtml = "";
          if (weakPositions.length === 0) {
            recHtml = '<div class="hint" style="margin-bottom:14px;">Keine ausgeprägte Schwachstelle erkannt — keine gezielte Empfehlung möglich.</div>';
          } else if (recommended.length === 0) {
            recHtml = '<div class="hint" style="margin-bottom:14px;">Aktuell keine Trending-Spieler für deine Schwachstellen (' + weakPositions.map(function(p){return escapeHtml(p);}).join(", ") + ') verfügbar.</div>';
          } else {
            recHtml = '<div class="hint" style="margin-bottom:10px;">Passend zu deinen schwächsten Positionsgruppen: ' + weakPositions.map(function(p){return escapeHtml(p);}).join(", ") + "</div>" +
              '<div class="roster-grid" style="margin-bottom:16px;">' + recommended.map(faRow).join("") + "</div>";
          }

          wrap.appendChild(el(
            '<div class="card"><h2>Marktbeobachtung' + infoBtn("marktbeobachtung") + "</h2>" +
            infoBox("marktbeobachtung", "Plattformweit meistgeholte Spieler der letzten 24h (Sleeper Trending Adds), abgeglichen mit euren Liga-Rostern. \"Empfehlung für dich\" markiert Spieler an Positionen, bei denen du im Ligavergleich in den unteren 40% liegst (siehe Schwachstellen-Analyse in Mein Team).") +
            '<div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;">EMPFEHLUNG FÜR DICH</div>' +
            recHtml +
            (rest.length > 0 ? '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;">WEITERE TRENDING-SPIELER</div><div class="roster-grid">' + rest.map(faRow).join("") + "</div>" : "") +
            "</div>"
          ));
        }
      }
    }

    return wrap;
  }

  function entryProjectedTotal(entry, week) {
    if (!entry || !state.weeklyProjections || !state.weeklyProjections[week]) return null;
    var total = 0, found = false;
    (entry.starters || []).forEach(function (pid) {
      if (!pid || pid === "0") return;
      var v = weeklyProjPointsFor(week, pid);
      if (v === null) return;
      total += v * weekAvailabilityFactor(pid, week);
      found = true;
    });
    return found ? total : null;
  }

  var INJURY_RISK = { IR: 1, PUP: 1, Suspended: 1, NA: 1, COV: 1, Out: 0.95, Doubtful: 0.75, Questionable: 0.35 };

  function highlightSpotEl(rosterEntry, rosterId, who) {
    var week = state.week;
    var starters = (rosterEntry.starters || []).filter(function (pid) { return pid && pid !== "0"; });
    var projOf = function (pid) {
      var v = weeklyProjPointsFor(week, pid);
      return v === null ? null : v * weekAvailabilityFactor(pid, week);
    };
    function row(left, right, sub) {
      return '<div style="padding:8px 0;border-top:1px solid var(--border);">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span style="font-weight:700;">' + left + "</span><span style=\"white-space:nowrap;\">" + right + "</span></div>" +
        (sub ? '<div style="font-size:12px;color:var(--muted);margin-top:2px;">' + sub + "</div>" : "") + "</div>";
    }
    function col(title, color, inner) {
      return '<div><div style="font-size:12px;font-weight:800;letter-spacing:0.3px;color:' + color + ';margin-bottom:6px;">' + title + "</div>" + inner + "</div>";
    }

    // 1) Auf wen kommt es an: größte projizierte Starter dieser Woche
    var withProj = starters.map(function (pid) { return { pid: pid, proj: projOf(pid) }; }).filter(function (e) { return e.proj !== null && e.proj > 0; });
    var teamTotal = withProj.reduce(function (sum, e) { return sum + e.proj; }, 0);
    var keyHtml;
    if (withProj.length === 0) {
      keyHtml = '<div class="hint" style="margin:0;">Noch keine Wochenprojektion verfügbar.</div>';
    } else {
      keyHtml = withProj.sort(function (a, b) { return b.proj - a.proj; }).slice(0, 3).map(function (e) {
        var mi = matchupInfoFor(e.pid, week);
        var sub = Math.round(e.proj / teamTotal * 100) + " % " + (who.key === "me" ? "deiner" : "seiner") + " projizierten Punkte" + (mi ? " · " + (mi.isHome ? "vs " : "@ ") + escapeHtml(mi.opp) + (mi.rank !== null ? " (Def. Rang " + mi.rank + ")" : "") : "");
        return row(pnLink(e.pid) + " " + posTag(positionOf(e.pid)), '<b style="color:var(--green);">Proj. ' + e.proj.toFixed(1) + "</b>", sub);
      }).join("");
    }

    // 2) Über-Performer des letzten Spieltags (Ist vs. Erwartung)
    var last = week - 1;
    var overHtml;
    var lastEntry = last >= 1 ? getRosterWeekEntry(last, rosterId) : null;
    if (!lastEntry || !lastEntry.players_points) {
      overHtml = '<div class="hint" style="margin:0;">Noch kein abgeschlossener Spieltag.</div>';
    } else {
      var overs = [];
      Object.keys(lastEntry.players_points).forEach(function (pid) {
        var pts = lastEntry.players_points[pid];
        if (typeof pts !== "number" || pid === "0") return;
        var exp = weeklyProjPointsFor(last, pid), fallback = false;
        if (exp === null) {
          var sum = 0, n = 0;
          for (var pw = 1; pw < last; pw++) {
            var pe = getRosterWeekEntry(pw, rosterId);
            var pv = pe && pe.players_points && pe.players_points[pid];
            if (typeof pv === "number") { sum += pv; n++; }
          }
          if (n === 0) return;
          exp = sum / n; fallback = true;
        }
        overs.push({ pid: pid, pts: pts, exp: exp, diff: pts - exp, fallback: fallback, starter: (lastEntry.starters || []).indexOf(pid) !== -1 });
      });
      overs = overs.filter(function (e) { return e.diff > 0.5; }).sort(function (a, b) { return b.diff - a.diff; }).slice(0, 3);
      overHtml = overs.length === 0
        ? '<div class="hint" style="margin:0;">Niemand lag letzten Spieltag klar über der Erwartung (oder Vergleichswerte fehlen).</div>'
        : overs.map(function (e) {
          return row(pnLink(e.pid) + " " + posTag(positionOf(e.pid)) + (e.starter ? "" : ' <span class="badge-bench">Bank</span>'),
            '<b style="color:var(--green);">+' + e.diff.toFixed(1) + "</b>",
            "Ist " + e.pts.toFixed(1) + " · Erwartet " + e.exp.toFixed(1) + (e.fallback ? "*" : ""));
        }).join("");
    }

    // 3) Größtes Ausfallrisiko unter den Startern
    var risky = starters.map(function (pid) {
      var p = state.players && state.players[pid];
      var st = p && p.injury_status;
      return st ? { pid: pid, status: st, body: p.injury_body_part || "", risk: INJURY_RISK[st] !== undefined ? INJURY_RISK[st] : 0.5, proj: projOf(pid) } : null;
    }).filter(Boolean).sort(function (a, b) { return b.risk - a.risk || (b.proj || 0) - (a.proj || 0); }).slice(0, 3);
    var riskHtml = risky.length === 0
      ? '<div class="hint" style="margin:0;">Keiner ' + (who.key === "me" ? "deiner" : "seiner") + ' Starter hat eine Verletzungsmeldung.</div>'
      : risky.map(function (e) {
        var c = e.risk >= 0.75 ? "var(--red)" : "var(--gold)";
        var txt = e.risk >= 0.95 ? "fällt aus" : (e.risk >= 0.75 ? "sehr unsicher" : "unsicher");
        return row(pnLink(e.pid) + " " + posTag(positionOf(e.pid)),
          '<span class="severity-badge" style="background:transparent;border:1.5px solid ' + c + ";color:" + c + ';padding:2px 8px;font-size:11px;">' + escapeHtml(e.status) + "</span>",
          txt + (e.body ? " · " + escapeHtml(e.body) : "") + (e.proj !== null ? " · Proj. " + e.proj.toFixed(1) : ""));
      }).join("");

    var open = !!state.highlightOpen[who.key];
    var body = open ? (
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:10px;">' +
      col("AUF WEN KOMMT ES AN", "var(--green)", keyHtml) +
      col(last >= 1 ? "ÜBER-PERFORMER (WOCHE " + last + ")" : "ÜBER-PERFORMER", "var(--gold)", overHtml) +
      col("GRÖSSTES AUSFALLRISIKO", "var(--red)", riskHtml) +
      "</div>") : "";
    return el('<div class="card"><div class="highlight-toggle" data-key="' + who.key + '" style="display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;">' +
      "<h2 style=\"margin:0;\">Highlight-Spot — " + escapeHtml(who.label) + (who.key === "me" ? infoBtn("highlight-spot") : "") + "</h2>" +
      '<span class="bye-week-chevron">' + (open ? "▲" : "▼") + "</span></div>" + (who.key === "me" ? infoBox("highlight-spot", "Auf wen kommt es an: die Starter mit den meisten projizierten Punkten dieser Woche und ihr Anteil an der Gesamtprojektion. Über-Performer: Spieler, die am letzten Spieltag die meisten Punkte über ihrer damaligen Wochenprojektion erzielt haben (mit * = keine Projektion verfügbar, dann gilt der Ø der Vorwochen). Ausfallrisiko: Starter mit Verletzungsmeldung, sortiert nach der Wahrscheinlichkeit eines Ausfalls laut Status (IR/Out am höchsten, dann Doubtful, dann Questionable). Alles eigene Schätzungen auf Basis der Sleeper-Daten.") : "") + body + "</div>");
  }

  function renderNews() {
    var wrap = el("<div></div>");
    var myRoster = rosterById(state.myRosterId);
    ensureWeekProjection(state.week);
    if (state.week > 1) ensureWeekProjection(state.week - 1);

    // ---- Wochenübersicht mit Punktestand ----
    var rosterEntry = getRosterWeekEntry(state.week, state.myRosterId);
    if (rosterEntry) {
      var opp = (state.seasonMatchups[state.week] || []).filter(function (m) {
        return m.matchup_id === rosterEntry.matchup_id && m.roster_id !== state.myRosterId;
      })[0];
      var oppRoster = opp ? rosterById(opp.roster_id) : null;
      var newsWinProb = opp ? matchupWinProbability(state.myRosterId, opp.roster_id, state.week) : null;
      function projTxt(v) { return v === null ? "–" : v.toFixed(1); }
      var allMatchupsHtml = (function () {
        var wk = state.seasonMatchups[state.week] || [];
        var groups = {};
        wk.forEach(function (m) { (groups[m.matchup_id] = groups[m.matchup_id] || []).push(m); });

        wrap.appendChild(el('<div style="margin-bottom:4px;"><h2 style="margin:0 0 12px;">Liga-Transaktionen</h2></div>'));

      var unhide = document.getElementById("ex-unhide");
      if (unhide) unhide.addEventListener("click", function () { var c = active(); if (!c) return; c.hidden = {}; commit(); });

      document.querySelectorAll(".ex-adj").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var c = active(); if (!c) return;
          var pid = inp.getAttribute("data-pid");
          var v = parseFloat(inp.value);
          if (isNaN(v) || v === 0) delete c.overrides[pid]; else c.overrides[pid] = v;
          commit();
        });
      });
      document.querySelectorAll(".ex-move").forEach(function (b) {
        b.addEventListener("click", function () {
          var c = active(); if (!c) return;
          var ov = parseFloat(b.getAttribute("data-ov"));
          if (isNaN(ov)) return;
          var pid = b.getAttribute("data-pid");
          if (ov === 0) delete c.overrides[pid]; else c.overrides[pid] = ov;
          commit();
        });
      });
      document.querySelectorAll(".ex-reset").forEach(function (b) {
        b.addEventListener("click", function () { var c = active(); if (!c) return; delete c.overrides[b.getAttribute("data-pid")]; delete c.matchupPlayers[b.getAttribute("data-pid")]; commit(); });
      });
      document.querySelectorAll(".ex-hide").forEach(function (b) {
        b.addEventListener("click", function () { var c = active(); if (!c) return; c.hidden[b.getAttribute("data-pid")] = true; commit(); });
      });
      document.querySelectorAll(".expert-name").forEach(function (n) {
        n.addEventListener("click", function () {
          state.statsCardPid = n.getAttribute("data-pid");
          state.playerCardTab = "upcoming";
          state.teamCompareWeek = null;
          render();
        });
      });
    })();

    document.querySelectorAll(".highlight-toggle").forEach(function (hd) {
      hd.addEventListener("click", function (ev) {
        if (ev.target.closest && ev.target.closest(".info-btn, button")) return;
        var k = hd.getAttribute("data-key");
        state.highlightOpen[k] = !state.highlightOpen[k];
        render();
      });
    });

    document.querySelectorAll(".power-scope").forEach(function (btn) {
      btn.addEventListener("click", function () { state.powerScope = btn.getAttribute("data-scope"); render(); });
    });

    var oppSelect = document.getElementById("opp-select");
    if (oppSelect) oppSelect.addEventListener("change", function () {
      state.compareRosterId = oppSelect.value === "" ? null : parseInt(oppSelect.value, 10);
      render();
    });

    document.querySelectorAll(".calc-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.calcMode = btn.getAttribute("data-mode");
        render();
      });
    });

    document.querySelectorAll(".rank-view-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.rankView = btn.getAttribute("data-view");
        render();
      });
    });

    document.querySelectorAll(".flag-toggle:not(.rank-view-toggle)").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var flag = btn.getAttribute("data-flag");
        state[flag] = !state[flag];
        state.mcForecast = null;
        render();
      });
    });

    document.querySelectorAll(".exclude-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var flag = btn.getAttribute("data-flag");
        state[flag] = !state[flag];
        render();
      });
    });

    document.querySelectorAll(".trade-give-choice, .trade-receive-choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var pos = btn.getAttribute("data-pos");
        var mode = btn.getAttribute("data-mode");
        var arr = mode === "give" ? state.tradeGive : state.tradeReceive;
        var idx = arr.indexOf(pos);
        if (idx !== -1) {
          arr.splice(idx, 1);
        } else {
          if (arr.length >= 2) arr.shift();
          arr.push(pos);
        }
        render();
      });
    });

    document.querySelectorAll(".bye-week-toggle").forEach(function (el2) {
      el2.addEventListener("click", function () {
        if (el2.classList.contains("trade-partner-toggle")) {
          var rid = el2.getAttribute("data-roster");
          state.tradePartnerExpanded[rid] = !state.tradePartnerExpanded[rid];
        } else {
          var w = el2.getAttribute("data-week");
          state.byeExpandedWeeks[w] = !state.byeExpandedWeeks[w];
        }
        render();
      });
    });

    document.querySelectorAll(".manual-partner-choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.manualPartnerId = parseInt(btn.getAttribute("data-id"), 10);
        state.manualGive = [];
        state.manualReceive = [];
        render();
      });
    });

    document.querySelectorAll(".manual-player-toggle").forEach(function (row) {
      row.addEventListener("click", function () {
        var pid = row.getAttribute("data-pid");
        var side = row.getAttribute("data-side");
        var arr = side === "give" ? state.manualGive : state.manualReceive;
        var idx = arr.indexOf(pid);
        if (idx !== -1) arr.splice(idx, 1); else arr.push(pid);
        render();
      });
    });

    document.querySelectorAll(".info-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-info");
        var box = document.getElementById("info-" + id);
        if (box) box.classList.toggle("open");
      });
    });

    document.querySelectorAll(".stats-player-row").forEach(function (rowEl) {
      rowEl.addEventListener("click", function () {
        state.statsCardPid = rowEl.getAttribute("data-pid");
        state.playerCardTab = "upcoming";
        state.teamCompareWeek = null;
        render();
      });
    });

    document.querySelectorAll(".player-card-tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.playerCardTab = btn.getAttribute("data-tab");
        render();
      });
    });

    document.querySelectorAll(".outlook-n").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.outlookN = parseInt(btn.getAttribute("data-n"), 10);
        render();
      });
    });

    var glSearch = document.getElementById("gl-search");
    if (glSearch) glSearch.addEventListener("input", function () {
      state.glossarySearch = glSearch.value;
      var listEl = document.getElementById("gl-list");
      if (listEl) listEl.innerHTML = glossaryListHtml();
    });
    function bindCons(sel, fn) {
      document.querySelectorAll(sel).forEach(function (b) { b.addEventListener("click", function () { fn(b.getAttribute("data-v")); state.consExpanded = false; state.consSearchFocus = false; render(); }); });
    }
    bindCons(".cons-pos", function (v) { state.consPos = v; });
    bindCons(".cons-f", function (v) { state.consFilter = v; });
    bindCons(".cons-view", function (v) { state.consView = v; });
    bindCons(".cons-sort", function (v) { state.consSort = v; });
    document.querySelectorAll(".cons-more").forEach(function (b) { b.addEventListener("click", function () { state.consExpanded = !state.consExpanded; render(); }); });
    var consGp = document.getElementById("cons-gp");
    if (consGp) consGp.addEventListener("change", function () { state.consMinGp = parseInt(consGp.value, 10); state.consExpanded = false; state.consSearchFocus = false; render(); });
    var consSearch = document.getElementById("cons-search");
    if (consSearch) {
      if (state.consSearchFocus) { consSearch.focus(); var ln = consSearch.value.length; try { consSearch.setSelectionRange(ln, ln); } catch (e) { /* ignore */ } }
      consSearch.addEventListener("input", function () { state.consSearch = consSearch.value; state.consSearchFocus = true; state.consExpanded = false; render(); });
    }
    function bindSimple(sel, fn) {
      document.querySelectorAll(sel).forEach(function (b) { b.addEventListener("click", function () { fn(b.getAttribute("data-v")); state.mcalExpanded = false; state.mtExpanded = false; render(); }); });
    }
    bindSimple(".mcal-pos", function (v) { state.mcalPos = v; });
    bindSimple(".mcal-f", function (v) { state.mcalFilter = v; });
    bindSimple(".mcal-n", function (v) { state.mcalWeeks = parseInt(v, 10); });
    bindSimple(".mt-pos", function (v) { state.mtPos = v; });
    bindSimple(".mt-f", function (v) { state.mtFilter = v; });
    bindSimple(".mt-sort", function (v) { state.mtSort = v; });
    document.querySelectorAll(".mcal-more").forEach(function (b) { b.addEventListener("click", function () { state.mcalExpanded = !state.mcalExpanded; render(); }); });
    document.querySelectorAll(".mt-more").forEach(function (b) { b.addEventListener("click", function () { state.mtExpanded = !state.mtExpanded; render(); }); });
    document.querySelectorAll(".fpa-dir").forEach(function (btn) {
      btn.addEventListener("click", function () { state.fpaDir = state.fpaDir === "desc" ? "asc" : "desc"; render(); });
    });
    document.querySelectorAll(".fpa-sort").forEach(function (btn) {
      btn.addEventListener("click", function () { state.fpaSort = btn.getAttribute("data-sort"); render(); });
    });
    document.querySelectorAll(".gl-cat").forEach(function (btn) {
      btn.addEventListener("click", function () { state.glossaryCat = btn.getAttribute("data-cat"); render(); });
    });

    document.querySelectorAll(".outlook-m").forEach(function (btn) {
      btn.addEventListener("click", function () { state.outlookMetric = btn.getAttribute("data-m"); render(); });
    });
    document.querySelectorAll(".outlook-v").forEach(function (btn) {
      btn.addEventListener("click", function () { state.outlookView = btn.getAttribute("data-v"); render(); });
    });

    document.querySelectorAll(".team-week-nav").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var dir = parseInt(btn.getAttribute("data-dir"), 10);
        var cur = (state.teamCompareWeek !== null && state.teamCompareWeek !== undefined) ? state.teamCompareWeek : (state.reviewWeek || 1);
        state.teamCompareWeek = cur + dir;
        render();
      });
    });

    var playerCardClose = document.getElementById("player-card-close");
    if (playerCardClose) playerCardClose.addEventListener("click", function () {
      state.statsCardPid = null;
      render();
    });

    var playerCardOverlay = document.getElementById("player-card-overlay");
    if (playerCardOverlay) playerCardOverlay.addEventListener("click", function (e) {
      if (e.target === playerCardOverlay) { state.statsCardPid = null; render(); }
    });

    document.querySelectorAll(".review-week-nav").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var dir = parseInt(btn.getAttribute("data-dir"), 10);
        state.reviewWeek = (state.reviewWeek || 1) + dir;
        render();
      });
    });

    document.querySelectorAll(".nfl-file-input").forEach(function (inp) {
      inp.addEventListener("change", function (e) {
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        var pending = files.length, names = [], errs = [];
        files.forEach(function (file) {
          var reader = new FileReader();
          reader.onload = function (ev) {
            try { names.push(nflHandleUploadText(ev.target.result)); }
            catch (err) { errs.push(file.name + ": " + err.message); }
            if (--pending === 0) done();
          };
          reader.onerror = function () { errs.push(file.name + ": nicht lesbar"); if (--pending === 0) done(); };
          reader.readAsText(file);
        });
        function done() {
          state.nflverseUploadError = errs.length ? "Datei konnte nicht gelesen werden – " + errs.join("; ") + ". Bitte die unveränderte CSV von der Release-Seite verwenden." : null;
          render();
        }
      });
    });

    var refBtn = document.getElementById("refresh-data-nav");
    if (refBtn) refBtn.addEventListener("click", function () { refreshData(); });
    ["back-to-leagues", "back-to-leagues-nav"].forEach(function (bid) {
      var backToLeagues = document.getElementById(bid);
      if (backToLeagues) backToLeagues.addEventListener("click", function () {
        state.screen = "leagues"; state.league = null; state.myRosterId = null; state.compareRosterId = null; state.menuOpen = false; render();
      });
    });
  }

  render();
})();
</script>
</body>
</html>
