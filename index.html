      "<div>" + starsHtml + "</div>" +
      '<div style="font-weight:800;color:' + color + ';font-size:13px;">' + pct.toFixed(0) + "% Sieg-Chance</div></div>";
  }

  function byeWeeksForRoster(roster) {
    var result = {};
    if (!roster || !state.nflSchedule || !state.players) return result;
    (roster.players || []).forEach(function (pid) {
      var pos = positionOf(pid);
      if (pos === "K" && state.excludeK) return;
      if (pos === "DEF" && state.excludeDEF) return;
      var p = state.players[pid];
      var team = p && p.team;
      if (!team) return;
      var bye = state.nflSchedule[team];
      if (!bye) return;
      if (!result[bye]) result[bye] = [];
      result[bye].push({ pid: pid, name: nameOf(pid), pos: pos, starter: isStarter(roster, pid) });
    });
    Object.keys(result).forEach(function (w) {
      result[w].sort(function (a, b) {
        var ia = POSITION_ORDER.indexOf(a.pos); var ib = POSITION_ORDER.indexOf(b.pos);
        ia = ia === -1 ? 99 : ia; ib = ib === -1 ? 99 : ib;
        return ia - ib;
      });
    });
    return result;
  }

  function startingSlots() {
    var arr = (state.league && state.league.roster_positions) || [];
    return arr.filter(function (p) { return p !== "BN" && p !== "IR" && p !== "TAXI"; });
  }

  function isFlexSlot(slotType) {
    return !!slotType && slotType.indexOf("FLEX") !== -1;
  }

  function flexEligiblePositions(slotType) {
    if (slotType === "IDP_FLEX") return ["DL", "LB", "DB"];
    if (slotType === "SUPER_FLEX" || slotType === "QB_FLEX") return ["QB", "RB", "WR", "TE"];
    return ["RB", "WR", "TE"];
  }

  function estimateTradeStarterDelta(roster, outgoingPids, incomingPlayers) {
    if (!roster) return 0;
    var starters = roster.starters || [];
    var isOut = {};
    outgoingPids.forEach(function (pid) { isOut[pid] = true; });

    var slots = startingSlots();
    var slotValues = [];
    for (var i = 0; i < slots.length; i++) {
      var pid = starters[i];
      if (!pid || pid === "0" || isOut[pid]) {
        slotValues.push({ slotType: slots[i], pts: 0, open: true });
      } else {
        slotValues.push({ slotType: slots[i], pts: projPointsFor(pid), open: false });
      }
    }

    incomingPlayers.forEach(function (inc) {
      var idx = -1;
      for (var a = 0; a < slotValues.length; a++) {
        if (slotValues[a].open && slotValues[a].slotType === inc.pos) { idx = a; break; }
      }
      if (idx === -1) {
        for (var b = 0; b < slotValues.length; b++) {
          if (slotValues[b].open && isFlexSlot(slotValues[b].slotType) && flexEligiblePositions(slotValues[b].slotType).indexOf(inc.pos) !== -1) { idx = b; break; }
        }
      }
      if (idx === -1) {
        var weakestIdx = -1, weakestPts = Infinity;
        slotValues.forEach(function (sv, c) {
          if (!sv.open && sv.slotType === inc.pos && sv.pts < weakestPts) { weakestPts = sv.pts; weakestIdx = c; }
        });
        if (weakestIdx !== -1 && inc.pts > weakestPts) idx = weakestIdx;
      }
      if (idx === -1) {
        var weakestFlexIdx = -1, weakestFlexPts = Infinity;
        slotValues.forEach(function (sv, d) {
          if (!sv.open && isFlexSlot(sv.slotType) && flexEligiblePositions(sv.slotType).indexOf(inc.pos) !== -1 && sv.pts < weakestFlexPts) { weakestFlexPts = sv.pts; weakestFlexIdx = d; }
        });
        if (weakestFlexIdx !== -1 && inc.pts > weakestFlexPts) idx = weakestFlexIdx;
      }
      if (idx !== -1) slotValues[idx] = { slotType: slotValues[idx].slotType, pts: inc.pts, open: false };
    });

    var newTotal = slotValues.reduce(function (s, sv) { return s + sv.pts; }, 0);
    return newTotal - startersProjectedTotal(roster);
  }

  function fmtDelta(v, suffix) {
    var s = (v >= 0 ? "+" : "") + v.toFixed(1) + (suffix || "");
    return '<span style="color:' + (v > 0.05 ? "var(--green)" : (v < -0.05 ? "var(--red)" : "var(--muted)")) + ';font-weight:700;">' + s + "</span>";
  }

  function simulateTradeImpact(myRoster, partnerRoster, suggestion) {
    if (!state.rosters || !state.seasonMatchups || !state.projections) return null;
    var remainingWeeksCount = Math.max(1, (state.lastRegWeek || 14) - state.week + 1);

    var myDelta = estimateTradeStarterDelta(myRoster,
      suggestion.give.map(function (g) { return g.pid; }),
      suggestion.receive.map(function (r) { return { pid: r.pid, pos: r.pos, pts: r.pts }; }));
    var partnerDelta = estimateTradeStarterDelta(partnerRoster,
      suggestion.receive.map(function (r) { return r.pid; }),
      suggestion.give.map(function (g) { return { pid: g.pid, pos: g.pos, pts: g.pts }; }));

    var overrides = {};
    overrides[myRoster.roster_id] = Math.max(0, (startersProjectedTotal(myRoster) + myDelta) / remainingWeeksCount);
    overrides[partnerRoster.roster_id] = Math.max(0, (startersProjectedTotal(partnerRoster) + partnerDelta) / remainingWeeksCount);

    var result = runMonteCarloForecast(400, overrides);
    if (!result) return null;
    return {
      myDelta: myDelta,
      partnerDelta: partnerDelta,
      myAfterPct: result.byRoster[myRoster.roster_id] ? result.byRoster[myRoster.roster_id].playoffPct : null,
      partnerAfterPct: result.byRoster[partnerRoster.roster_id] ? result.byRoster[partnerRoster.roster_id].playoffPct : null
    };
  }

  function buildRankRadarSVG(rankRows) {
    var size = 320, center = size / 2, radius = size * 0.30;
    var n = rankRows.length;
    if (n === 0) return "";

    function colorFor(pct) {
      return pct >= 0.6 ? "#2F5233" : (pct <= 0.3 ? "#9B3A34" : "#C99A2E");
    }

    function pt(i, value) {
      var angle = (-90 + i * (360 / n)) * Math.PI / 180;
      var r = value * radius;
      return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
    }

    var rings = [0.25, 0.5, 0.75, 1].map(function (frac) {
      var pts = rankRows.map(function (e, i) {
        var angle = (-90 + i * (360 / n)) * Math.PI / 180;
        var r = radius * frac;
        return (center + r * Math.cos(angle)).toFixed(1) + "," + (center + r * Math.sin(angle)).toFixed(1);
      }).join(" ");
      return '<polygon points="' + pts + '" fill="none" stroke="#D8DED2" stroke-width="1"/>';
    }).join("");

    var axesSvg = rankRows.map(function (e, i) {
      var angle = (-90 + i * (360 / n)) * Math.PI / 180;
      var x2 = center + radius * Math.cos(angle), y2 = center + radius * Math.sin(angle);
      var lx = center + (radius + 18) * Math.cos(angle), ly = center + (radius + 18) * Math.sin(angle);
      var rlx = center + (radius + 34) * Math.cos(angle), rly = center + (radius + 34) * Math.sin(angle);
      return '<line x1="' + center + '" y1="' + center + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#D8DED2" stroke-width="1"/>' +
        '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" font-size="11" font-weight="700" fill="#16241C" text-anchor="middle" dominant-baseline="middle">' + escapeHtml(e.pos) + "</text>" +
        '<text x="' + rlx.toFixed(1) + '" y="' + rly.toFixed(1) + '" font-size="9" fill="#5C6B5F" text-anchor="middle" dominant-baseline="middle">' + e.rank + "/" + e.total + "</text>";
    }).join("");

    var polyPts = rankRows.map(function (e, i) { var p = pt(i, e.percentile); return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    var dots = rankRows.map(function (e, i) {
      var p = pt(i, e.percentile);
      return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4.5" fill="' + colorFor(e.percentile) + '" stroke="#fff" stroke-width="1.5"/>';
    }).join("");

    return '<svg viewBox="0 0 ' + size + " " + size + '" style="width:100%;height:auto;max-width:340px;display:block;margin:0 auto;">' +
      rings + axesSvg +
      '<polygon points="' + polyPts + '" fill="#2F5233" fill-opacity="0.18" stroke="#2F5233" stroke-width="2"/>' +
      dots +
      "</svg>";
  }

  function computeByeWeekSeverity(roster, week) {
    if (!roster || !state.nflSchedule || !state.players) return null;
    var slots = startingSlots();
    var starters = roster.starters || [];

    function onBye(pid) {
      var p = state.players[pid];
      var team = p && p.team;
      return !!team && state.nflSchedule[team] === week;
    }

    var affected = [];
    for (var i = 0; i < slots.length; i++) {
      var slotType = slots[i];
      var pid = starters[i];
      if (!pid || pid === "0") continue;
      var pos = positionOf(pid);
      if (pos === "K" && state.excludeK) continue;
      if (pos === "DEF" && state.excludeDEF) continue;
      if (onBye(pid)) affected.push({ slotType: slotType, pid: pid, pos: pos });
    }

    if (affected.length === 0) return { level: "green", affected: [] };

    var benchIds = (roster.players || []).filter(function (pid) { return starters.indexOf(pid) === -1; });
    var pool = benchIds.filter(function (pid) {
      var pos = positionOf(pid);
      if (pos === "K" && state.excludeK) return false;
      if (pos === "DEF" && state.excludeDEF) return false;
      if (onBye(pid)) return false;
      return true;
    }).map(function (pid) { return { pid: pid, pos: positionOf(pid), pts: projPointsFor(pid) }; });

    var order = affected.slice().sort(function (a, b) {
      return (isFlexSlot(a.slotType) ? 1 : 0) - (isFlexSlot(b.slotType) ? 1 : 0);
    });

    var used = {};
    var allReplaced = true;
    var results = [];
    order.forEach(function (a) {
      var eligible = isFlexSlot(a.slotType) ? flexEligiblePositions(a.slotType) : [a.pos];
      var candidates = pool.filter(function (b) { return !used[b.pid] && eligible.indexOf(b.pos) !== -1; })
        .sort(function (x, y) { return y.pts - x.pts; });
      var pick = candidates[0] || null;
      if (pick) used[pick.pid] = true; else allReplaced = false;
      results.push({
        slotType: a.slotType, playerName: nameOf(a.pid), playerPos: a.pos,
        replacement: pick ? { name: nameOf(pick.pid), pts: pick.pts, pos: pick.pos } : null
      });
    });

    return { level: allReplaced ? "yellow" : "red", affected: results };
  }

  function allTeamsPositionTotals() {
    var result = {};
    (state.rosters || []).forEach(function (r) {
      var breakdown = positionProjectionBreakdown(r);
      breakdown.forEach(function (b) {
        if (b.pos === "—") return;
        if (!result[b.pos]) result[b.pos] = [];
        result[b.pos].push({ rosterId: r.roster_id, name: teamName(r), points: b.points });
      });
    });
    Object.keys(result).forEach(function (pos) {
      result[pos].sort(function (a, b) { return b.points - a.points; });
    });
    return result;
  }

  function computeWeeklyRankHistory() {
    var lastWeek = state.week - 1;
    if (lastWeek < 1 || !state.seasonMatchups || !state.rosters) return [];
    var cum = {};
    state.rosters.forEach(function (r) { cum[r.roster_id] = { wins: 0, losses: 0, ties: 0, pf: 0 }; });
    var history = [];
    for (var w = 1; w <= lastWeek; w++) {
      var wk = state.seasonMatchups[w];
      if (wk) {
        var groups = {};
        wk.forEach(function (m) { if (!groups[m.matchup_id]) groups[m.matchup_id] = []; groups[m.matchup_id].push(m); });
        Object.keys(groups).forEach(function (mid) {
          var pair = groups[mid];
          if (pair.length !== 2) return;
          var a = pair[0], b = pair[1];
          var aPts = a.points || 0, bPts = b.points || 0;
          cum[a.roster_id].pf += aPts; cum[b.roster_id].pf += bPts;
          if (aPts > bPts) { cum[a.roster_id].wins++; cum[b.roster_id].losses++; }
          else if (bPts > aPts) { cum[b.roster_id].wins++; cum[a.roster_id].losses++; }
          else { cum[a.roster_id].ties++; cum[b.roster_id].ties++; }
        });
      }
      var list = state.rosters.map(function (r) { return { rosterId: r.roster_id, wins: cum[r.roster_id].wins, pf: cum[r.roster_id].pf }; });
      list.sort(function (x, y) { return y.wins - x.wins || y.pf - x.pf; });
      var ranks = {};
      list.forEach(function (t, i) { ranks[t.rosterId] = i + 1; });
      history.push({ week: w, ranks: ranks });
    }
    return history;
  }

  function weeklyPointsHistory() {
    var lastWeek = state.week - 1;
    var weeks = [], myPts = [], leagueAvg = [];
    if (lastWeek < 1 || !state.seasonMatchups) return { weeks: weeks, myPts: myPts, leagueAvg: leagueAvg };
    for (var w = 1; w <= lastWeek; w++) {
      var entry = getRosterWeekEntry(w, state.myRosterId);
      weeks.push(w);
      myPts.push(entry && typeof entry.points === "number" ? entry.points : null);
      var wk = state.seasonMatchups[w] || [];
      var sum = 0, count = 0;
      wk.forEach(function (m) { if (typeof m.points === "number") { sum += m.points; count++; } });
      leagueAvg.push(count > 0 ? sum / count : null);
    }
    return { weeks: weeks, myPts: myPts, leagueAvg: leagueAvg };
  }

  function buildLineChartSVG(config) {
    var width = config.width || 320, height = config.height || 170;
    var padL = 30, padR = 10, padT = 12, padB = 22;
    var plotW = width - padL - padR, plotH = height - padT - padB;
    var weeks = config.weeks || [];
    var n = weeks.length;
    var yMin = config.yMin, yMax = config.yMax;
    if (yMax <= yMin) yMax = yMin + 1;

    function xFor(i) { return padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW); }
    function yFor(v) {
      var t = (v - yMin) / (yMax - yMin);
      t = Math.max(0, Math.min(1, t));
      return config.lowerIsBetter ? (padT + t * plotH) : (padT + (1 - t) * plotH);
    }

    var gridCount = 4;
    var gridLines = "";
    for (var g = 0; g <= gridCount; g++) {
      var frac = g / gridCount;
      var val = config.lowerIsBetter ? (yMin + frac * (yMax - yMin)) : (yMax - frac * (yMax - yMin));
      var y = padT + frac * plotH;
      gridLines += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + plotW).toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#E5E9E1" stroke-width="1"/>';
      gridLines += '<text x="' + (padL - 6).toFixed(1) + '" y="' + (y + 3).toFixed(1) + '" font-size="9" fill="#5C6B5F" text-anchor="end">' + Math.round(val) + "</text>";
    }

    var xLabels = "";
    weeks.forEach(function (w, i) {
      if (n > 10 && i % 2 !== 0 && i !== n - 1) return;
      xLabels += '<text x="' + xFor(i).toFixed(1) + '" y="' + (height - 6).toFixed(1) + '" font-size="9" fill="#5C6B5F" text-anchor="middle">W' + w + "</text>";
    });

    var seriesSvg = (config.series || []).map(function (s) {
      var pts = s.values.map(function (v, i) { return v === null || v === undefined ? null : { x: xFor(i), y: yFor(v) }; });
      var pathParts = [];
      pts.forEach(function (p) {
        if (p === null) return;
        pathParts.push((pathParts.length === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1));
      });
      var path = pathParts.join(" ");
      var dots = pts.map(function (p) { return p === null ? "" : '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3" fill="' + s.color + '"/>'; }).join("");
      return '<path d="' + path + '" fill="none" stroke="' + s.color + '" stroke-width="2"' + (s.dashed ? ' stroke-dasharray="4,3"' : "") + "/>" + dots;
    }).join("");

    return '<svg viewBox="0 0 ' + width + " " + height + '" style="width:100%;height:auto;max-width:400px;display:block;margin:0 auto;">' +
      gridLines + seriesSvg + xLabels + "</svg>";
  }

  function computePositionRankRows(rosterId) {
    var allTotals = allTeamsPositionTotals();
    var rankRows = [];
    var weakest = null, strongest = null;
    POSITION_ORDER.forEach(function (pos) {
      if (pos === "FLEX" || !allTotals[pos] || allTotals[pos].length < 2) return;
      var list = allTotals[pos];
      var myIdx = -1;
      list.forEach(function (t, i) { if (t.rosterId === rosterId) myIdx = i; });
      if (myIdx === -1) return;
      var rank = myIdx + 1;
      var total = list.length;
      var percentile = total > 1 ? (total - rank) / (total - 1) : 1;
      var entry = { pos: pos, rank: rank, total: total, points: list[myIdx].points, percentile: percentile };
      rankRows.push(entry);
      if (!weakest || percentile < weakest.percentile) weakest = entry;
      if (!strongest || percentile > strongest.percentile) strongest = entry;
    });
    return { rankRows: rankRows, weakest: weakest, strongest: strongest };
  }

  function starterSlotsByPosition() {
    var slots = {};
    var arr = (state.league && state.league.roster_positions) || [];
    arr.forEach(function (p) {
      if (POSITION_ORDER.indexOf(p) !== -1 && p !== "FLEX") {
        slots[p] = (slots[p] || 0) + 1;
      }
    });
    return slots;
  }

  function starterBenchmarkForPosition(pos) {
    var vals = [];
    (state.rosters || []).forEach(function (r) {
      (r.starters || []).forEach(function (pid) {
        if (pid && pid !== "0" && positionOf(pid) === pos) vals.push(projPointsFor(pid));
      });
    });
    if (!vals.length) return 0;
    vals.sort(function (a, b) { return a - b; });
    return vals[Math.floor(vals.length * 0.25)];
  }

  function hiddenStartersFor(roster, pos) {
    var benchmark = starterBenchmarkForPosition(pos);
    if (!benchmark) return [];
    return (roster.players || []).filter(function (pid) {
      return positionOf(pid) === pos && !isStarter(roster, pid) && projPointsFor(pid) >= benchmark;
    }).map(function (pid) {
      return { pid: pid, name: nameOf(pid), pts: projPointsFor(pid) };
    }).sort(function (a, b) { return b.pts - a.pts; });
  }

  function evaluateTradePartner(partnerRoster, givePositions, receivePositions, allTotals, slots) {
    var needScore = 0, surplusScore = 0;
    givePositions.forEach(function (pos) {
      var list = allTotals[pos] || [];
      var idx = -1;
      list.forEach(function (t, i) { if (t.rosterId === partnerRoster.roster_id) idx = i; });
      if (idx === -1 || list.length < 2) return;
      needScore += idx / (list.length - 1);
    });
    receivePositions.forEach(function (pos) {
      var need = slots[pos] || 1;
      var count = (partnerRoster.players || []).filter(function (pid) { return positionOf(pid) === pos; }).length;
      surplusScore += Math.max(0, count - need);
      surplusScore += hiddenStartersFor(partnerRoster, pos).length * 1.5;
    });
    return { score: needScore + surplusScore };
  }

  function generateTradeSuggestion(partnerRoster, givePositionsRaw, receivePositionsRaw) {
    var myRoster = rosterById(state.myRosterId);
    var sortPos = function (arr) {
      return arr.slice().sort(function (a, b) {
        var ia = POSITION_ORDER.indexOf(a); var ib = POSITION_ORDER.indexOf(b);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
    };
    var givePositions = sortPos(givePositionsRaw);
    var receivePositions = sortPos(receivePositionsRaw);
    var give = [];
    givePositions.forEach(function (pos) {
      var mine = (myRoster.players || []).filter(function (pid) { return positionOf(pid) === pos; })
        .map(function (pid) { return { pid: pid, name: nameOf(pid), pts: projPointsFor(pid), starter: isStarter(myRoster, pid), pos: pos }; })
        .sort(function (a, b) { return b.pts - a.pts; });
      if (mine.length === 0) return;
      var offer = mine.length > 1 ? mine.slice(1, 2) : mine.slice(0, 1);
      give = give.concat(offer);
    });

    var receive = [];
    receivePositions.forEach(function (pos) {
      var theirs = (partnerRoster.players || []).filter(function (pid) { return positionOf(pid) === pos; })
        .map(function (pid) { return { pid: pid, name: nameOf(pid), pts: projPointsFor(pid), starter: isStarter(partnerRoster, pid), pos: pos }; })
        .sort(function (a, b) { return b.pts - a.pts; });
      if (theirs.length === 0) return;
      var bench = theirs.filter(function (t) { return !t.starter; });
      var pick = bench.length > 0 ? bench[0] : (theirs.length > 1 ? theirs[theirs.length - 1] : null);
      if (pick) receive.push(pick);
    });

    if (give.length === 0 || receive.length === 0) return null;
    return { give: give, receive: receive };
  }

  function renderMostTargeted() {
    var wrap = el("<div></div>");

      if (state.mtFilter === "free" && status !== "free") return;

        '<div class="mt-val"><b>' + big + '</b><span style="color:var(--blue,#2563eb);">' + small + '</span><div style="font-size:11px;color:var(--muted);font-weight:600;">' + sub + "</div></div></div>";

  function renderConsistency() {
    var wrap = el("<div></div>");
    var lastDone = (state.week || 1) - 1;
    var posTabs = ["QB", "RB", "WR", "TE"].concat(leagueHasIdp() ? IDP_POSITIONS : []);
    var pos = posTabs.indexOf(state.consPos) >= 0 ? state.consPos : "WR";
    var minGp = state.consMinGp || 4;
    var view = state.consView === "rank" ? "rank" : "points";
    var sortBy = state.consSort === "avg" ? "avg" : "cr";
    var head = '<h2 style="margin-top:0;">Consistency</h2>' +
      '<div class="hint" style="margin:0 0 12px;">Fantasy-Punkte Woche für Woche (nach den Regeln deiner Liga) mit einer Konstanz-Wertung (CR): Standardabweichung der Wochenpunkte geteilt durch den Wochendurchschnitt. <b>Niedriger = gleichmäßiger.</b></div>';
    if (state.playersLoading || !state.players) {
      wrap.appendChild(el('<div class="card">' + head + '<div class="loading">Spieler werden geladen…</div></div>'));
      return wrap;
    }
    ensureDefenseStatsLoaded();
    if (lastDone < 1) {
      wrap.appendChild(el('<div class="card">' + head + '<div class="hint">Noch kein Spieltag gespielt – die Werte erscheinen nach Woche 1.</div></div>'));
      return wrap;
    }
    for (var lw = 1; lw <= lastDone; lw++) {
      if (!state.weeklyStats || !state.weeklyStats[lw]) {
        wrap.appendChild(el('<div class="card">' + head + '<div class="loading">Statistiken werden geladen…</div></div>'));
        return wrap;
      }
    }
    var tabsHtml = posTabs.map(function (p) {
      return '<button type="button" class="pill cons-pos' + (pos === p ? " active" : "") + '" data-v="' + p + '" style="padding:7px 16px;">' + p + "</button>";
    }).join("");
    var gpOpts = [];
    for (var g = 1; g <= Math.max(1, lastDone); g++) gpOpts.push('<option value="' + g + '"' + (g === Math.min(minGp, lastDone) ? " selected" : "") + ">" + g + "</option>");
    var viewBtns = [["points", "Punkte"], ["rank", "Rang"]].map(function (b) {
      return '<button type="button" class="outlook-btn cons-view' + (view === b[0] ? " on" : "") + '" data-v="' + b[0] + '">' + b[1] + "</button>";
    }).join("");
    var sortBtns = [["cr", "Konstanz (CR)"], ["avg", "Ø Punkte"]].map(function (b) {
      return '<button type="button" class="outlook-btn cons-sort' + (sortBy === b[0] ? " on" : "") + '" data-v="' + b[0] + '">' + b[1] + "</button>";
    }).join("");
    var controls = '<div class="pill-row" style="margin-bottom:10px;">' + tabsHtml + "</div>" +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">' + statusFilterChips("cons-f", state.consFilter) + "</div>" +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">' +
      '<span style="font-size:12px;font-weight:700;color:var(--muted);">Anzeige:</span>' + viewBtns +
      '<span style="font-size:12px;font-weight:700;color:var(--muted);margin-left:8px;">Sortierung:</span>' + sortBtns +
      '<span style="font-size:12px;font-weight:700;color:var(--muted);margin-left:8px;">Min. Spiele:</span><select id="cons-gp">' + gpOpts.join("") + "</select></div>" +
      '<input type="text" id="cons-search" placeholder="Spieler suchen…" value="' + escapeHtml(state.consSearch || "") + '" style="width:100%;margin-bottom:12px;" />';
    minGp = Math.min(minGp, lastDone);

    // Wochenpunkte aller Spieler dieser Position
    var perPlayer = {};
    var rankByWeek = {};
    for (var w = 1; w <= lastDone; w++) {
      var st = state.weeklyStats[w] || {};
      var list = [];
      Object.keys(st).forEach(function (pid) {
        var pl = state.players[pid];
        if (!pl || pl.position !== pos) return;
        var rec = st[pid];
        if (!rec) return;
        var played = rec.gp !== undefined ? parseFloat(rec.gp) > 0 : true;
        if (!played) return;
        var pts = parseFloat(recScore(rec, pid));
        if (isNaN(pts)) return;
        if (!perPlayer[pid]) perPlayer[pid] = {};
        perPlayer[pid][w] = pts;
        list.push({ pid: pid, pts: pts });
      });
      list.sort(function (a, b) { return b.pts - a.pts; });
      rankByWeek[w] = {};
      list.forEach(function (it, i) { rankByWeek[w][it.pid] = i + 1; });
    }
    var owner = rosterOwnerMap();
    var all = [];
    Object.keys(perPlayer).forEach(function (pid) {
      var vals = [];
      for (var w2 = 1; w2 <= lastDone; w2++) if (perPlayer[pid][w2] !== undefined) vals.push(perPlayer[pid][w2]);
      if (vals.length < minGp) return;
      var mean = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
      if (mean <= 0) return;
      var variance = vals.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / vals.length;
      var own = owner[pid];
      all.push({ pid: pid, gp: vals.length, mean: mean, cr: Math.sqrt(variance) / mean,
        status: own === undefined ? "free" : (own === state.myRosterId ? "mine" : "other") });
    });
    // Farbe der CR relativ zur Position: steadiestes Drittel grün, wackeligstes Drittel rot
    var byCr = all.slice().sort(function (a, b) { return a.cr - b.cr; });
    var crTier = {};
    byCr.forEach(function (it, i) { crTier[it.pid] = i < byCr.length / 3 ? "var(--green)" : (i >= byCr.length * 2 / 3 ? "var(--red)" : "inherit"); });

    var q = (state.consSearch || "").trim().toLowerCase();
    var rows = all.filter(function (it) {
      if (state.consFilter === "mine" && it.status !== "mine") return false;
      if (state.consFilter === "free" && it.status !== "free") return false;
      if (q && nameOf(it.pid).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    rows.sort(function (a, b) { return sortBy === "avg" ? b.mean - a.mean : a.cr - b.cr; });
    var limit = state.consExpanded ? 100 : 25;
    var shown = rows.slice(0, limit);
    var wkHead = "";
    for (var wh = 1; wh <= lastDone; wh++) wkHead += "<th>W" + wh + "</th>";
    var body = shown.map(function (it, i) {
      var pl = state.players[it.pid] || {};
      var cells = "";
      for (var wc = 1; wc <= lastDone; wc++) {
        var v = perPlayer[it.pid][wc];
        if (v === undefined) cells += '<td style="color:var(--muted);">–</td>';
        else cells += "<td>" + (view === "rank" ? "#" + rankByWeek[wc][it.pid] : v.toFixed(1)) + "</td>";
      }
      return '<tr class="cons-row ' + it.status + '" data-pid="' + escapeHtml(it.pid) + '">' +
        "<td>" + (i + 1) + '</td><td class="pl"><div style="display:flex;align-items:center;gap:8px;">' +
        '<img src="' + photoUrlFor(it.pid) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\';" />' +
        '<div><div style="font-weight:700;">' + escapeHtml(shortPlayerName(it.pid)) + injuryTagHtml(it.pid) + '</div><div style="font-size:11px;color:var(--muted);">' + escapeHtml(pl.team || "FA") + "</div></div></div></td>" +
        '<td style="font-weight:800;color:' + crTier[it.pid] + ';">' + it.cr.toFixed(2) + "</td>" +
        "<td>" + it.mean.toFixed(1) + "</td><td>" + it.gp + "</td>" + cells + "</tr>";
    }).join("");
    var more = rows.length > shown.length

  function glossaryLeagueHtml() {
    var lg = state.league;
    if (!lg) return "";
    var sc = lg.scoring_settings || {};
    var rec = sc.rec !== undefined ? parseFloat(sc.rec) : 0;
    var fmt = rec >= 1 ? "PPR (1 Punkt pro Reception)" : rec > 0 ? (rec === 0.5 ? "Half PPR (0,5 pro Reception)" : "Teil-PPR (" + rec + " pro Reception)") : "Standard (keine Punkte für Receptions)";
    var parts = ["<b>Scoring:</b> " + escapeHtml(fmt)];
    var tep = sc.bonus_rec_te !== undefined ? parseFloat(sc.bonus_rec_te) : 0;
    parts.push("<b>TE Premium:</b> " + (tep > 0 ? "ja (+" + tep + " pro TE-Reception)" : "nein"));
    var rp = lg.roster_positions || [];
    var count = function (k) { return rp.filter(function (x) { return x === k; }).length; };
    var sf = count("SUPER_FLEX");
    var qbs = count("QB");
    parts.push("<b>Superflex:</b> " + (sf > 0 ? "ja (" + sf + " Slot" + (sf > 1 ? "s" : "") + ")" : "nein") + (qbs >= 2 ? " · 2 feste QB-Plätze (2QB)" : ""));
    var flex = count("FLEX") + count("WRRB_FLEX") + count("REC_FLEX");
    parts.push("<b>FLEX-Plätze:</b> " + flex);
    if (sc.pass_td !== undefined) parts.push("<b>Pass-TD:</b> " + sc.pass_td + " Punkte");
    return '<div class="card" style="background:var(--gold-light);"><h2 style="margin-top:0;">So ist deine Liga eingestellt</h2>' +
      '<div style="line-height:1.9;">' + parts.join("<br>") + "</div>" +
      '<div class="hint" style="margin:8px 0 0;">Automatisch aus den Sleeper-Einstellungen deiner Liga gelesen.</div></div>';
  }

  function glossaryListHtml() {
    var q = (state.glossarySearch || "").trim().toLowerCase();
    var cat = state.glossaryCat || "all";
    var items = GLOSSARY.filter(function (g) {
      if (cat !== "all" && g.cat !== cat) return false;
      if (!q) return true;
      return (g.term + " " + (g.alt || "") + " " + g.text).toLowerCase().indexOf(q) !== -1;
    });
    if (items.length === 0) return '<div class="hint" style="margin:0;">Kein Begriff gefunden.</div>';
    var html = "";
    GLOSSARY_CATS.forEach(function (c) {
      var inCat = items.filter(function (g) { return g.cat === c; });
      if (!inCat.length) return;
      html += '<div style="font-size:12px;font-weight:800;color:var(--muted);letter-spacing:0.4px;margin:18px 0 8px;">' + escapeHtml(c.toUpperCase()) + "</div>";
      inCat.forEach(function (g) {
        html += '<div style="padding:10px 0;border-top:1px solid var(--border);"><div style="font-weight:800;">' + escapeHtml(g.term) +
          (g.alt ? ' <span style="font-weight:600;font-size:12px;color:var(--muted);">(' + escapeHtml(g.alt) + ")</span>" : "") + "</div>" +
          '<div style="font-size:14px;line-height:1.5;margin-top:2px;">' + escapeHtml(g.text) + "</div></div>";
      });
    });
    return html;
  }

  // Prognostizierte Bilanz in ganzen Spielen (gerundeter Simulations-Durchschnitt, Summe bleibt = Spiele gesamt)
  function snuWhole(m) {
    var total = Math.round(m.avgWins + m.avgLosses + m.avgTies);
    var w = Math.round(m.avgWins), t = Math.round(m.avgTies);
    var l = Math.max(0, total - w - t);
    return w + "-" + l + "-" + t;
  }

  function renderDashboardPage(s, calcToggle) {
    var wrap = el("<div></div>");
    var nodes = [];
    [renderNews(), renderUebersicht(s)].forEach(function (w) {
      Array.prototype.slice.call(w.childNodes).forEach(function (n) { nodes.push(n); });
    });
    var order = ["Wochenübersicht", "Bester", "Highlight-Spot", "Verletzungen", "Ranking", "Saisonverlauf", "Playoff-Prognose", "Liga-Transaktionen"];
    function idx(n) {
      var h = n.querySelector ? n.querySelector("h2") : null;
      var t = h ? h.textContent : "";
      for (var i = 0; i < order.length; i++) if (order[i] !== "__calc__" && t.indexOf(order[i]) === 0) return i;
      return 99;
    }
    var items = nodes.map(function (n, i) { return { n: n, k: idx(n), i: i }; });
    items.sort(function (a, b) { return a.k - b.k || a.i - b.i; });
    items.forEach(function (it) { wrap.appendChild(it.n); });
    return wrap;
  }

  function renderUebersicht(s) {

      var myRanks = rankHist.map(function (h) { return h.ranks[state.myRosterId]; });
      var totalTeamsCount = (state.rosters || []).length || 1;

      wrap.appendChild(el(
        '<div class="card"><h2>Saisonverlauf' + infoBtn("season-trend") + "</h2>" +

        '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">PUNKTE PRO WOCHE</div>' +
        buildLineChartSVG({

    if (state.seasonMatchupsLoading || state.projectionsLoading || !state.players) {
      wrap.appendChild(el('<div class="card"><h2>Playoff-Prognose</h2><div class="loading">Simulation läuft…</div></div>'));
    } else if (state.seasonMatchupsError || state.projectionsError) {

    } else if (state.seasonMatchups && state.projections) {

        }).sort(function (a, b) {
          var mcA = mc.byRoster[a.rosterId], mcB = mc.byRoster[b.rosterId];
          return (mcB ? mcB.playoffPct : 0) - (mcA ? mcA.playoffPct : 0);
        });
        var rowsArr = sortedTeams.map(function (t, idx) {
          var m = mc.byRoster[t.rosterId];
          var pct = m ? m.playoffPct : 0;
          var barColor = pct >= 75 ? "var(--green)" : (pct <= 25 ? "var(--red)" : "var(--gold)");

          var trendHtml = (d === undefined) ? '<span style="color:var(--muted);">–</span>'
            : d > 0 ? '<span style="color:var(--green);font-weight:700;">▲' + d + "</span>"
            : d < 0 ? '<span style="color:var(--red);font-weight:700;">▼' + Math.abs(d) + "</span>"
            : '<span style="color:var(--muted);">–</span>';
          var inPlayoffs = idx < mc.playoffTeams;
          var rowStyle = (t.rosterId === state.myRosterId ? "" : (inPlayoffs ? "background:#F2F8F0;" : ""));
          return '<tr class="' + (t.rosterId === state.myRosterId ? "mine" : "") + '" style="' + rowStyle + '">' +
            '<td style="border-left:3px solid ' + (inPlayoffs ? "var(--green)" : "transparent") + ';">' + escapeHtml(t.name) + "</td>" +
            '<td><div style="display:flex;align-items:center;gap:8px;"><div class="bar-track" style="width:60px;height:14px;"><div class="bar-fill" style="width:' + pct.toFixed(0) + "%;background:" + barColor + ';"></div></div><span style="font-weight:800;color:' + barColor + ';">' + pct.toFixed(0) + "%</span></div></td>" +
            '<td><span style="font-weight:800;color:var(--gold);">' + (m && m.champPct !== undefined ? m.champPct.toFixed(1) + "%" : "–") + '</span>' +
            (m && m.finalPct !== undefined ? '<div style="font-size:11px;color:var(--muted);">Finale: ' + m.finalPct.toFixed(0) + "%</div>" : "") + "</td>" +
            "<td>" + trendHtml + "</td>" +
            "<td>" + (m ? snuWhole(m) : "–") + "</td>" +
            "<td>" + (m ? m.avgPf.toFixed(1) + " / " + m.avgPa.toFixed(1) : "–") + "</td>" +
            "</tr>";
        });
        var withLine = [];
        rowsArr.forEach(function (rowHtml, idx) {
          withLine.push(rowHtml);
          if (idx === mc.playoffTeams - 1 && idx < rowsArr.length - 1) {
            withLine.push(
              '<tr><td colspan="6" style="padding:0;border:none;position:relative;height:0;">' +
              '<div style="border-top:2.5px dashed var(--green);position:relative;margin:2px 0;">' +
              '<span style="position:absolute;right:0;top:-9px;font-size:10px;font-weight:800;color:var(--green);background:var(--surface);padding:0 6px;">PLAYOFF-LINIE (Top ' + mc.playoffTeams + ")</span>" +
              "</div></td></tr>"
            );
          }
        });
        var rows2 = withLine.join("");
        wrap.appendChild(el(
          '<div class="card"><h2>Playoff-Prognose' + infoBtn("playoff-mc") + "</h2>" +
          infoBox("playoff-mc", "Monte-Carlo-Simulation (" + mc.iterations + " Durchläufe) der verbleibenden Wochen " + state.week + "–" + state.lastRegWeek +
          " auf Basis der Starter-Punkte-Projektionen, mit team-eigener Streuung (aus bisherigen Wochenergebnissen ermittelt, sonst 20% Schätzwert). " +
          (mc.usesWeeklyProjections
            ? "Nutzt wochenspezifische Punkte-Projektionen für jede einzelne Restwoche (Rückfall auf saisonweiten Ø-Wert für Wochen ohne verfügbare Projektion)."
            : "Wochenspezifische Projektionen aktuell nicht verfügbar — nutzt den saisonweiten Ø-Wert für jede Restwoche.") +
          ' "Progn. S-N-U" und "Progn. PF/PA" sind die über alle ' + mc.iterations + ' simulierten Saisonverläufe gemittelten Endwerte (nicht nur ein einzelnes Durchschnitts-Szenario). Playoff-Chance = Anteil der Simulationen, in denen das Team unter die Top ' + mc.playoffTeams + ' kommt — die gestrichelte Linie markiert den Cutoff. Meister-Chance = Anteil der Simulationen, in denen das Team zusätzlich die Playoffs gewinnt (K.-o.-Runden nach fester Setzliste, bei Teamzahlen ohne volles Bracket mit Freilosen für die besten Seeds; Spielstärke aus der Projektion der jeweiligen Playoff-Woche bzw. dem Durchschnittswert, mit derselben Streuung; „Finale“ = Anteil, in dem das Team das Endspiel erreicht). Progn. S-N-U wird auf ganze Spiele gerundet. Trend (▲/▼) = Veränderung im Rang der Playoff-Wahrscheinlichkeit seit der Vorwoche, also durch die Ergebnisse des letzten Spieltags (zwei Simulationen mit demselben Verfahren verglichen; ab Woche 2).') +
          '<div style="overflow-x:auto;"><table><thead><tr><th>Team</th><th>Playoff-Chance</th><th>Meister-Chance</th><th>Trend</th><th>Progn. S-N-U</th><th>Progn. PF / PA</th></tr></thead><tbody>' +
          rows2 + "</tbody></table></div></div>"
        ));
      }
    }

    return wrap;
  }

  function weekProjectionWithFallback(pid, week) {
    var wp = weeklyProjPointsFor(week, pid);
    if (wp !== null) return { value: wp, isWeekly: true };
    return { value: 0, isWeekly: false };
  }

  function matchupInfoFor(pid, week) {
    var p = state.players && state.players[pid];
    if (!p || !p.team) return null;
    var oppMapWk = state.nflWeekOpponents && state.nflWeekOpponents[week];
    var oppInfo = oppMapWk && oppMapWk[p.team];
    if (!oppInfo) return null;
    var pos = positionOf(pid);
    var ranks = computeDefenseRankings();
    var rank = (ranks && ranks[oppInfo.opp] && ranks[oppInfo.opp][pos] !== undefined) ? ranks[oppInfo.opp][pos] : null;
    return { opp: oppInfo.opp, isHome: oppInfo.isHome, rank: rank };
  }

  function matchupMultiplier(rank) {
    if (rank === null || rank === undefined) return 1;
    return 1 + ((16.5 - rank) / 16.5) * 0.15;
  }

  function injuryStatusFor(pid) {
    var p = state.players && state.players[pid];
    return (p && p.injury_status) || null;
  }

  function injuryMultiplierFor(status) {
    if (!status) return 1;
    if (status === "Out" || status === "IR" || status === "PUP" || status === "NA" || status === "Suspended" || status === "COV") return 0;
    if (status === "Doubtful") return 0.25;
    return 1;
  }

  function startSitCandidate(pid, week) {
    var proj = weekProjectionWithFallback(pid, week);
    var mi = matchupInfoFor(pid, week);
    var mult = mi ? matchupMultiplier(mi.rank) : 1;
    var status = injuryStatusFor(pid);
    var injMult = injuryMultiplierFor(status);
    var pl = state.players && state.players[pid];
    var isBye = !!(pl && pl.team && state.nflSchedule && state.nflSchedule[pl.team] === week);
    var rawProj = proj.value;
    var effectiveProj = isBye ? 0 : rawProj * injMult;
    return {
      pid: pid, pos: positionOf(pid), proj: effectiveProj, rawProj: rawProj, isWeekly: proj.isWeekly,
      matchup: isBye ? null : mi, adjusted: effectiveProj * mult, injuryStatus: status, bye: isBye
    };
  }

  function buildStartSitAnalysis() {
    var roster = rosterById(state.myRosterId);
    if (!roster) return [];
    ensureDefenseStatsLoaded();
    ensureWeekProjection(state.week);
    var slots = startingSlots();
    var starters = (roster.starters || []).slice();
    var benchPids = (roster.players || []).filter(function (pid) { return starters.indexOf(pid) === -1 && pid !== "0"; });
    var usedBench = {};
    var order = slots.map(function (s, i) { return { slot: s, idx: i }; }).sort(function (a, b) {
      return (isFlexSlot(a.slot) ? 1 : 0) - (isFlexSlot(b.slot) ? 1 : 0);
    });
    var result = [];
    order.forEach(function (o) {
      var slot = o.slot, idx = o.idx;
      var starterPid = starters[idx];
      if (!starterPid || starterPid === "0") return;
      var eligible = isFlexSlot(slot) ? flexEligiblePositions(slot) : [slot];
      var starterCand = startSitCandidate(starterPid, state.week);
      var benchCands = benchPids.filter(function (pid) {
        return !usedBench[pid] && eligible.indexOf(positionOf(pid)) !== -1;
      }).map(function (pid) { return startSitCandidate(pid, state.week); })
        .sort(function (a, b) { return b.adjusted - a.adjusted; });
      var best = benchCands[0];
      var recommend = best && (best.adjusted > starterCand.adjusted + 0.5);
      if (recommend) usedBench[best.pid] = true;
      result.push({ slot: slot, idx: idx, starter: starterCand, recommend: recommend ? best : null });
    });
    result.sort(function (a, b) { return a.idx - b.idx; });
    return result;
  }

  function startSitMetaHtml(c) {
    var ptsLabel;
    if (c.rawProj !== undefined && Math.abs(c.rawProj - c.proj) > 0.05) {
      ptsLabel = '<span style="text-decoration:line-through;color:var(--muted);">' + c.rawProj.toFixed(1) + "</span> → <strong>" + c.proj.toFixed(1) + "</strong> Pkt.";
    } else {
      ptsLabel = c.isWeekly ? c.proj.toFixed(1) + " Pkt." : "keine Prognose";
    }
    var parts = ['<span style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;">' + ptsLabel + "</span>"];
    if (c.bye) {
      parts.push('<span class="severity-badge" style="background:transparent;border:1.5px solid var(--red);color:var(--red);padding:2px 8px;font-size:11px;">BYE</span>');
    }
    if (c.injuryStatus) {
      var injColor = (c.injuryStatus === "Out" || c.injuryStatus === "IR" || c.injuryStatus === "PUP" || c.injuryStatus === "Suspended" || c.injuryStatus === "NA" || c.injuryStatus === "COV" || c.injuryStatus === "Doubtful") ? "var(--red)" : "var(--gold)";
      parts.push('<span class="severity-badge" style="background:transparent;border:1.5px solid ' + injColor + ";color:" + injColor + ';padding:2px 8px;font-size:11px;">' + escapeHtml(c.injuryStatus) + "</span>");
    }
    if (c.matchup) {
      parts.push('<span style="font-size:12px;">' + (c.matchup.isHome ? "vs " : "@ ") + escapeHtml(c.matchup.opp) + "</span>");
      if (c.matchup.rank !== null) {
        var color = c.matchup.rank <= 10 ? "var(--green)" : (c.matchup.rank >= 23 ? "var(--red)" : "var(--gold)");
        parts.push('<span style="font-size:11px;font-weight:700;color:' + color + ";border:1px solid " + color + ';border-radius:8px;padding:1px 6px;">Def. Rang ' + defShown(c.matchup.rank) + "</span>");
      }
    }
    return parts.join(" ");
  }

  function renderStartSitSlotCard(a) {
    var starterMeta = '<span class="badge-start">Start</span>' + startSitMetaHtml(a.starter);
    var body = renderPlayerRow(a.starter.pid, starterMeta);
    if (a.recommend) {
      var rec = a.recommend;
      var delta = rec.adjusted - a.starter.adjusted;
      var recMeta = '<span class="badge-bench">Bank</span>' + startSitMetaHtml(rec);
      body += '<div style="margin:6px 0 6px 16px;font-size:12px;font-weight:700;color:var(--green);">⇄ Tausch-Empfehlung (+' + delta.toFixed(1) + " Pkt. matchup-adjustiert)</div>" +
        renderPlayerRow(rec.pid, recMeta, "", ' style="border-color:var(--green);"');
    } else {
      body += '<div style="margin:6px 0 0 2px;font-size:12px;color:var(--muted);">✓ Keine bessere Bank-Alternative für diesen Slot.</div>';
    }
    var slotNote = (a.slot && a.slot !== positionOf(a.starter.pid)) ? '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">' + escapeHtml(a.slot) + "</div>" : "";
    return el('<div style="margin-bottom:16px;">' + slotNote + body + "</div>");
  }

  function renderStartSit() {
    var wrap = el("<div></div>");
    var roster = rosterById(state.myRosterId);
    if (!roster) return wrap;

    if (state.playersLoading || !state.players || state.projectionsLoading || !state.projections) {
      wrap.appendChild(el('<div class="card"><div class="loading">Daten werden geladen…</div></div>'));
      return wrap;
    }
    if (state.projectionsError) {
      wrap.appendChild(el('<div class="card"><div class="error" style="margin-top:0;">' + escapeHtml(state.projectionsError) + "</div></div>"));
      return wrap;
    }

    ensureWeekProjection(state.week);
    if (!state.weeklyProjections || !state.weeklyProjections[state.week]) {
      var stillLoading = state.weekProjLoading[state.week] || state.weeklyProjectionsLoading;
      wrap.appendChild(el(stillLoading
        ? '<div class="card"><div class="loading">Aktuelle Wochenprognose für Woche ' + state.week + ' wird geladen…</div></div>'
        : '<div class="card"><div class="error" style="margin-top:0;">Für Woche ' + state.week + ' liegt aktuell keine Punkte-Prognose vor (inoffizielle Sleeper-Schnittstelle). Start/Sit rechnet bewusst nicht mit Durchschnittswerten und bleibt daher leer.</div></div>'));
      return wrap;
    }

    var analysis = buildStartSitAnalysis();
    var totalStarter = analysis.reduce(function (s, a) { return s + a.starter.proj; }, 0);
    var totalOptimal = analysis.reduce(function (s, a) { return s + (a.recommend ? a.recommend.proj : a.starter.proj); }, 0);
    var swaps = analysis.filter(function (a) { return a.recommend; }).length;

    var injuredStarters = analysis.filter(function (a) {
      return a.starter.bye || a.starter.injuryStatus && (a.starter.injuryStatus === "Out" || a.starter.injuryStatus === "IR" || a.starter.injuryStatus === "PUP" ||
        a.starter.injuryStatus === "Suspended" || a.starter.injuryStatus === "NA" || a.starter.injuryStatus === "COV" || a.starter.injuryStatus === "Doubtful");
    });
    if (injuredStarters.length > 0) {
      var warnRows = injuredStarters.map(function (a) {
        return "<li><strong>" + pnLink(a.starter.pid) + "</strong> (" + escapeHtml(a.slot) + ") — " + (a.starter.bye ? "Bye-Week" : escapeHtml(a.starter.injuryStatus)) +
          (a.recommend ? ", Tausch gegen <strong>" + pnLink(a.recommend.pid) + "</strong> empfohlen" : ", keine bessere Bank-Alternative verfügbar") + "</li>";
      }).join("");
      wrap.appendChild(el(
        '<div class="card" style="border-color:var(--red);background:#FBEDEC;">' +
        '<div style="font-weight:800;color:var(--red);margin-bottom:6px;">⚠ Ausfälle in deiner Startelf (Verletzung / Bye-Week)</div>' +
        '<ul style="margin:0;padding-left:18px;font-size:13px;">' + warnRows + "</ul></div>"
      ));
    }

    wrap.appendChild(el(
      '<div class="card"><h2>Start/Sit — Woche ' + state.week + infoBtn("start-sit") + "</h2>" +
      infoBox("start-sit", "Vergleicht deine aktuelle Startaufstellung mit der Bank für den kommenden Spieltag. Die \"matchup-adjustierte\" Prognose erhöht die wochenspezifische Punkte-Projektion bei einem schwachen Gegner (Verteidigungsrang gegen diese Positionsgruppe ≥ 23 von 32, 32 = schwächste Defense) um bis zu 15% und senkt sie bei einem starken Gegner (Rang ≤ 10) um bis zu 15% — berechnet aus den tatsächlichen Punkten, die der Gegner dieser Saison bereits an die jeweilige Positionsgruppe abgegeben hat. Ein Tausch wird nur vorgeschlagen, wenn die adjustierte Prognose des Bankspielers mindestens 0,5 Punkte über der des Starters liegt. Gerechnet wird ausschließlich mit der aktuellen wochenspezifischen Punkte-Prognose von Sleeper; Spieler ohne Prognose zählen als \"keine Prognose\" mit 0 Punkten.") +
      '<div class="stat-cols">' +
      '<div class="stat-col"><div class="label">Aktuelle Startelf</div><div class="score-num">' + totalStarter.toFixed(1) + "</div></div>" +
      '<div class="stat-col"><div class="label" style="color:var(--green);">Mit Empfehlungen</div><div class="score-num" style="color:var(--green);">' + totalOptimal.toFixed(1) + "</div></div>" +
      '<div class="stat-col"><div class="label" style="font-weight:700;">' + (swaps > 0 ? swaps + " Tausch-Empfehlung" + (swaps > 1 ? "en" : "") : "Optimal aufgestellt ✓") + "</div></div>" +
      "</div></div>"
    ));

    analysis.forEach(function (a) { wrap.appendChild(renderStartSitSlotCard(a)); });

    return wrap;
  }

  var POWER_WEIGHTS = { roster: 0.45, perf: 0.15, form: 0.3, record: 0.1 };

  function computePowerRankings(st) {
    if (!state.rosters) return [];
    var rows = state.rosters.map(function (r) {
      var scores = actualWeeklyScores(r.roster_id);
      var settings = r.settings || {};
      var games = (settings.wins || 0) + (settings.losses || 0) + (settings.ties || 0);
      var last3 = scores.slice(-3);
      return {
        rosterId: r.roster_id, name: teamName(r),
        raw: {
          roster: state.projections ? startersProjectedTotal(r) : null,
          perf: scores.length ? scores.reduce(function (a, b) { return a + b; }, 0) / scores.length : null,
          form: last3.length ? last3.reduce(function (a, b) { return a + b; }, 0) / last3.length : null,
          record: games > 0 ? ((settings.wins || 0) + 0.5 * (settings.ties || 0)) / games : null
        }
      };
    });
    var keys = Object.keys(POWER_WEIGHTS);
    var availWeight = 0;
    keys.forEach(function (k) {
      var vals = rows.map(function (r) { return r.raw[k]; }).filter(function (v) { return v !== null; });
      var comp = { k: k, ok: vals.length === rows.length && vals.length > 0 };
      if (comp.ok) {
        comp.min = Math.min.apply(null, vals); comp.max = Math.max.apply(null, vals);
        availWeight += POWER_WEIGHTS[k];
      }
      rows.forEach(function (r) {
        r.norm = r.norm || {};
        r.norm[k] = comp.ok ? (comp.max === comp.min ? 50 : (r.raw[k] - comp.min) / (comp.max - comp.min) * 100) : null;
      });
    });
    rows.forEach(function (r) {
      var total = 0;
      keys.forEach(function (k) { if (r.norm[k] !== null) total += r.norm[k] * POWER_WEIGHTS[k]; });
      r.score = availWeight > 0 ? total / availWeight : 0;
    });
    rows.sort(function (a, b) { return b.score - a.score; });
    rows.forEach(function (r, i) {
      r.rank = i + 1;
      var place = st.map(function (t) { return t.rosterId; }).indexOf(r.rosterId) + 1;
      r.place = place;
      r.delta = place - r.rank;
    });
    return rows;
  }

  function computeAllPlay() {
    var wins = {}, losses = {}, ties = {}, weeksCounted = 0;
    (state.rosters || []).forEach(function (r) { wins[r.roster_id] = 0; losses[r.roster_id] = 0; ties[r.roster_id] = 0; });
    for (var w = 1; w < (state.week || 1); w++) {
      var wk = state.seasonMatchups && state.seasonMatchups[w];
      if (!wk) continue;
      var entries = wk.filter(function (m) { return typeof m.points === "number"; });
      var total = entries.reduce(function (a, m) { return a + m.points; }, 0);
      if (entries.length < 2 || total <= 0) continue;
      weeksCounted++;
      entries.forEach(function (m) {
        entries.forEach(function (o) {
          if (o.roster_id === m.roster_id) return;
          if (m.points > o.points) wins[m.roster_id]++;
          else if (m.points < o.points) losses[m.roster_id]++;
          else ties[m.roster_id]++;
        });
      });
    }
    var st = standings();
    var rows = (state.rosters || []).map(function (r) {
      var g = wins[r.roster_id] + losses[r.roster_id] + ties[r.roster_id];
      var t = st.filter(function (x) { return x.rosterId === r.roster_id; })[0];
      return {
        rosterId: r.roster_id, name: teamName(r), w: wins[r.roster_id], l: losses[r.roster_id], t: ties[r.roster_id],
        pct: g > 0 ? (wins[r.roster_id] + 0.5 * ties[r.roster_id]) / g : 0, pf: t ? t.pf : 0, place: st.indexOf(t) + 1
      };
    }).sort(function (a, b) { return b.pct - a.pct || b.pf - a.pf; });
    rows.forEach(function (r, i) { r.rank = i + 1; r.delta = r.place - r.rank; });
    return { rows: rows, weeks: weeksCounted };
  }

  function deltaHtml(d) {
    return d > 0 ? '<span style="color:var(--green);font-weight:700;">▲' + d + "</span>"
      : d < 0 ? '<span style="color:var(--red);font-weight:700;">▼' + Math.abs(d) + "</span>"
      : '<span style="color:var(--muted);">–</span>';
  }

  function powerScopeToggleHtml() {
    var sc = state.powerScope === "week" ? "week" : "season";
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">' +
      '<button type="button" class="filter-chip power-scope' + (sc === "season" ? " active" : "") + '" data-scope="season">Saison</button>' +
      '<button type="button" class="filter-chip power-scope' + (sc === "week" ? " active" : "") + '" data-scope="week">Aktuelle Woche (' + state.week + ")</button></div>";
  }

  function rankingPowerWeekHtml(st, seasonRows) {
    var week = state.week;
    ensureWeekProjection(week);
    var rows = (state.rosters || []).map(function (r) {
      var entry = getRosterWeekEntry(week, r.roster_id) || { starters: r.starters || [] };
      var proj = entryProjectedTotal(entry, week);
      var opp = null;
      var mine = getRosterWeekEntry(week, r.roster_id);
      if (mine) opp = (state.seasonMatchups[week] || []).filter(function (m) { return m.matchup_id === mine.matchup_id && m.roster_id !== r.roster_id; })[0] || null;
      var wp = opp ? matchupWinProbability(r.roster_id, opp.roster_id, week) : null;
      var oppRoster = opp ? rosterById(opp.roster_id) : null;
      return { rosterId: r.roster_id, name: teamName(r), proj: proj, opp: oppRoster ? teamName(oppRoster) : null, win: wp ? wp.pct : null };
    });
    var vals = rows.map(function (r) { return r.proj; }).filter(function (v) { return v !== null; });
    if (vals.length === 0) return '<div class="loading">Wochenprojektionen werden geladen…</div>';
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    rows.forEach(function (r) { r.score = r.proj === null ? 0 : (mx === mn ? 50 : (r.proj - mn) / (mx - mn) * 100); });
    rows.sort(function (a, b) { return (b.proj || 0) - (a.proj || 0); });
    var seasonRank = {};
    (seasonRows || []).forEach(function (r) { seasonRank[r.rosterId] = r.rank; });
    rows.forEach(function (r, i) { r.rank = i + 1; r.delta = seasonRank[r.rosterId] !== undefined ? seasonRank[r.rosterId] - r.rank : 0; });
    var body = rows.map(function (r) {
      var barColor = r.rank <= 3 ? "var(--green)" : (r.rank > rows.length - 3 ? "var(--red)" : "var(--gold)");
      var wc = r.win === null ? "var(--muted)" : (r.win >= 65 ? "var(--green)" : (r.win <= 35 ? "var(--red)" : "var(--gold)"));
      return '<tr class="' + (r.rosterId === state.myRosterId ? "mine" : "") + '">' +
        '<td style="font-weight:800;">' + r.rank + "</td><td>" + escapeHtml(r.name) + "</td>" +
        '<td><div style="display:flex;align-items:center;gap:8px;"><div class="bar-track" style="width:60px;height:14px;"><div class="bar-fill" style="width:' + Math.max(2, r.score).toFixed(0) + "%;background:" + barColor + ';"></div></div><b>' + r.score.toFixed(0) + "</b></div></td>" +
        "<td><b>" + (r.proj === null ? "–" : r.proj.toFixed(1)) + "</b></td>" +
        "<td>" + escapeHtml(r.opp || "–") + "</td>" +

        "<td>" + (seasonRank[r.rosterId] !== undefined ? seasonRank[r.rosterId] + ". " : "") + deltaHtml(r.delta) + "</td></tr>";

  // Wochenwert (Prognose x Verfügbarkeit) bzw. Restsaison-Summe aus den Wochenprognosen
  function rankValueFor(pid, mode, week) {
    if (mode === "week") {
      var raw = weeklyProjPointsFor(week, pid);
      if (raw === null || raw <= 0) return null;
      return raw * weekAvailabilityFactor(pid, week);
    }
    var hasWeekly = state.weeklyProjections && Object.keys(state.weeklyProjections).length > 0;
    if (hasWeekly) {
      var sum = 0, any = false;
      for (var w = state.week; w <= (state.lastRegWeek || state.week); w++) {
        var v = weeklyProjPointsFor(w, pid);
        if (v !== null && v > 0) { sum += v * weekAvailabilityFactor(pid, w); any = true; }
      }
      return any ? sum : null;
    }
    var seasonVal = projPointsFor(pid);
    return seasonVal > 0 ? seasonVal * Math.min(1, remainingWeeksN() / NFL_REGULAR_GAMES) * seasonAvailabilityFactor(pid) : null;

  function buildRankingData(mode, week, owner) {

    if (state.weeklyProjections) {
      Object.keys(state.weeklyProjections).forEach(function (w) {

      });
    }
    var myRoster = rosterById(state.myRosterId);
    if (myRoster) (myRoster.players || []).forEach(function (pid) { set[pid] = true; });

    var byPos = {};
    RANK_POSITIONS.forEach(function (pos) { byPos[pos] = []; });

    Object.keys(set).forEach(function (pid) {
      var p = state.players[pid];
      if (!p || RANK_POSITIONS.indexOf(p.position) === -1) return;
      var own = owner[pid];
      if (p.position !== "DEF" && !p.team && own === undefined) return;
      var status = own === undefined ? "free" : (own === state.myRosterId ? "mine" : "other");
      var val = rankValueFor(pid, mode, week);
      if (val === null && status !== "mine") return;
      var item = { pid: pid, pos: p.position, val: val, status: status, rank: null, wk: null, delta: null };
      if (mode === "waiver") item.wk = rankValueFor(pid, "week", state.week);
      byPos[p.position].push(item);
    });

    var slots = starterSlotsByPosition();
    RANK_POSITIONS.forEach(function (pos) {
      var list = byPos[pos];
      list.sort(function (a, b) {
        if (a.val === null && b.val === null) return 0;
        if (a.val === null) return 1;
        if (b.val === null) return -1;

      var r = 0;
      list.forEach(function (it) { if (it.val !== null) { r += 1; it.rank = r; } });

  }

  // ---------- Insights: Gegner, Upside, Bust, Matchup-Sterne, Start/Sit-Note (eigene Schätzungen) ----------
  var INSIGHT_INFO = "Gegner: „vs.“ = Heimspiel, „at“ = Auswärtsspiel. " +
    "Matchup: 1–5 Sterne aus dem Verteidigungsrang des Gegners gegen die Position (5 = sehr schwache Defense, leichtes Matchup) — berechnet aus den bisherigen Saisonspielen. " +
    "Upside (eigene Schätzung): Durchschnitt der zwei besten bisherigen Wochen im Verhältnis zur Wochenprognose — mehr Striche = höheres Ceiling. " +
    "Bust (eigene Schätzung): Risiko aus Verletzungsstatus, Schwankung der bisherigen Wochenpunkte und Anteil der Wochen deutlich unter der Prognose — mehr rote Striche = höheres Risiko. " +
    "Upside und Bust brauchen mindestens zwei gespielte Wochen; es sind KEINE Experten-Konsenswerte (die stehen uns nicht zur Verfügung). " +
    "Start/Sit-Note: Rang auf der Position im Verhältnis zur Zahl der Startplätze deiner Liga (Top 10 % ≈ A+, Mitte ≈ B-/C+, hinten D/F), im Wochen-Ranking zusätzlich mit Matchup-Bonus/-Malus; fraglicher oder ausgefallener Status verschlechtert die Note. Ist eine eigene Formel, nicht die von FantasyPros.";

  function playerPointHistory(pid) {
    var arr = [];
    for (var w = 1; w < (state.week || 1); w++) {
      var m = state.weeklyStats && state.weeklyStats[w];
      var rec = m && m[pid];
      if (!rec) continue;
      var val = recScore(rec, pid);
      if (val === undefined || val === null) val = rec.pts_ppr !== undefined ? rec.pts_ppr : (rec.pts_half_ppr !== undefined ? rec.pts_half_ppr : rec.pts_std);
      var num = parseFloat(val);
      if (!isNaN(num)) arr.push(num);
    }
    return arr;
  }

  function starsFromDefRank(rank) {
    if (rank === null || rank === undefined) return null;

    if (rank <= 20) return 3;
    if (rank <= 26) return 2;
    return 1;
  }

  function gradeBaseFor(pos) {
    var slots = starterSlotsByPosition();
    var teams = (state.rosters || []).length || 10;
    var flexN = ((state.league && state.league.roster_positions) || []).filter(function (p) { return p === "FLEX"; }).length;
    var n = (slots[pos] || 1) + ((pos === "RB" || pos === "WR") ? flexN * 0.4 : (pos === "TE" ? flexN * 0.2 : 0));
    return Math.max(3, n * teams);

  function gradeFromFrac(f) {
    var t = [[0.1, "A+"], [0.2, "A"], [0.3, "A-"], [0.4, "B+"], [0.5, "B"], [0.6, "B-"], [0.7, "C+"], [0.85, "C"], [1.0, "C-"], [1.25, "D"]];
    for (var i = 0; i < t.length; i++) if (f <= t[i][0]) return t[i][1];

  function computeInsights(pid, week, rank, applyMatchup) {
    var pos = positionOf(pid);
    var mi = matchupInfoFor(pid, week);
    var proj = weeklyProjPointsFor(week, pid);
    var res = { mi: mi, stars: null, upside: null, bust: null, grade: null, reasons: [], pos: pos };
    if (proj === null || proj <= 0) return res;
    res.stars = mi ? starsFromDefRank(mi.rank) : null;
    var hist = playerPointHistory(pid);
    if (hist.length >= 2) {

      var ceiling = (sorted[0] + sorted[1]) / 2;
      var ratio = ceiling / Math.max(proj, 1);
      res.upside = ratio >= 2.0 ? 5 : (ratio >= 1.7 ? 4 : (ratio >= 1.4 ? 3 : (ratio >= 1.15 ? 2 : 1)));
    }

    if (st) {

      else if (st === "Doubtful") { risk += 3; res.reasons.push("Fraglich (Doubtful)"); }
      else { risk += 5; res.reasons.push("Ausfall (" + st + ")"); }

    if (hist.length >= 2) {
      var mean = hist.reduce(function (a, b) { return a + b; }, 0) / hist.length;
      var sd = Math.sqrt(hist.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / (hist.length - 1));

  // Tabellenansicht der Rest-of-Season Rankings (eine Position, zunächst 10 Spieler)
