<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Football Team-Analyse</title>
<meta name="theme-color" content="#2F5233">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fantasy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Fantasy-Football Team-Analyse mit Sleeper-Daten">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2236%22%20fill%3D%22%232F5233%22/%3E%3Cellipse%20cx%3D%2290%22%20cy%3D%2290%22%20rx%3D%2258%22%20ry%3D%2236%22%20transform%3D%22rotate%28-30%2090%2090%29%22%20fill%3D%22%23C99A2E%22/%3E%3Cpath%20d%3D%22M52%20118%20L128%2062%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M80%2090%20l10%20-7%20M92%2098%20l10%20-7%20M68%2082%20l10%20-7%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2236%22%20fill%3D%22%232F5233%22/%3E%3Cellipse%20cx%3D%2290%22%20cy%3D%2290%22%20rx%3D%2258%22%20ry%3D%2236%22%20transform%3D%22rotate%28-30%2090%2090%29%22%20fill%3D%22%23C99A2E%22/%3E%3Cpath%20d%3D%22M52%20118%20L128%2062%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M80%2090%20l10%20-7%20M92%2098%20l10%20-7%20M68%2082%20l10%20-7%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #F2F4EF;
    --surface: #FFFFFF;
    --border: #D8DED2;
    --ink: #16241C;
    --muted: #5C6B5F;
    --gold: #C99A2E;
    --green: #2F5233;
    --green-light: #EAF0E7;
    --gold-light: #FBF4E2;
    --red: #9B3A34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #app { max-width: 980px; margin: 0 auto; padding: 24px; }
  .eyebrow { font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 0.3px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.7px; margin: 2px 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 14px; }
  input[type=text] {
    flex: 1; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; outline: none; width: 100%;
  }
  button {
    padding: 11px 20px; border-radius: 8px; border: none; background: var(--green);
    color: #fff; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    font-weight: 600;
  }
  button.link {
    background: none; border: none; color: var(--green); text-decoration: underline;
    padding: 0; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .row { display: flex; gap: 10px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600;
    text-align: left; color: var(--ink);
  }
  .chip.active { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .pos-tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pos-tile {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 16px 8px; text-align: center;
    cursor: pointer; background: var(--surface); font-weight: 800; font-size: 16px; color: var(--ink);
    position: relative;
  }
  .pos-tile .sub { font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 3px; letter-spacing: 0.2px; }
  .pos-tile.active-give { border-color: var(--red); background: #FBEEEC; }
  .pos-tile.active-receive { border-color: var(--green); background: var(--green-light); }
  .pos-tile.disabled { opacity: 0.35; cursor: not-allowed; }
  .tile-check {
    position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 50%;
    font-size: 10px; line-height: 16px; color: #fff; font-weight: 800;
  }
  .bye-item-start { border-left: 3px solid var(--gold); background: var(--gold-light); }
  .bye-item-bench { border-left: 3px solid var(--border); background: var(--surface); }
  .severity-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .severity-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .severity-green { background: #E7F1E4; color: var(--green); }
  .severity-yellow { background: #FBF4E2; color: #8A6A15; }
  .severity-red { background: #F6E4E2; color: var(--red); }
  .alt-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .alt-row:last-child { border-bottom: none; }
  .bye-week-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 10px; }
  .bye-week-chevron { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .trade-partner-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; align-items: start; }
  .manual-player-toggle { cursor: pointer; }
  .player-row.sel-give { border-color: var(--red); background: #FBEEEC; }
  .player-row.sel-receive { border-color: var(--green); background: var(--green-light); }
  .error { color: var(--red); margin-top: 12px; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; background: var(--border);
    color: var(--muted); font-size: 11px; font-weight: 800; font-style: italic;
    cursor: pointer; border: none; margin-left: 6px; vertical-align: middle; flex-shrink: 0; padding: 0;
  }
  .info-btn:hover { background: var(--green); color: #fff; }
  .info-content { display: none; }
  .info-content.open { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); border-bottom: 1px solid var(--border); padding: 6px 8px; font-weight: 600; }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  th, td { white-space: nowrap; }
  th.grp-h { text-align: center; color: var(--ink); font-weight: 800; border-bottom: 1px solid var(--border); }
  .grp-l { border-left: 1px solid var(--border); }
  @media (max-width: 860px) { th, td { padding: 7px 6px; font-size: 13px; } }
  tr.mine td { background: var(--gold-light); font-weight: 700; }
  .tabs { display: flex; gap: 6px; background: var(--surface); padding: 6px; border-radius: 10px; border: 1px solid var(--border); width: fit-content; margin-bottom: 18px; }
  .tab { padding: 9px 18px; border-radius: 8px; border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; }
  .tab.active { background: var(--green); color: #fff; }
  .menu-bar { position: relative; margin-bottom: 18px; }
  .menu-btn {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); cursor: pointer;
    font-weight: 700; font-size: 14px; color: var(--ink); width: fit-content;
  }
  .menu-btn .hamburger { display: flex; flex-direction: column; gap: 3px; }
  .menu-btn .hamburger span { width: 16px; height: 2px; background: var(--ink); border-radius: 2px; }
  .menu-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 220px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(22,36,28,0.15); overflow: hidden;
  }
  .menu-item {
    display: block; width: 100%; text-align: left; padding: 12px 16px; border: none;
    background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink);
    border-bottom: 1px solid var(--border);
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item.active { background: var(--green-light); color: var(--green); font-weight: 800; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 130px; font-size: 12px; color: var(--muted); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: var(--bg); border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--green); }
  .bar-fill.mine { background: var(--gold); }
  .bar-value { width: 55px; text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-box { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .score-num { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 32px; letter-spacing: -0.5px; }
  .score-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; text-align: center; }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .roster-item { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .player-row { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
  .player-pos-badge {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; color: #fff; font-weight: 800; font-size: 12px;
  }
  .player-photo { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--bg); }
  .player-photo-fallback { width: 42px; height: 42px; border-radius: 50%; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
  .player-info { flex: 1; min-width: 0; }
  .player-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
  .pos-tag { font-weight: 700; font-size: 10px; color: #fff; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.2px; }
  .compare-pair { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .compare-pair .pos-name { width: 50px; font-weight: 700; font-size: 12px; }
  .compare-pair .side { flex: 1; }
  .compare-pair .track { background: var(--bg); border-radius: 4px; height: 16px; overflow: hidden; }
  .compare-pair .fill-mine { height: 100%; background: var(--gold); border-radius: 4px 0 0 4px; margin-left: auto; }
  .compare-pair .fill-opp { height: 100%; background: var(--green); border-radius: 0 4px 4px 0; }
  .compare-pair .num { width: 22px; text-align: center; font-size: 12px; font-weight: 700; }
  .legend { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .loading { color: var(--muted); font-size: 14px; }
  .stat-cols { display: flex; justify-content: space-around; text-align: center; flex-wrap: wrap; gap: 20px; }
  .stat-col .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stat-col .vals { display: flex; gap: 14px; align-items: baseline; justify-content: center; }
  .vs { color: var(--muted); font-size: 12px; }
  .calc-toggle { padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .calc-toggle.active { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .exclude-toggle { padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .flag-toggle { padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .flag-toggle.active { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .exclude-toggle.active { border-color: var(--red); background: #F6E4E2; color: var(--red); }
  .badge-start { font-size: 10px; font-weight: 700; color: var(--green); background: var(--green-light); border-radius: 4px; padding: 2px 5px; }
  .badge-bench { font-size: 10px; font-weight: 700; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 2px 5px; }
  .stats-player-row { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .stats-player-row:hover { border-color: var(--green); background: var(--green-light); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(22, 36, 28, 0.55); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-card {
    background: var(--surface); border-radius: 16px; width: 90vw; height: 90vh; max-width: 1100px;
    overflow-y: auto; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-close {
    position: sticky; top: 0; float: right; margin: 12px 12px 0 0; width: 34px; height: 34px; border-radius: 50%;
    border: none; background: var(--bg); color: var(--ink); font-size: 18px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .player-card-header {
    display: flex; align-items: center; gap: 20px; padding: 24px 28px 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .player-card-photo {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: var(--bg); flex-shrink: 0;
    border: 3px solid var(--border);
  }
  .player-card-bio { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; }
  .player-card-bio .item { text-align: left; }
  .player-card-bio .item .v { font-size: 16px; font-weight: 800; color: var(--ink); }
  .player-card-bio .item .k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
  .player-card-tabbar { display: flex; gap: 4px; padding: 14px 28px 0; border-bottom: 1px solid var(--border); }
  .player-card-tab {
    padding: 9px 16px; border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px;
    cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; border-radius: 0;
  }
  .player-card-tab.active { color: var(--green); border-bottom-color: var(--green); }
  .player-card-body { padding: 20px 28px 28px; }

  #app.wide { max-width: 1320px; }
  .layout { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 22px; align-items: start; }
  .content { min-width: 0; }
  .sidebar {
    position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 12px 10px;
  }
  .nav-switch { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 8px; padding: 8px 8px; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--green); }
  .nav-switch:hover { background: var(--bg); }
  .sidebar-team { padding: 4px 8px 12px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .sidebar-team .t { font-size: 15px; font-weight: 800; line-height: 1.25; }
  .sidebar-team .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .nav-group-toggle {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: none; color: var(--ink); border: none; border-top: 1px solid var(--border);
    padding: 12px 8px 6px; margin-top: 6px; font-size: 14px; font-weight: 800; border-radius: 0; text-align: left;
  }
  .nav-divider { border-top: 1px solid var(--border); margin: 8px 0 6px; }
  .nav-group-toggle .chev { font-size: 11px; color: var(--muted); }
  .nav-item {
    display: block; width: 100%; text-align: left; padding: 9px 12px; margin: 1px 0; border: none;
    background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer;
  }
  .nav-item:hover { background: var(--bg); }
  .nav-item.active { background: var(--green-light); color: var(--green); font-weight: 800; }
  .nav-item.top { font-weight: 800; }
  .mobile-bar { display: none; }
  .sidebar-backdrop { display: none; }
  @media (max-width: 860px) {
    #app { padding: 16px; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .mobile-bar { display: block; position: relative; margin-bottom: 14px; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 272px; max-height: none; z-index: 60;
      border-radius: 0 12px 12px 0; transform: translateX(-105%); transition: transform 0.2s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    .sidebar.open { transform: none; }
    .sidebar-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(22,36,28,0.45); z-index: 55; }
  }
  .pill-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 9px 18px; border-radius: 999px; border: 1px solid transparent; background: transparent;
    color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .pill:hover { background: var(--bg); }
  .pill.active { background: var(--green); color: #fff; }
  .filter-chip {
    padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
    color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .filter-chip.active { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .legend-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; margin-left: 14px; }
  .legend-dot i { width: 22px; height: 22px; border-radius: 6px; display: inline-block; }
  .rank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; align-items: start; }
  .rank-grid.wide { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .rank-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 14px 12px; }
  .rank-card.expanded { grid-column: 1 / -1; }
  .rank-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .rank-pos { font-size: 16px; font-weight: 800; }
  .rank-chip { font-size: 13px; font-weight: 600; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; margin-left: 10px; }
  .rank-expand { background: none; color: var(--muted); border: none; padding: 4px 6px; font-size: 16px; line-height: 1; }
  .rank-colhead { display: flex; gap: 8px; padding: 0 8px 6px; font-size: 11px; font-weight: 800; color: var(--ink); letter-spacing: 0.3px; }
  .rank-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.6);
  }
  .rank-row:hover { filter: brightness(0.96); }
  .pc-link { cursor: pointer; }
  .pc-link:hover { text-decoration: underline; }
  .player-row[data-open-pid] { cursor: pointer; }
  .player-row[data-open-pid]:hover { filter: brightness(0.97); }
  .cons-tbl td.pl { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; }
  .cons-tbl th.pl { position: sticky; left: 0; background: var(--surface); z-index: 2; }
  .cons-tbl tr.cons-row { cursor: pointer; }
  .cons-tbl tr.cons-row.mine td { background: #EAF1FB; }
  .cons-tbl tr.cons-row.free td { background: var(--green-light); }
  .cons-tbl td, .cons-tbl th { text-align: center; }
  .cons-tbl td.pl, .cons-tbl th.pl { text-align: left; }
  .cons-tbl img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--bg); }
  .rank-row.mc-row { padding: 8px 10px; gap: 10px; cursor: pointer; }
  .rank-row.mc-row img { width: 44px; height: 44px; }

<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  var POSITION_ORDER = ["QB", "RB", "WR", "TE", "FLEX", "K", "DEF", "DL", "LB", "DB"];
  var IDP_POSITIONS = ["DL", "LB", "DB"];
  function leagueHasIdp() {
    var rp = (state.league && state.league.roster_positions) || [];
    return rp.some(function (x) { return x === "DL" || x === "LB" || x === "DB" || x === "IDP_FLEX"; });
  }
  function apiPosQs() {
    return "&position[]=QB&position[]=RB&position[]=WR&position[]=TE&position[]=K&position[]=DEF" + (leagueHasIdp() ? "&position[]=DL&position[]=LB&position[]=DB" : "");
  }
  function activePositions() {
    return POSITION_ORDER.filter(function (x) { return x !== "FLEX" && (IDP_POSITIONS.indexOf(x) === -1 || leagueHasIdp()); });
  }
  var POSITION_COLORS = {
    QB: "#EF5350", RB: "#43A047", WR: "#1E88E5", TE: "#FB8C00",
    K: "#8E24AA", DEF: "#546E7A", FLEX: "#78909C", DL: "#6D4C41", LB: "#00897B", DB: "#3949AB"
  };

  var state = {
    screen: "search",       // search | leagues | dashboard
    tab: "dashboard",
    menuOpen: false,
    usernameInput: "",
    leagueIdInput: "",
    loading: false,
    error: null,
    sleeperUser: null,
    userLeagues: null,
    season: null,
    week: null,
    league: null,
    rosters: null,
    users: null,
    players: null,
    playersLoading: false,
    projections: null,
    projectionsLoading: false,
    projectionsError: null,
    scoringKey: "pts_ppr",
    calcMode: "starters",
    excludeK: false,
    excludeDEF: false,
    seasonMatchups: null,
    seasonMatchupsLoading: false,
    seasonMatchupsError: null,
    lastRegWeek: null,
    playoffTeamsCount: null,
    weeklyProjections: null,
    weekProjLoading: {},
    weekProjTried: {},
    weeklyStats: null,
    weeklyStatsLoading: {},
    nflverse: null,
    nflverseLoading: false,
    nflverseError: null,
    sleeperGsisMap: null,
    sleeperGsisMapLoading: false,
    nflverseUploadError: null,
    weeklyProjectionsLoading: false,
    weeklyProjectionsError: null,
    mcForecast: null,
    loadedAt: null,
    nflSchedule: null,
    nflScheduleLoading: false,
    nflScheduleError: null,
    matchups: null,
    myRosterId: null,
    compareRosterId: null,
    tradeGive: [],
    tradeReceive: [],
    byeExpandedWeeks: {},
    tradePartnerExpanded: {},
    manualPartnerId: null,
    reviewWeek: null,
    trendingAdds: null,
    tradedPicks: null, tradedPicksLoading: false, tradedPicksError: null, dynSeason: "all",
    trendingAddsLoading: false,
    trendingAddsError: null,
    leagueTransactions: null,
    leagueTransactionsLoading: false,
    leagueTransactionsError: null,
    manualGive: [],
    manualReceive: [],
    tradeExpanded: {},
    ownership: null,
    ownershipLoading: false,
    ownershipError: null,
    nflWeekOpponents: null,
    weather: {},
    weatherLoading: {},
    defenseRanks: null,
    defensePA: null,
    fpaSort: "total",
    fpaDir: "desc",
    mcalPos: "RB", mcalFilter: "mine", mcalWeeks: 3, mcalExpanded: false,
    consPos: "WR", consFilter: "all", consMinGp: 4, consView: "points", consSort: "cr", consSearch: "", consExpanded: false,
    mtPos: "WR", mtFilter: "all", mtSort: "total", mtExpanded: false,
    statsCardPid: null,
    rankSub: "week",
    tr: { partner: null, give: [], get: [], givePicks: [], getPicks: [], tab: "overview", scope: "week" },
    ktc: null, ktcMsg: "",
    ngsPassing: null, ngsReceiving: null, ngsLoading: false, ngsError: null,
    wv: { add: null, drop: null, pos: "ALL", q: "", tab: "overview", scope: "week" },
    rankLayout: "cards",
    rankTablePos: "QB",
    showCaution: false,
    expert: { insights: true, loadedFor: null, rankings: [], activeId: null, pos: "QB", filter: "all", search: "", more: false, showNew: false, storageOk: true },
    rankFilters: { week: "mine_free", ros: "mine_free", waiver: "free" },
    rankWeek: null,
    rankExpanded: {},
    navCollapsed: {},
    playerCardTab: "upcoming",
    outlookN: 3,
    powerScope: "season",
    highlightOpen: { me: true, opp: false },
    glossarySearch: "",
    glossaryCat: "all",
    outlookMetric: "pts",
    outlookView: "games",
    teamCompareWeek: null,
    applyInjuries: true,
    rankView: "actual"
  };

  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function infoBtn(id) {
    return '<button type="button" class="info-btn" data-info="' + id + '">i</button>';
  }

  function infoBox(id, html) {
    return '<div class="hint info-content" id="info-' + id + '">' + html + "</div>";
  }

  // ---------- API ----------
  function getState() {
    return fetch("https://api.sleeper.app/v1/state/nfl").then(function (r) { return r.json(); });
  }

  function searchByUsername(rawName) {
    var name = rawName.trim().toLowerCase();
    if (!name) return;
    state.loading = true;
    state.error = null;
    state.userLeagues = null;
    state.sleeperUser = null;
    render();

    getState().then(function (st) {
      var season = st.season || st.league_season || String(new Date().getFullYear());
      state.season = season;
      return fetch("https://api.sleeper.app/v1/user/" + encodeURIComponent(name)).then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (userData) {
        if (!userData || !userData.user_id) {
          throw new Error('Konnte "' + rawName.trim() + '" nicht als Sleeper-Benutzernamen finden. Das ist der Login-Name aus den Sleeper-Konto-Einstellungen, nicht dein Anzeigename oder Teamname in der Liga.');
        }
        state.sleeperUser = userData;
        return fetch("https://api.sleeper.app/v1/user/" + userData.user_id + "/leagues/nfl/" + season);
      }).then(function (r) { return r.ok ? r.json() : []; })
        .then(function (leagues) {
          if (!leagues || leagues.length === 0) {
            throw new Error("Keine Ligen für die Saison " + season + " gefunden.");
          }
          state.userLeagues = leagues;
          state.screen = "leagues";
        });
    }).catch(function (e) {
      state.error = e.message || "Verbindung fehlgeschlagen. Bitte Internetverbindung prüfen und erneut versuchen.";
    }).finally(function () {
      state.loading = false;
      render();
    });
  }

  function loadLeague(leagueId, ownerUserId, keepTab) {
    if (!leagueId) return;
    state.loading = true;
    state.error = null;
    state.league = null;
    state.rosters = null;
    state.users = null;
    state.matchups = null;
    state.myRosterId = null;
    state.compareRosterId = null;
    state.projections = null;
    state.projectionsLoading = false;
    state.projectionsError = null;
    state.seasonMatchups = null;
    state.seasonMatchupsLoading = false;
    state.seasonMatchupsError = null;
    state.lastRegWeek = null;
    state.playoffTeamsCount = null;
    state.weeklyProjections = null;
    state.weekProjLoading = {};
    state.weekProjTried = {};
    state.weeklyStats = null;
    state.weeklyStatsLoading = {};
    state.nflverse = null;
    state.nflverseLoading = false;
    state.nflverseError = null;
    state.nflverseUploadError = null;
    state.ngsPassing = null; state.ngsReceiving = null; state.ngsLoading = false; state.ngsError = null; state._nflAgg = null;
    state.weeklyProjectionsLoading = false;
    state.weeklyProjectionsError = null;
    state.mcForecast = null;
    state.nflSchedule = null;
    state.nflScheduleLoading = false;
    state.nflScheduleError = null;
    state.tradeGive = [];
    state.tradeReceive = [];
    state.byeExpandedWeeks = {};
    state.tradePartnerExpanded = {};
    state.manualPartnerId = null;
    state.manualGive = [];
    state.manualReceive = [];
    state.reviewWeek = null;
    state.trendingAdds = null;
    state.tradedPicks = null; state.tradedPicksLoading = false; state.tradedPicksError = null;
    state.trendingAddsLoading = false;
    state.trendingAddsError = null;
    state.leagueTransactions = null;
    state.leagueTransactionsLoading = false;
    state.leagueTransactionsError = null;
    state.ownership = null;
    state.ownershipLoading = false;
    state.ownershipError = null;
    state.nflWeekOpponents = null;
    state.weather = {};
    state.weatherLoading = {};
    state.defenseRanks = null;
    state.defensePA = null;
    state.statsCardPid = null;
    state.playerCardTab = "upcoming";
    state.teamCompareWeek = null;
    state.rankWeek = null;
    state.rankExpanded = {};
    state.expert.loadedFor = null;
    state.expert.showNew = false;
    render();

    getState().then(function (st) {
      state.week = st.week || 1;
      return Promise.all([
        fetch("https://api.sleeper.app/v1/league/" + leagueId).then(function (r) {
          if (!r.ok) throw new Error("Liga konnte nicht geladen werden.");
          return r.json();
        }),
        fetch("https://api.sleeper.app/v1/league/" + leagueId + "/rosters").then(function (r) { return r.json(); }),
        fetch("https://api.sleeper.app/v1/league/" + leagueId + "/users").then(function (r) { return r.json(); }),
        fetch("https://api.sleeper.app/v1/league/" + leagueId + "/matchups/" + state.week).then(function (r) {
          return r.ok ? r.json() : [];
        })
      ]);
    }).then(function (results) {
      state.league = results[0];
      state.rosters = results[1];
      state.users = results[2];
      state.matchups = results[3];
      state.screen = "dashboard";
      state.tab = keepTab || "dashboard";
      state.rankView = "actual";
      state.lastRegWeek = (state.league.settings && state.league.settings.playoff_week_start)
        ? state.league.settings.playoff_week_start - 1 : 14;
      state.playoffTeamsCount = (state.league.settings && state.league.settings.playoff_teams) || 6;

      if (ownerUserId) {
        var mine = (state.rosters || []).filter(function (r) { return r.owner_id === ownerUserId; })[0];
        if (mine) state.myRosterId = mine.roster_id;
      }

      if (!state.players && !state.playersLoading) {
        state.playersLoading = true;
        fetch("https://api.sleeper.app/v1/players/nfl").then(function (r) { return r.json(); })
          .then(function (p) { state.players = p; state.playersLoading = false; render(); })
          .catch(function () { state.playersLoading = false; render(); });
      }

      loadProjections();
      loadSeasonMatchups();
      loadNflSchedule();
      loadWeeklyProjections();
      loadOwnership();
    }).catch(function (e) {
      state.error = e.message || "Verbindung fehlgeschlagen. Bitte Internetverbindung prüfen und erneut versuchen.";
    }).finally(function () {
      state.loading = false;
      state.loadedAt = Date.now();
      render();
    });
  }

  function refreshData() {
    if (!state.league || state.loading) return;
    var mine = rosterById(state.myRosterId);
    var tab = state.tab, sub = state.rankSub;
    state.players = null;
    state.playersLoading = false;
    loadLeague(state.league.league_id, mine ? mine.owner_id : null, tab);
    state.rankSub = sub;
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state.screen === "dashboard" && state.loadedAt && Date.now() - state.loadedAt > 20 * 60 * 1000) refreshData();
  });

  // ---------- Helpers ----------
  function normalizeProjections(raw) {
    var map = {};
    if (!raw) return map;
    if (Array.isArray(raw)) {
      raw.forEach(function (rec) {
        var pid = rec.player_id || (rec.player && rec.player.player_id);
        var stats = rec.stats || rec;
        if (pid) map[pid] = stats;
      });
    } else if (typeof raw === "object") {
      Object.keys(raw).forEach(function (pid) { map[pid] = raw[pid]; });
    }
    return map;
  }

  function loadWeeklyProjections() {
    if (!state.league || state.weeklyProjections || state.weeklyProjectionsLoading) return;
    if (!state.lastRegWeek || !state.week) return;
    var weeks = [];
    // inkl. der Playoff-Wochen (Runden = Bracket-Größe), soweit Sleeper dafür Projektionen liefert
    var poRounds = 1, poSize = 2;
    var poTeams = state.playoffTeamsCount || 6;
    while (poSize < poTeams) { poSize *= 2; poRounds++; }
    var lastProjWeek = Math.min(18, state.lastRegWeek + poRounds);
    for (var w = state.week; w <= lastProjWeek; w++) weeks.push(w);
    if (weeks.length === 0) { state.weeklyProjections = {}; return; }

    state.weeklyProjectionsLoading = true;
    state.weeklyProjectionsError = null;
    var season = state.league.season;

    Promise.all(weeks.map(function (w) {
      var url = "https://api.sleeper.app/projections/nfl/" + season + "/" + w +
        "?season_type=regular" + apiPosQs();
      return fetch(url).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (raw) { return { week: w, data: normalizeProjections(raw) }; })
        .catch(function () { return { week: w, data: null }; });
    })).then(function (results) {
      var map = {};
      var anySuccess = false;
      results.forEach(function (r) {
        if (r.data && Object.keys(r.data).length > 0) { map[r.week] = r.data; anySuccess = true; }
      });
      state.weeklyProjections = map;
      if (!anySuccess) {
        state.weeklyProjectionsError = "Wochenspezifische Projektionen sind aktuell nicht verfügbar (inoffizielle Sleeper-Schnittstelle) — Prognose nutzt weiterhin den saisonweiten Durchschnitt als Rückfallwert.";
      } else {
        state.mcForecast = null;
      }
    }).catch(function () {
      state.weeklyProjections = {};
      state.weeklyProjectionsError = "Wochenspezifische Projektionen sind aktuell nicht verfügbar (inoffizielle Sleeper-Schnittstelle) — Prognose nutzt weiterhin den saisonweiten Durchschnitt als Rückfallwert.";
    }).finally(function () {
      state.weeklyProjectionsLoading = false;
      render();
    });
  }

  // Aufstellung eines Teams für eine bestimmte Woche: die in Sleeper für diese Woche hinterlegten Starter
  // (nur Spieler, die noch im Kader sind); sonst die aktuelle Aufstellung.
  function weekLineupStarters(roster, week) {
    var current = (roster.starters || []).filter(function (pid) { return pid && pid !== "0"; });
    var entry = roster.roster_id !== undefined ? getRosterWeekEntry(week, roster.roster_id) : null;
    if (!entry || !entry.starters) return current;
    var onRoster = {};
    (roster.players || []).forEach(function (pid) { onRoster[pid] = true; });
    var wk = entry.starters.filter(function (pid) { return pid && pid !== "0" && (!roster.players || onRoster[pid]); });
    // unvollständig hinterlegte Zukunftswoche (weniger Starter als aktuell) -> aktuelle Aufstellung annehmen
    return wk.length >= current.length ? wk : current;
  }

  // Beste Aufstellung für eine Zukunftswoche nach Prognose (inkl. Bye-Wochen und Verletzungen): so würde man sie dann setzen.
  // Aktuelle Woche = tatsächlich gesetzte Aufstellung (weekLineupStarters).
  function bestProjectedLineup(roster, week) {
    var cache = state._bestLU;
    if (!cache || cache.ref !== state.weeklyProjections || cache.inj !== state.applyInjuries || cache.key !== state.scoringKey) {
      cache = state._bestLU = { ref: state.weeklyProjections, inj: state.applyInjuries, key: state.scoringKey, map: {} };
    }
    var hasWeek = state.weeklyProjections && state.weeklyProjections[week] ? 1 : 0;
    var ck = roster.roster_id + "|" + week + "|" + hasWeek + "|" + (state.players ? 1 : 0) + "|" + (roster.players || []).length;
    if (cache.map[ck]) return cache.map[ck];
    var slots = startingSlots();
    var pool = (roster.players || []).map(function (pid) {
      var v = weeklyProjPointsFor(week, pid);
      return { pid: pid, pos: positionOf(pid), pts: v === null ? 0 : v * weekAvailabilityFactor(pid, week) };
    });
    var used = {};
    var picked = [];
    slots.map(function (sl) { return sl; }).sort(function (x, y) {
      return (isFlexSlot(x) ? 1 : 0) - (isFlexSlot(y) ? 1 : 0);
    }).forEach(function (sl) {
      var eligible = isFlexSlot(sl) ? flexEligiblePositions(sl) : [sl];
      var best = null;
      pool.forEach(function (c) {
        if (used[c.pid] || eligible.indexOf(c.pos) === -1) return;
        if (!best || c.pts > best.pts) best = c;
      });
      if (best) { used[best.pid] = true; picked.push(best.pid); }
    });
    if (picked.length && hasWeek) cache.map[ck] = picked;
    return picked;
  }

  function weeklyStarterMean(roster, week, fallback) {
    if (!roster || !state.weeklyProjections || !state.weeklyProjections[week]) return fallback;
    var map = state.weeklyProjections[week];
    var starters = week > (state.week || 0) ? bestProjectedLineup(roster, week) : weekLineupStarters(roster, week);
    var total = 0, found = false;
    starters.forEach(function (pid) {
      var rec = map[pid];
      if (!rec) return;
      var val = recScore(rec, pid);
      if (val === undefined || val === null) {
        val = rec.pts_ppr !== undefined ? rec.pts_ppr : (rec.pts_half_ppr !== undefined ? rec.pts_half_ppr : rec.pts_std);
      }
      var num = parseFloat(val);

  function getRosterWeekEntry(week, rosterId) {

  function weeklyActualPointsFor(rosterEntry, pid) {

  function ensureWeekProjection(week) {

  // Punkte nach den ECHTEN Liga-Wertungsregeln (scoring_settings) aus den Rohwerten einer Projektion/Statistik.
  // Rückfall auf Sleepers vorgefertigte Werte (pts_ppr/half/std), wenn Rohwerte fehlen oder das Ergebnis unplausibel abweicht.
  function recScore(rec, pid) {
    var base = rec[state.scoringKey];
    var ss = state.league && state.league.scoring_settings;
    var pl = state.players && state.players[pid];
    if (!ss || !pl || ["QB", "RB", "WR", "TE", "DL", "LB", "DB"].indexOf(pl.position) === -1) return base;
    if (rec._lg !== undefined) return rec._lg;
    var total = 0, hit = 0;
    Object.keys(ss).forEach(function (k) {
      var m = parseFloat(ss[k]);
      if (!m) return;
      var v;
      if (k === "pass_inc") {
        if (rec.pass_att !== undefined && rec.pass_cmp !== undefined) v = rec.pass_att - rec.pass_cmp;
      } else if (k.indexOf("bonus_rec_") === 0) {
        if (k.slice(10).toUpperCase() === pl.position && rec.rec !== undefined) v = rec.rec;
      } else if (k.indexOf("bonus_") === 0) {
        return;
      } else {
        v = rec[k];

      v = parseFloat(v);
      if (isNaN(v)) return;
      total += v * m;
      hit++;

    var b = parseFloat(base);
    var result = total;
    var isIdpPl = IDP_POSITIONS.indexOf(pl.position) !== -1;
    if (isIdpPl) { if (hit < 1) result = base; }
    else if (hit < 3) result = base;
    else if (!isNaN(b) && Math.abs(total - b) > Math.max(6, 0.5 * Math.abs(b))) result = base;
    try { rec._lg = result; } catch (e) { /* ignore */ }
    return result;
  }

  function weeklyProjPointsFor(week, pid) {

  function parseCsv(text) {
    var rows = [], row = [], field = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function parseNflverseCsv(text) {
    var rows = parseCsv(text);
    var head = rows[0] || [];
    var idx = {};
    head.forEach(function (h, i) { idx[h] = i; });
    if (idx.player_id === undefined || idx.week === undefined) throw new Error("Unerwartetes Format (Spalten player_id/week fehlen)");
    var wantSeason = state.league ? String(state.league.season) : null;
    var cols = ["receiving_air_yards", "receiving_yards_after_catch", "air_yards_share", "target_share", "wopr", "racr", "attempts", "passing_air_yards", "targets", "receptions"];
    var out = {};
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (r.length < head.length) continue;
      if (idx.season_type !== undefined && r[idx.season_type] !== "REG") continue;
      if (idx.season !== undefined && wantSeason && r[idx.season] !== wantSeason) continue;
      var wk = parseInt(r[idx.week], 10);
      if (isNaN(wk)) continue;
      var rec = { pos: idx.position !== undefined ? r[idx.position] : null };
      cols.forEach(function (c) {
        var v = idx[c] !== undefined ? parseFloat(r[idx[c]]) : NaN;
        rec[c] = isNaN(v) ? null : v;

      if (!out[wk]) out[wk] = {};

  function computeDraftPicks() {

  function remainingWeeksN() {
    return Math.max(1, (state.lastRegWeek || 14) - (state.week || 1) + 1);

  // Geschätzte Ausfallwochen im Restzeitraum (Sleeper liefert keine Ausfalldauer)
  function injuryAbsenceWeeks(status) {
    var n = remainingWeeksN();
    if (!status) return 0;
    if (status === "IR" || status === "PUP" || status === "Suspended" || status === "NA" || status === "COV") return n;
    if (status === "Out") return Math.min(n, 2);
    if (status === "Doubtful") return 0.75;
    return 0;
  }

  function seasonAvailabilityFactor(pid) {
    if (!state.applyInjuries) return 1;
    var p = state.players && state.players[pid];

    var n = remainingWeeksN();
    return Math.max(0, (n - lost) / n);

  function weekAvailabilityFactor(pid, week) {

    var st = p && p.injury_status;
    if (!st) return 1;
    var k = week - (state.week || 1);
    if (st === "IR" || st === "PUP" || st === "Suspended" || st === "NA" || st === "COV") return 0;
    if (st === "Out") return k < 2 ? 0 : 1;
    if (st === "Doubtful") return k === 0 ? 0.25 : 1;
    return 1;
  }

  // Erwartete Punkte eines Spielers von der aktuellen Woche bis zum Ende der regulären Saison DER LIGA (vor den Playoffs).
  // Mit Wochenprojektionen: Summe der Wochenwerte (inkl. Bye/Verletzung). Sonst: Sleepers Saisonwert anteilig auf die Restwochen umgerechnet.
  var NFL_REGULAR_GAMES = 17;
  function adjProjPointsFor(pid) {
    var hasWeekly = state.weeklyProjections && Object.keys(state.weeklyProjections).length > 0;
    if (hasWeekly) {

      return sum;
    }
    return projPointsFor(pid) * Math.min(1, remainingWeeksN() / NFL_REGULAR_GAMES) * seasonAvailabilityFactor(pid);
  }

  function projPointsFor(pid) {
    if (!state.projections) return 0;

    if (val === undefined || val === null) {

    }
    var num = parseFloat(val);

  }

  function rosterCalcIds(roster) {

  // Klickbarer Spielername: öffnet die Spielerkarte (überall verfügbar)

  function positionProjectionBreakdown(roster) {
    if (!roster) return [];
    var sums = {};
    var counts = {};
    rosterCalcIds(roster).forEach(function (pid) {
      var pos = positionOf(pid);
      sums[pos] = (sums[pos] || 0) + adjProjPointsFor(pid);
      counts[pos] = (counts[pos] || 0) + 1;
    });
    return Object.keys(sums).map(function (pos) { return { pos: pos, points: sums[pos], count: counts[pos] }; })
      .sort(function (a, b) {
        var ai = POSITION_ORDER.indexOf(a.pos); var bi = POSITION_ORDER.indexOf(b.pos);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });
  }

  function startersProjectedTotal(roster) {
    if (!roster) return 0;
    var ids = (roster.starters || []).filter(function (pid) { return pid && pid !== "0"; });
    return ids.reduce(function (sum, pid) { return sum + adjProjPointsFor(pid); }, 0);
  }

  function isStarter(roster, pid) {
    return !!(roster && roster.starters && roster.starters.indexOf(pid) !== -1);
  }

  function loadSeasonMatchups() {
    if (!state.league || state.seasonMatchups || state.seasonMatchupsLoading) return;
    state.seasonMatchupsLoading = true;
    state.seasonMatchupsError = null;
    var leagueId = state.league.league_id;
    var lastWeek = state.lastRegWeek || 14;
    var weeks = [];
    for (var w = 1; w <= lastWeek; w++) weeks.push(w);

    Promise.all(weeks.map(function (w) {
      return fetch("https://api.sleeper.app/v1/league/" + leagueId + "/matchups/" + w)
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) { return { week: w, data: data || [] }; })
        .catch(function () { return { week: w, data: [] }; });
    })).then(function (results) {
      var map = {};
      results.forEach(function (res) { map[res.week] = res.data; });
      state.seasonMatchups = map;
    }).catch(function () {
      state.seasonMatchupsError = "Saison-Spielplan konnte nicht vollständig geladen werden.";
      state.seasonMatchups = {};
    }).finally(function () {
      state.seasonMatchupsLoading = false;
      render();
    });
  }

  function normalCDF(z) {
    var t = 1 / (1 + 0.2316419 * Math.abs(z));
    var d = 0.3989423 * Math.exp(-z * z / 2);
    var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return z > 0 ? 1 - p : p;
  }

  function gaussianSample(mean, sigma) {
    var u1 = Math.random() || 1e-9;
    var u2 = Math.random();
    var z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    return mean + z * sigma;
  }

  function actualWeeklyScores(rosterId) {
    var scores = [];
    if (!state.seasonMatchups) return scores;
    for (var w = 1; w < state.week; w++) {
      var wk = state.seasonMatchups[w];
      if (!wk) continue;
      var m = wk.filter(function (x) { return x.roster_id === rosterId; })[0];
      if (m && typeof m.points === "number" && m.points > 0) scores.push(m.points);
    }
    return scores;
  }

  function sampleStdDev(arr) {
    if (!arr || arr.length < 2) return null;
    var mean = arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
    var variance = arr.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / (arr.length - 1);
    return Math.sqrt(variance);
  }

  function runMonteCarloForecast(iterations, avgOverrides, startWeek) {
    if (!state.rosters || !state.seasonMatchups || !state.projections) return null;
    iterations = iterations || 1500;
    var lastWeek = state.lastRegWeek || 14;
    var playoffTeams = state.playoffTeamsCount || 6;
    var sw = startWeek || state.week;
    var remainingWeeksCount = Math.max(1, lastWeek - sw + 1);

    var params = {};
    state.rosters.forEach(function (r) {
      var avg = (avgOverrides && avgOverrides[r.roster_id] !== undefined)
        ? avgOverrides[r.roster_id]
        : startersProjectedTotal(r) / remainingWeeksCount;
      var sigma = sampleStdDev(actualWeeklyScores(r.roster_id));
      if (!sigma) sigma = avg * 0.20;
      params[r.roster_id] = { avg: avg, sigma: sigma };
    });

    var baseWins = {}, baseLosses = {}, baseTies = {}, basePf = {}, basePa = {};
    state.rosters.forEach(function (r) { baseWins[r.roster_id] = 0; baseLosses[r.roster_id] = 0; baseTies[r.roster_id] = 0; basePf[r.roster_id] = 0; basePa[r.roster_id] = 0; });

    for (var pw = 1; pw < sw; pw++) {
      var pwk = state.seasonMatchups[pw];
      if (!pwk) continue;
      var pgroups = {};
      pwk.forEach(function (m) { if (!pgroups[m.matchup_id]) pgroups[m.matchup_id] = []; pgroups[m.matchup_id].push(m); });
      Object.keys(pgroups).forEach(function (mid) {
        var pair = pgroups[mid];
        if (pair.length !== 2) return;
        var a = pair[0], b = pair[1];
        var aPts = a.points || 0, bPts = b.points || 0;
        basePf[a.roster_id] += aPts; basePf[b.roster_id] += bPts;
        basePa[a.roster_id] += bPts; basePa[b.roster_id] += aPts;
        if (aPts > bPts) { baseWins[a.roster_id]++; baseLosses[b.roster_id]++; }
        else if (bPts > aPts) { baseWins[b.roster_id]++; baseLosses[a.roster_id]++; }
        else { baseTies[a.roster_id]++; baseTies[b.roster_id]++; }
      });
    }

    var futureGroupsByWeek = [];
    for (var w = sw; w <= lastWeek; w++) {
      var wk = state.seasonMatchups[w] || [];
      var groups = {};
      wk.forEach(function (m) { if (!groups[m.matchup_id]) groups[m.matchup_id] = []; groups[m.matchup_id].push(m); });
      var pairs = Object.keys(groups).map(function (mid) { return groups[mid]; }).filter(function (p) { return p.length === 2; });
      futureGroupsByWeek.push({ week: w, pairs: pairs });
    }

    var weeklyMeans = {};
    futureGroupsByWeek.forEach(function (entry) {
      weeklyMeans[entry.week] = {};
      state.rosters.forEach(function (r) {
        var fallback = params[r.roster_id].avg;
        var useOverride = avgOverrides && avgOverrides[r.roster_id] !== undefined;
        weeklyMeans[entry.week][r.roster_id] = useOverride ? fallback : weeklyStarterMean(r, entry.week, fallback);
      });
    });

    // Playoff-Bracket (feste Setzliste, Freilose für die Top-Seeds, wenn die Teamzahl keine Zweierpotenz ist)
    var bracketSize = 2;
    while (bracketSize < playoffTeams) bracketSize *= 2;
    var bracketOrder = [1];
    while (bracketOrder.length < bracketSize) {
      var nextOrder = [];
      bracketOrder.forEach(function (sd) { nextOrder.push(sd, bracketOrder.length * 2 + 1 - sd); });
      bracketOrder = nextOrder;
    }
    var rosterObjById = {};
    state.rosters.forEach(function (r) { rosterObjById[r.roster_id] = r; });
    var champCount = {}, finalCount = {};
    state.rosters.forEach(function (r) { champCount[r.roster_id] = 0; finalCount[r.roster_id] = 0; });

    var playoffCount = {}, winsSum = {}, lossesSum = {}, tiesSum = {}, pfSum = {}, paSum = {}, rankSum = {};
    state.rosters.forEach(function (r) {
      playoffCount[r.roster_id] = 0; winsSum[r.roster_id] = 0; lossesSum[r.roster_id] = 0; tiesSum[r.roster_id] = 0;
      pfSum[r.roster_id] = 0; paSum[r.roster_id] = 0; rankSum[r.roster_id] = 0;
    });

    for (var it = 0; it < iterations; it++) {
      var wins = {}, losses = {}, ties = {}, pf = {}, pa = {};
      state.rosters.forEach(function (r) {
        wins[r.roster_id] = baseWins[r.roster_id]; losses[r.roster_id] = baseLosses[r.roster_id]; ties[r.roster_id] = baseTies[r.roster_id];
        pf[r.roster_id] = basePf[r.roster_id]; pa[r.roster_id] = basePa[r.roster_id];
      });

      futureGroupsByWeek.forEach(function (entry) {
        entry.pairs.forEach(function (pair) {
          var a = pair[0], b = pair[1];
          var pa2 = params[a.roster_id], pb = params[b.roster_id];
          if (!pa2 || !pb) return;
          var meanA = weeklyMeans[entry.week][a.roster_id];
          var meanB = weeklyMeans[entry.week][b.roster_id];
          var scoreA = Math.max(0, gaussianSample(meanA, pa2.sigma));
          var scoreB = Math.max(0, gaussianSample(meanB, pb.sigma));
          pf[a.roster_id] += scoreA; pf[b.roster_id] += scoreB;
          pa[a.roster_id] += scoreB; pa[b.roster_id] += scoreA;
          if (scoreA > scoreB) { wins[a.roster_id]++; losses[b.roster_id]++; }
          else if (scoreB > scoreA) { wins[b.roster_id]++; losses[a.roster_id]++; }
          else { ties[a.roster_id]++; ties[b.roster_id]++; }
        });
      });

      var list2 = state.rosters.map(function (r) { return { rosterId: r.roster_id, wins: wins[r.roster_id], pf: pf[r.roster_id] }; });
      list2.sort(function (x, y) { return y.wins - x.wins || y.pf - x.pf; });
      list2.forEach(function (t, idx) {
        winsSum[t.rosterId] += wins[t.rosterId];
        lossesSum[t.rosterId] += losses[t.rosterId];
        tiesSum[t.rosterId] += ties[t.rosterId];
        pfSum[t.rosterId] += pf[t.rosterId];
        paSum[t.rosterId] += pa[t.rosterId];
        rankSum[t.rosterId] += (idx + 1);
        if (idx < playoffTeams) playoffCount[t.rosterId]++;
      });

      // Playoffs simulieren
      var slots = bracketOrder.map(function (sd) { return sd <= playoffTeams && list2[sd - 1] ? list2[sd - 1].rosterId : null; });
      var round = 0;
      while (slots.length > 1) {
        var wkP = lastWeek + 1 + round;
        var advanced = [];
        for (var si = 0; si < slots.length; si += 2) {
          var ta = slots[si], tb = slots[si + 1];
          if (ta === null || ta === undefined) { advanced.push(tb); continue; }
          if (tb === null || tb === undefined) { advanced.push(ta); continue; }
          var sa = Math.max(0, gaussianSample(weeklyStarterMean(rosterObjById[ta], wkP, params[ta].avg), params[ta].sigma));
          var sb = Math.max(0, gaussianSample(weeklyStarterMean(rosterObjById[tb], wkP, params[tb].avg), params[tb].sigma));
          advanced.push(sa >= sb ? ta : tb);
        }
        if (advanced.length === 1) {
          slots.forEach(function (rid) { if (rid !== null && rid !== undefined) finalCount[rid]++; });
          champCount[advanced[0]]++;
        }
        slots = advanced;
        round++;
      }
    }

    var results = {};
    state.rosters.forEach(function (r) {
      results[r.roster_id] = {
        playoffPct: (playoffCount[r.roster_id] / iterations) * 100,
        champPct: (champCount[r.roster_id] / iterations) * 100,
        finalPct: (finalCount[r.roster_id] / iterations) * 100,
        avgWins: winsSum[r.roster_id] / iterations,
        avgLosses: lossesSum[r.roster_id] / iterations,
        avgTies: tiesSum[r.roster_id] / iterations,
        avgPf: pfSum[r.roster_id] / iterations,
        avgPa: paSum[r.roster_id] / iterations,
        avgRank: rankSum[r.roster_id] / iterations,
        sigma: params[r.roster_id].sigma,
        sigmaFromActuals: sampleStdDev(actualWeeklyScores(r.roster_id)) !== null
      };
    });

    return {
      byRoster: results, iterations: iterations, playoffTeams: playoffTeams, lastWeek: lastWeek,
      usesWeeklyProjections: !!(state.weeklyProjections && Object.keys(state.weeklyProjections).length > 0)
    };
  }

  function ensureForecastSimulation() {
    if (state.mcForecast) return state.mcForecast;
    if (!state.rosters || !state.seasonMatchups || !state.projections) return null;
    var result = runMonteCarloForecast(1500);
    state.mcForecast = result;
    return result;
  }

  function loadStoredForecast(leagueId) {
    try {
      var raw = localStorage.getItem("ffdash-forecast-" + leagueId);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function saveStoredForecast(leagueId, data) {
    try { localStorage.setItem("ffdash-forecast-" + leagueId, JSON.stringify(data)); } catch (e) { /* ignore, e.g. private browsing */ }
  }

  // Trend: Rangveränderung in der Playoff-Wahrscheinlichkeit seit der Vorwoche.
  // Vergleich zweier Simulationen mit demselben Verfahren (pauschaler Wochenschnitt): Stand vor dem letzten Spieltag vs. heute.
  function getForecastTrend(mc) {
    if (!state.league || !state.rosters || !mc) return {};
    if (state.mcTrendFor === mc) return state.mcTrend || {};
    var trend = {};
    if ((state.week || 1) >= 2 && state.seasonMatchups && state.projections) {
      var remaining = remainingWeeksN();
      var avgNow = {};
      state.rosters.forEach(function (r) { avgNow[r.roster_id] = startersProjectedTotal(r) / remaining; });
      var rankOf = function (res) {
        var list = state.rosters.map(function (r) {
          var m = res.byRoster[r.roster_id] || { playoffPct: 0, avgWins: 0 };
          return { rosterId: r.roster_id, playoffPct: m.playoffPct, avgWins: m.avgWins };
        }).sort(function (a2, b2) { return b2.playoffPct - a2.playoffPct || b2.avgWins - a2.avgWins; });
        var out = {};
        list.forEach(function (t, i) { out[t.rosterId] = i + 1; });
        return out;
      };
      var nowRes = runMonteCarloForecast(3000, avgNow, state.week);
      var beforeRes = runMonteCarloForecast(3000, avgNow, state.week - 1);
      if (nowRes && beforeRes) {
        var rNow = rankOf(nowRes), rBefore = rankOf(beforeRes);
        Object.keys(rNow).forEach(function (rid) { trend[rid] = rBefore[rid] - rNow[rid]; });
      }
    }
    state.mcTrendFor = mc;
    state.mcTrend = trend;
    return trend;
  }

  var ALL_NFL_TEAMS = ["ARI", "ATL", "BAL", "BUF", "CAR", "CHI", "CIN", "CLE", "DAL", "DEN", "DET", "GB",
    "HOU", "IND", "JAX", "KC", "LAC", "LAR", "LV", "MIA", "MIN", "NE", "NO", "NYG", "NYJ", "PHI", "PIT",
    "SEA", "SF", "TB", "TEN", "WAS"];

  function loadNflSchedule() {
    if (!state.league || state.nflSchedule || state.nflScheduleLoading) return;
    state.nflScheduleLoading = true;
    state.nflScheduleError = null;
    var season = state.league.season;

    fetch("https://api.sleeper.app/schedule/nfl/regular/" + season).then(function (r) {
      if (!r.ok) throw new Error("Spielplan nicht verfügbar (" + r.status + ")");
      return r.json();
    }).then(function (games) {
      var byWeek = {};
      var weekOpponents = {};
      (games || []).forEach(function (g) {
        var w = g.week || g.Week;
        var home = g.home || g.Home;
        var away = g.away || g.Away;
        if (!w) return;
        if (!byWeek[w]) byWeek[w] = {};
        if (home) byWeek[w][home] = true;
        if (away) byWeek[w][away] = true;
        if (home && away) {
          if (!weekOpponents[w]) weekOpponents[w] = {};
          weekOpponents[w][home] = { opp: away, isHome: true };
          weekOpponents[w][away] = { opp: home, isHome: false };
        }
      });
      var byeByTeam = {};
      Object.keys(byWeek).forEach(function (w) {
        ALL_NFL_TEAMS.forEach(function (team) {
          if (!byWeek[w][team] && !byeByTeam[team]) {
            byeByTeam[team] = parseInt(w, 10);
          }
        });
      });
      state.nflSchedule = byeByTeam;
      state.nflWeekOpponents = weekOpponents;
      if (Object.keys(byeByTeam).length === 0) {
        state.nflScheduleError = "Bye-Week-Daten für diese Saison noch nicht verfügbar.";
      }
    }).catch(function () {
      state.nflSchedule = {};
      state.nflWeekOpponents = {};
      state.nflScheduleError = "Bye-Week-Daten sind aktuell nicht verfügbar (inoffizielle Sleeper-Schnittstelle).";
    }).finally(function () {
      state.nflScheduleLoading = false;
      render();
    });
  }

  function weatherIconFor(homeTeam) {
    var info = TEAM_STADIUMS[homeTeam];
    if (!info) return "";
    if (info.dome) return '<span title="Innenstadion – kein Wettereinfluss">🏟️</span>';
    if (!state.weather) state.weather = {};
    if (!state.weatherLoading) state.weatherLoading = {};
    if (state.weather[homeTeam] === undefined && !state.weatherLoading[homeTeam]) {
      state.weatherLoading[homeTeam] = true;
      fetch("https://api.open-meteo.com/v1/forecast?latitude=" + info.lat + "&longitude=" + info.lon + "&current_weather=true")
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) { state.weather[homeTeam] = (data && data.current_weather) || null; })
        .catch(function () { state.weather[homeTeam] = null; })
        .finally(function () { state.weatherLoading[homeTeam] = false; render(); });
      return '<span style="opacity:0.4;">⛅</span>';
    }
    var w = state.weather[homeTeam];
    if (!w) return "";
    var code = w.weathercode;
    var icon = "☀️";
    if (code >= 95) icon = "⛈️";
    else if (code >= 71 && code <= 86) icon = "❄️";
    else if (code >= 51 && code <= 67) icon = "🌧️";
    else if (code >= 45 && code <= 48) icon = "🌫️";
    else if (code >= 1 && code <= 3) icon = "⛅";
    else if (w.windspeed >= 30) icon = "💨";
    return '<span title="Wetter am Spielort (' + escapeHtml(homeTeam) + '): ' + Math.round(w.temperature) + '°C, Wind ' + Math.round(w.windspeed) + ' km/h">' + icon + " " + Math.round(w.temperature) + "°C</span>";
  }

  function playerWeatherBadge(pid) {
    var p = state.players && state.players[pid];
    if (!p || !p.team) return "";
    var oppMapWk = state.nflWeekOpponents && state.nflWeekOpponents[state.week];
    var oppInfo = oppMapWk && oppMapWk[p.team];
    if (!oppInfo) return "";
    var homeTeam = oppInfo.isHome ? p.team : oppInfo.opp;
    return weatherIconFor(homeTeam);
  }

  function ensureDefenseStatsLoaded() {
    var lastDone = state.week - 1;
    for (var w = 1; w <= lastDone; w++) loadWeeklyStats(w);
  }

  function computeDefenseRankings() {
    if (state.defenseRanks) return state.defenseRanks;
    var lastDone = (state.week || 1) - 1;
    if (lastDone < 1 || !state.weeklyStats || !state.nflWeekOpponents || !state.players) return null;
    for (var w = 1; w <= lastDone; w++) {
      if (!state.weeklyStats[w]) return null;
    }
    var positions = ["QB", "RB", "WR", "TE"];
    var allowed = {};
    ALL_NFL_TEAMS.forEach(function (t) {
      allowed[t] = {};
      positions.forEach(function (p) { allowed[t][p] = { sum: 0, weeks: {} }; });
    });
    for (var week = 1; week <= lastDone; week++) {
      var statsWk = state.weeklyStats[week];
      var oppMapWk = state.nflWeekOpponents[week];
      if (!statsWk || !oppMapWk) continue;
      Object.keys(statsWk).forEach(function (pid) {
        var p = state.players[pid];
        if (!p || !p.team) return;
        var pos = p.position;
        if (positions.indexOf(pos) === -1) return;
        var oppInfo = oppMapWk[p.team];
        if (!oppInfo) return;
        var rec = statsWk[pid];
        var val = recScore(rec, pid);
        if (val === undefined || val === null) {
          val = rec.pts_ppr !== undefined ? rec.pts_ppr : (rec.pts_half_ppr !== undefined ? rec.pts_half_ppr : rec.pts_std);
        }
        var num = parseFloat(val);
        if (isNaN(num)) return;
        var bucket = allowed[oppInfo.opp] && allowed[oppInfo.opp][pos];
        if (!bucket) return;
        bucket.sum += num;
        bucket.weeks[week] = true;
      });
    }
    var ranks = {};
    var paAvg = {};
    positions.forEach(function (pos) {
      var rows = ALL_NFL_TEAMS.map(function (t) {
        var b = allowed[t][pos];
        var weeksPlayed = Object.keys(b.weeks).length || 1;
        return { team: t, avg: b.sum / weeksPlayed };
      });
      rows.sort(function (a, b) { return b.avg - a.avg; });
      rows.forEach(function (r, i) { r.rank = i + 1; });
      rows.forEach(function (r) {
        if (!ranks[r.team]) ranks[r.team] = {};
        ranks[r.team][pos] = r.rank;
        if (!paAvg[r.team]) paAvg[r.team] = {};
        paAvg[r.team][pos] = r.avg;
      });
    });
    state.defensePA = paAvg;
    state.defenseRanks = ranks;
    return ranks;
  }

  // Angezeigter Defense-Rang: 1 = stärkste Defense (schwerstes Matchup), 32 = schwächste (leichtestes).
  // Intern bleibt der Rang "1 = erlaubt die meisten Punkte" (Farben, Prognose-Anpassung), nur die Anzeige wird umgekehrt.
  function defShown(r) { return ALL_NFL_TEAMS.length + 1 - r; }

  function opponentRankBadge(pid) {
    var p = state.players && state.players[pid];
    if (!p || !p.team) return "";
    var pos = p.position;
    if (["QB", "RB", "WR", "TE"].indexOf(pos) === -1) return "";
    var oppMapWk = state.nflWeekOpponents && state.nflWeekOpponents[state.week];
    var oppInfo = oppMapWk && oppMapWk[p.team];
    if (!oppInfo) return "";
    ensureDefenseStatsLoaded();
    var ranks = computeDefenseRankings();
    if (!ranks || !ranks[oppInfo.opp] || !ranks[oppInfo.opp][pos]) return "";
    var rank = ranks[oppInfo.opp][pos];

    return '<span title="Gegner ' + escapeHtml(oppInfo.opp) + " ist Rang " + defShown(rank) + " von 32 gegen " + escapeHtml(pos) + '" style="font-size:11px;font-weight:700;color:' + color + ";border:1px solid " + color + ';border-radius:8px;padding:1px 6px;white-space:nowrap;">vs ' + escapeHtml(oppInfo.opp) + " · " + defShown(rank) + ".</span>";
  }

  function statBreakdownFromRec(rec, pos) {
    if (!rec) return null;
    var parts = [];
    function add(label, val, dec) {
      var num = parseFloat(val);
      if (!isNaN(num) && num !== 0) parts.push(num.toFixed(dec || 0) + " " + label);
    }
    if (pos === "QB") {
      add("Pass-Yd", rec.pass_yd); add("Pass-TD", rec.pass_td); add("Rush-Yd", rec.rush_yd);
    } else if (pos === "RB") {
      add("Rush-Yd", rec.rush_yd); add("Rush-TD", rec.rush_td); add("Rec", rec.rec); add("Rec-Yd", rec.rec_yd);
    } else if (pos === "WR" || pos === "TE") {
      add("Ziele", rec.rec_tgt); add("Rec", rec.rec); add("Rec-Yd", rec.rec_yd); add("Rec-TD", rec.rec_td);
    } else if (pos === "K") {
      add("FG", rec.fgm); add("XP", rec.xpm);
    } else if (pos === "DEF") {
      add("Sacks", rec.sack); add("INT", rec.int); add("Fum.Rec.", rec.fum_rec);
    } else if (IDP_POSITIONS.indexOf(pos) !== -1) {
      var tk = rec.idp_tkl !== undefined ? rec.idp_tkl : ((parseFloat(rec.idp_tkl_solo) || 0) + (parseFloat(rec.idp_tkl_ast) || 0));
      add("Tackles", tk || null); add("Sacks", rec.idp_sack); add("INT", rec.idp_int); add("PD", rec.idp_pass_def);
    }
    return parts.length ? parts.join(" · ") : null;
  }

  function statBreakdownFor(pid) {
    if (!state.projections) return null;
    var rec = state.projections[pid];
    if (!rec) return null;
    return statBreakdownFromRec(rec, positionOf(pid));
  }

  function statBreakdownForWeek(pid, week) {
    if (!state.weeklyProjections || !state.weeklyProjections[week]) return null;
    var rec = state.weeklyProjections[week][pid];

  function loadOwnership() {
    if (!state.league || state.ownership || state.ownershipLoading) return;
    state.ownershipLoading = true;
    state.ownershipError = null;
    var season = state.league.season;
    var week = state.week || 1;
    fetch("https://api.sleeper.com/players/nfl/research/regular/" + season + "/" + week)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) { state.ownership = data || {}; })
      .catch(function () { state.ownership = {}; state.ownershipError = "Besitzquoten aktuell nicht verfügbar (inoffizielle Sleeper-Schnittstelle)."; })
      .finally(function () { state.ownershipLoading = false; render(); });
  }

  function ownershipFor(pid) {
    if (!state.ownership) return null;
    var rec = state.ownership[pid];
    if (!rec) return null;
    var owned = rec.owned !== undefined ? rec.owned : (rec.own !== undefined ? rec.own : null);
    var started = rec.started !== undefined ? rec.started : null;
    if (owned === null && started === null) return null;
    var parts = [];
    if (owned !== null && !isNaN(parseFloat(owned))) parts.push(Math.round(owned) + "% Rostered");
    if (started !== null && !isNaN(parseFloat(started))) parts.push(Math.round(started) + "% Start");
    return parts.length ? parts.join(" · ") : null;
  }

  function matchupWinProbability(rosterIdA, rosterIdB, week) {
    if (rosterIdA === undefined || rosterIdA === null || rosterIdB === undefined || rosterIdB === null) return null;
    var rosterA = rosterById(rosterIdA), rosterB = rosterById(rosterIdB);
    if (!rosterA || !rosterB) return null;
    var mc = ensureForecastSimulation();
    if (!mc) return null;
    var lastWeek = state.lastRegWeek || 14;
    var remainingWeeksCount = Math.max(1, lastWeek - state.week + 1);
    var avgA = startersProjectedTotal(rosterA) / remainingWeeksCount;
    var avgB = startersProjectedTotal(rosterB) / remainingWeeksCount;
    var scoreA = weeklyStarterMean(rosterA, week, avgA);
    var scoreB = weeklyStarterMean(rosterB, week, avgB);
    var sigmaA = (mc.byRoster[rosterIdA] && mc.byRoster[rosterIdA].sigma) || Math.max(1, scoreA * 0.2);
    var sigmaB = (mc.byRoster[rosterIdB] && mc.byRoster[rosterIdB].sigma) || Math.max(1, scoreB * 0.2);
    var combinedSigma = Math.sqrt(sigmaA * sigmaA + sigmaB * sigmaB) || 1;
    var pct = normalCDF((scoreA - scoreB) / combinedSigma) * 100;
    return { myScore: scoreA, oppScore: scoreB, pct: pct };
  }

  function winProbBadge(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return "";
    var stars = Math.max(1, Math.min(5, Math.round(pct / 20)));

    var starsHtml = "";

    }
