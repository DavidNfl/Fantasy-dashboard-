  // ---------- Waiver-Analyse: Add/Drop-Vergleich ----------
  function wvPosOrder(pos) { var i = POSITION_ORDER.indexOf(pos); return i === -1 ? 99 : i; }

  function wvData() {
    var key = [state.weeklyProjections ? Object.keys(state.weeklyProjections).length : 0, state.applyInjuries, state.scoringKey, state.week, (state.rosters || []).length].join("|");
    var c = state._wvCache;
    if (c && c.key === key && c.ref === state.weeklyProjections && c.owner === JSON.stringify(rosterOwnerMap()).length) return c;
    var owner = rosterOwnerMap();
    var ros = buildRankingData("ros", state.week, owner);
    var wk = buildRankingData("week", state.week, owner);
    var rosRank = {}, wkRank = {}, rosVal = {}, wkVal = {}, free = [];
    RANK_POSITIONS.forEach(function (pos) {
      ros[pos].forEach(function (it) {
        if (it.rank !== null) rosRank[it.pid] = it.rank;
        rosVal[it.pid] = it.val;
        if (it.status === "free" && it.val !== null) free.push(it);
      });
      wk[pos].forEach(function (it) { if (it.rank !== null) wkRank[it.pid] = it.rank; wkVal[it.pid] = it.val; });
    });
    free.sort(function (a, b) { return b.val - a.val; });
    c = state._wvCache = { key: key, ref: state.weeklyProjections, owner: JSON.stringify(owner).length, rosRank: rosRank, wkRank: wkRank, rosVal: rosVal, wkVal: wkVal, free: free };
    return c;
  }

  function wvAddOptionsHtml() {
    var d = wvData();
    var w = state.wv;
    var q = (w.q || "").toLowerCase().trim();
    var list = d.free.filter(function (it) {
      if (w.pos !== "ALL" && it.pos !== w.pos) return false;
      if (q) {
        var p = state.players[it.pid];
        var nm = ((p.first_name || "") + " " + (p.last_name || "") + " " + (p.team || "")).toLowerCase();
        if (nm.indexOf(q) === -1) return false;
      }
      return true;
    }).slice(0, 80);
    var html = '<option value="">– freien Spieler wählen –</option>' + list.map(function (it) {
      var p = state.players[it.pid];
      var nm = it.pos === "DEF" ? (p.last_name || it.pid) : nameOf(it.pid);
      return '<option value="' + escapeHtml(it.pid) + '"' + (w.add === it.pid ? " selected" : "") + ">" + escapeHtml(nm + " · " + (it.pos === "DEF" ? "DST" : it.pos) + " (" + (p.team || "FA") + ") · ROS " + it.val.toFixed(1)) + "</option>";
    }).join("");
    if (w.add && !list.some(function (it) { return it.pid === w.add; })) {
      html += '<option value="' + escapeHtml(w.add) + '" selected>' + escapeHtml(nameOf(w.add)) + "</option>";
    }
    return html;
  }

  function wvDropOptionsHtml() {
    var d = wvData();
    var roster = rosterById(state.myRosterId);
    var w = state.wv;
    var pids = (roster.players || []).filter(function (pid) { return RANK_POSITIONS.indexOf(positionOf(pid)) !== -1; }).sort(function (a, b) {
      return wvPosOrder(positionOf(a)) - wvPosOrder(positionOf(b)) || (d.rosVal[b] || 0) - (d.rosVal[a] || 0);
    });
    return '<option value="">– eigenen Spieler wählen –</option>' + pids.map(function (pid) {
      var p = state.players[pid];
      var pos = positionOf(pid);
      var v = d.rosVal[pid];
      return '<option value="' + escapeHtml(pid) + '"' + (w.drop === pid ? " selected" : "") + ">" + escapeHtml((pos === "DEF" ? (p.last_name || pid) : nameOf(pid)) + " · " + (pos === "DEF" ? "DST" : pos) + " (" + (p.team || "FA") + ")" + (v ? " · ROS " + v.toFixed(1) : "")) + "</option>";
    }).join("");
  }

  // Standard-Drop: schwächster eigener Spieler der gleichen Position (nach Restsaison-Prognose)
  function wvAutoDrop(addPid) {
    var d = wvData();
    var roster = rosterById(state.myRosterId);
    var pos = positionOf(addPid);
    var mine = (roster.players || []).filter(function (pid) { return positionOf(pid) === pos; });
    if (!mine.length) mine = (roster.players || []).filter(function (pid) { return RANK_POSITIONS.indexOf(positionOf(pid)) !== -1; });
    mine.sort(function (a, b) { return (d.rosVal[a] || 0) - (d.rosVal[b] || 0); });
    return mine[0] || null;
  }

  function wvLineupPts(roster, week) {
    if (!state.weeklyProjections || !state.weeklyProjections[week]) return null;
    var total = 0;
    bestProjectedLineup(roster, week).forEach(function (pid) {
      var v = weeklyProjPointsFor(week, pid);
      total += (v === null ? 0 : v) * weekAvailabilityFactor(pid, week);
    });
    return total;
  }

  function wvLineupRos(roster) {
    var total = 0, any = false;
    for (var w = state.week; w <= (state.lastRegWeek || state.week); w++) {
      var v = wvLineupPts(roster, w);
      if (v !== null) { total += v; any = true; }
    }
    return any ? total : null;
  }

  // Wie viele Wochen (ab jetzt bis Ende der regulären Saison) haben Prognosen? Alle Vergleiche rechnen mit genau diesen Wochen.
  function wvWeeksCovered() {
    var n = 0;
    for (var w = state.week; w <= (state.lastRegWeek || state.week); w++) if (state.weeklyProjections && state.weeklyProjections[w]) n++;
    return n;
  }

  function wvHypRoster(roster, addPid, dropPid) {
    var copy = {};
    Object.keys(roster).forEach(function (k) { copy[k] = roster[k]; });
    copy.roster_id = "hyp|" + addPid + "|" + dropPid;
    copy.players = (roster.players || []).filter(function (pid) { return pid !== dropPid; }).concat([addPid]);
    return copy;
  }

  function wvWinPct(myScore, oppRosterId, oppScoreOverride) {
    var opp = rosterById(oppRosterId);
    if (!opp) return null;
    var mc = ensureForecastSimulation();
    var lastWeek = state.lastRegWeek || 14;
    var n = Math.max(1, lastWeek - state.week + 1);
    var oppScore = (oppScoreOverride !== undefined && oppScoreOverride !== null) ? oppScoreOverride : weeklyStarterMean(opp, state.week, startersProjectedTotal(opp) / n);
    var sm = (mc && mc.byRoster[state.myRosterId] && mc.byRoster[state.myRosterId].sigma) || Math.max(1, myScore * 0.2);
    var so = (mc && mc.byRoster[oppRosterId] && mc.byRoster[oppRosterId].sigma) || Math.max(1, oppScore * 0.2);
    return normalCDF((myScore - oppScore) / (Math.sqrt(sm * sm + so * so) || 1)) * 100;
  }

  function wvOpponentRosterId() {
    var mine = getRosterWeekEntry(state.week, state.myRosterId);
    if (!mine) return null;
    var o = (state.seasonMatchups[state.week] || []).filter(function (m) { return m.matchup_id === mine.matchup_id && m.roster_id !== state.myRosterId; })[0];
    return o ? o.roster_id : null;
  }

  function wvOppLabel(pid, week) {
    var p = state.players[pid];
    if (!p || !p.team) return "–";
    var o = state.nflWeekOpponents && state.nflWeekOpponents[week] ? state.nflWeekOpponents[week][p.team] : null;
    if (!o) return state.nflWeekOpponents ? "Bye" : "–";
    return (o.isHome ? "vs. " : "@ ") + o.opp;
  }

  function wvHeaderCard(pid, kind) {
    var p = state.players[pid];
    var isAdd = kind === "add";
    return '<div style="flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card, #fff);text-align:center;">' +
      '<div style="background:' + (isAdd ? "var(--green)" : "var(--red)") + ';color:#fff;font-weight:800;font-size:13px;padding:3px 0;">' + (isAdd ? "+ ADD" : "− DROP") + "</div>" +
      '<div style="padding:10px 6px 12px;"><img src="' + photoUrlFor(pid) + '" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:50%;background:var(--bg);" onerror="this.style.visibility=\'hidden\';" />' +
      '<div style="font-weight:800;font-size:15px;margin-top:4px;">' + pnLink(pid, shortPlayerName(pid)) + injuryTagHtml(pid) + "</div>" +
      '<div style="color:var(--muted);font-size:13px;">' + playerMetaLine(pid) + "</div></div></div>";
  }

  // Zeile: links Add-Wert, Mitte Beschriftung, rechts Drop-Wert; besserer Wert grün
  function wvCmpRow(label, l, r, opts) {
    opts = opts || {};
    var better = 0;
    if (l !== null && r !== null && l !== r) better = (l > r) === !opts.lowBetter ? 1 : -1;
    var fmt = opts.fmt || function (v) { return v === null ? "–" : (Math.round(v * 10) / 10).toFixed(1); };
    function cell(v, good) { return '<span style="font-weight:800;font-size:15px;color:' + (good ? "var(--green)" : "var(--ink)") + ';">' + (opts.raw ? (v === null ? "–" : v) : fmt(v)) + "</span>"; }
    return '<div style="display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:6px;padding:6px 2px;border-top:1px solid var(--border);text-align:center;">' +
      cell(l, better === 1) + '<span style="color:var(--muted);font-size:13px;">' + label + "</span>" + cell(r, better === -1) + "</div>";
  }
  function wvTextRow(label, l, r, goodL, goodR) {
    function cell(t, good) { return '<span style="font-weight:800;font-size:15px;color:' + (good ? "var(--green)" : "var(--ink)") + ';">' + t + "</span>"; }
    return '<div style="display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:6px;padding:6px 2px;border-top:1px solid var(--border);text-align:center;">' +
      cell(l, goodL) + '<span style="color:var(--muted);font-size:13px;">' + label + "</span>" + cell(r, goodR) + "</div>";
  }
  function wvBarRow(label, l, r) {
    var mx = Math.max(l || 0, r || 0, 0.0001);
    return '<div style="display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:6px;text-align:center;padding:4px 2px 8px;">' +
      '<div style="display:flex;justify-content:flex-end;"><div style="height:8px;border-radius:4px;background:' + ((l || 0) >= (r || 0) ? "var(--green)" : "var(--border)") + ";width:" + Math.max(4, (l || 0) / mx * 100).toFixed(0) + '%;"></div></div>' +
      '<span style="color:var(--muted);font-size:13px;font-weight:700;">' + label + "</span>" +
      '<div style="display:flex;"><div style="height:8px;border-radius:4px;background:' + ((r || 0) > (l || 0) ? "var(--green)" : "var(--border)") + ";width:" + Math.max(4, (r || 0) / mx * 100).toFixed(0) + '%;"></div></div></div>';
  }
  function wvCard(title, inner) {
    return '<div class="card" style="padding:14px 16px;margin-bottom:12px;"><div style="text-align:center;font-weight:800;font-size:17px;margin-bottom:6px;">' + title + "</div>" + inner + "</div>";
  }

  function wvSignedHtml(v, digits, suffix) {
    if (v === null || v === undefined || isNaN(v)) return "–";
    var s = (v > 0 ? "+" : "") + v.toFixed(digits === undefined ? 1 : digits) + (suffix || "");
    var col = v > 0.05 ? "var(--green)" : (v < -0.05 ? "var(--red)" : "var(--muted)");
    return '<b style="color:' + col + ';">' + s + "</b>";
  }

  function wvOverviewHtml(c) {
    var w = state.wv, d = wvData(), cur = state.week;
    var out = "";
    var addRank = d.rosRank[w.add] || null, dropRank = d.rosRank[w.drop] || null;
    var posA = positionOf(w.add), posD = positionOf(w.drop);
    var verdict;
    if (c.rosDelta === null) verdict = "";
    else if (c.rosDelta >= 1) verdict = '<span style="color:var(--green);">✔ Lohnt sich: ' + c.rosDelta.toFixed(1) + " Punkte mehr in deinem Lineup bis Ende der regulären Saison.</span>";
    else if (c.rosDelta <= -1) verdict = '<span style="color:var(--red);">✘ Verschlechtert dein Lineup um ' + Math.abs(c.rosDelta).toFixed(1) + " Punkte bis Ende der regulären Saison.</span>";
    else verdict = '<span style="color:var(--gold);">≈ Kaum Unterschied für dein Lineup (' + (c.rosDelta >= 0 ? "+" : "") + c.rosDelta.toFixed(1) + " Punkte).</span>";
    var sum = '<div style="font-weight:700;margin-bottom:8px;">' + verdict + "</div>" +
      '<div style="font-weight:800;color:var(--muted);margin:6px 0 2px;">Woche ' + cur + "</div>" +
      '<div style="padding:3px 0;">Startaufstellung: ' + (c.wkBefore === null ? "–" : "<b>" + c.wkBefore.toFixed(1) + " → " + c.wkAfter.toFixed(1) + "</b> (" + wvSignedHtml(c.wkAfter - c.wkBefore) + ")") + "</div>" +
      '<div style="padding:3px 0;">Siegchance: ' + (c.winBefore === null ? "–" : "<b>" + c.winBefore.toFixed(0) + "% → " + c.winAfter.toFixed(0) + "%</b> (" + wvSignedHtml(c.winAfter - c.winBefore, 1, " pp") + ")") + "</div>" +
      '<div style="font-weight:800;color:var(--muted);margin:10px 0 2px;">Rest der Saison (bis Woche ' + (state.lastRegWeek || cur) + ")</div>" +
      '<div style="padding:3px 0;">Lineup-Punkte: ' + (c.rosBefore === null ? "–" : "<b>" + c.rosBefore.toFixed(1) + " → " + c.rosAfter.toFixed(1) + "</b> (" + wvSignedHtml(c.rosDelta) + ")") + "</div>" +
      '<div style="padding:3px 0;">Power-Score: ' + (c.powRos === null ? "–" : "<b>" + c.powRos.before.toFixed(1) + " → " + c.powRos.after.toFixed(1) + "</b> (" + wvSignedHtml(c.powRos.after - c.powRos.before) + ")") + "</div>";
    out += wvCard("Zusammenfassung", sum);
    var rosInner = wvBarRow("Prognose Restsaison", c.addRos, c.dropRos) +
      wvTextRow("Positions-Rang (ROS)", addRank ? posA + addRank : "–", dropRank ? posD + dropRank : "–", addRank && dropRank && addRank < dropRank, addRank && dropRank && dropRank < addRank) +
      wvCmpRow("Ø Punkte / Woche", c.addAvg, c.dropAvg) +
      wvCmpRow("Lineup-Punkte ROS", c.rosAfter, c.rosBefore) +
      wvCmpRow("Power-Score ROS", c.powRos ? c.powRos.after : null, c.powRos ? c.powRos.before : null);
    out += wvCard("Impact Rest der Saison", rosInner);
    var wkInner = wvTextRow("Starter in Woche " + cur, c.addStarts ? "Ja" : "Nein", c.dropStarts ? "Ja" : "Nein", c.addStarts && !c.dropStarts, c.dropStarts && !c.addStarts) +
      wvTextRow("Gegner", escapeHtml(wvOppLabel(w.add, cur)), escapeHtml(wvOppLabel(w.drop, cur)), false, false) +
      wvCmpRow("Prognose Woche " + cur, c.addWk, c.dropWk) +
      wvCmpRow("Startaufstellung", c.wkAfter, c.wkBefore) +
      wvCmpRow("Siegchance (%)", c.winAfter, c.winBefore, { fmt: function (v) { return v === null ? "–" : v.toFixed(1) + "%"; } });
    out += wvCard("Impact Woche " + cur, wkInner);
    return out;
  }

  function wvGamesHtml() {
    var w = state.wv, cur = state.week;
    loadNflSchedule();
    ensureDefenseStatsLoaded();
    if (!state.nflWeekOpponents) return '<div class="loading">Spielplan wird geladen…</div>';
    var ranks = state.defenseRanks || computeDefenseRankings() || {};
    var posA = positionOf(w.add), posD = positionOf(w.drop);
    var pa = state.players[w.add], pd = state.players[w.drop];
    function side(p, pos, week) {
      var o = p && p.team && state.nflWeekOpponents[week] ? state.nflWeekOpponents[week][p.team] : null;
      if (!o) return { html: '<span style="color:var(--muted);font-weight:700;">Bye</span>', rank: null };
      var rk = ranks[o.opp] && ranks[o.opp][pos] ? ranks[o.opp][pos] : null;
      return { rank: rk, html: '<span style="font-weight:800;">' + (o.isHome ? "vs. " : "@ ") + escapeHtml(o.opp) + "</span>" + (rk ? " " + rankBadgeHtml(rk) : "") };
    }
    var rows = "", sumA = 0, nA = 0, sumD = 0, nD = 0;
    for (var wk = cur; wk <= 18; wk++) {
      var a = side(pa, posA, wk), d = side(pd, posD, wk);
      if (a.rank && wk <= (state.lastRegWeek || 18)) { sumA += a.rank; nA++; }
      if (d.rank && wk <= (state.lastRegWeek || 18)) { sumD += d.rank; nD++; }
      rows += '<div style="display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:6px;padding:7px 2px;border-top:1px solid var(--border);text-align:center;' + (wk === cur ? "background:var(--green-light);" : "") + '">' +
        "<div>" + a.html + '</div><div style="color:var(--muted);font-size:12px;font-weight:700;">W' + wk + "</div><div>" + d.html + "</div></div>";
    }
    var avgRow = "";
    if (nA || nD) {
      avgRow = '<div style="display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px;text-align:center;padding:8px 2px 2px;border-top:2px solid var(--border);margin-top:4px;"><b style="color:' + (nA && nD && sumA / nA < sumD / nD ? "var(--green)" : "var(--ink)") + ';">' + (nA ? (ALL_NFL_TEAMS.length + 1 - sumA / nA).toFixed(1) : "–") + '</b><span style="color:var(--muted);font-size:13px;">Ø Gegner-Rang (Reg. Saison)</span><b style="color:' + (nA && nD && sumD / nD < sumA / nA ? "var(--green)" : "var(--ink)") + ';">' + (nD ? (ALL_NFL_TEAMS.length + 1 - sumD / nD).toFixed(1) : "–") + "</b></div>";
    }
    return '<div class="hint" style="margin:0 0 10px;">Gegner-Rang gegen die jeweilige Position: 1 = stärkste Defense, die der Position am wenigsten Punkte erlaubt (<b style="color:var(--red);">rot</b>, schweres Matchup), 32 = schwächste Defense (<b style="color:var(--green);">grün</b>, leichtes Matchup). Für K und DST gibt es keine Wertung.</div>' +
      wvCard("Spielplan ab Woche " + cur, rows + avgRow);
  }

  function wvStatsDefs(pos) {
    return {
      QB: [["Pass-Yds", "pass_yd"], ["Pass-TD", "pass_td"], ["INT", "pass_int", 1], ["Rush-Yds", "rush_yd"], ["Rush-TD", "rush_td"]],
      RB: [["Rush-Att", "rush_att"], ["Rush-Yds", "rush_yd"], ["Rush-TD", "rush_td"], ["Targets", "rec_tgt"], ["Rec", "rec"], ["Rec-Yds", "rec_yd"], ["Rec-TD", "rec_td"]],
      WR: [["Targets", "rec_tgt"], ["Rec", "rec"], ["Rec-Yds", "rec_yd"], ["Rec-TD", "rec_td"], ["Rush-Yds", "rush_yd"]],
      TE: [["Targets", "rec_tgt"], ["Rec", "rec"], ["Rec-Yds", "rec_yd"], ["Rec-TD", "rec_td"]],
      K: [["Field Goals", "fgm"], ["FG-Versuche", "fga"], ["Extra Points", "xpm"]],
      DEF: [["Sacks", "sack"], ["Interceptions", "int"], ["Fumble Rec.", "fum_rec"], ["Defense-TD", "def_td"]],
      DL: [["Tackles", "idp_tkl_solo+idp_tkl_ast"], ["TFL", "idp_tkl_loss"], ["Sacks", "idp_sack"], ["QB-Hits", "idp_qb_hit"], ["Forced Fumbles", "idp_ff"]],
      LB: [["Tackles", "idp_tkl_solo+idp_tkl_ast"], ["TFL", "idp_tkl_loss"], ["Sacks", "idp_sack"], ["Interceptions", "idp_int"], ["Pass Deflections", "idp_pass_def"], ["Forced Fumbles", "idp_ff"]],
      DB: [["Tackles", "idp_tkl_solo+idp_tkl_ast"], ["Interceptions", "idp_int"], ["Pass Deflections", "idp_pass_def"], ["Forced Fumbles", "idp_ff"]]
    }[pos] || [];
  }

  function wvAggregate(pid, weeks) {
    var res = { g: 0, pts: 0, best: null, sums: {} };
    weeks.forEach(function (wk) {
      var st = state.weeklyStats && state.weeklyStats[wk];
      var raw = st && st[pid];
      if (!raw || (raw.gp !== undefined && !(parseFloat(raw.gp) > 0))) return;
      var v = parseFloat(recScore(raw, pid));
      if (isNaN(v)) { v = parseFloat(raw.pts_ppr !== undefined ? raw.pts_ppr : (raw.pts_half_ppr !== undefined ? raw.pts_half_ppr : raw.pts_std)); }
      if (isNaN(v)) return;
      res.g++; res.pts += v;
      if (res.best === null || v > res.best) res.best = v;
      Object.keys(raw).forEach(function (k) { var n = parseFloat(raw[k]); if (!isNaN(n)) res.sums[k] = (res.sums[k] || 0) + n; });
    });
    return res;
  }

  function wvSumKey(sums, key) {
    return key.split("+").reduce(function (a, k) { return a + (sums[k] || 0); }, 0);
  }

  function wvStatsHtml() {
    var w = state.wv, last = (state.week || 1) - 1;
    if (last < 1) return '<div class="hint">Noch keine gespielte Woche in dieser Saison.</div>';
    ensureDefenseStatsLoaded();
    for (var lw = 1; lw <= last; lw++) if (!state.weeklyStats || !state.weeklyStats[lw]) return '<div class="loading">Statistiken werden geladen…</div>';
    var posA = positionOf(w.add), posD = positionOf(w.drop);
    var all = []; for (var i = 1; i <= last; i++) all.push(i);
    function playedWeeks(pid) { return all.filter(function (wk) { var r = state.weeklyStats[wk][pid]; return r && (r.gp === undefined || parseFloat(r.gp) > 0); }); }
    function block(weeks, title) {
      var A = wvAggregate(w.add, weeks.a), D = wvAggregate(w.drop, weeks.d);
      var defs = posA === posD ? wvStatsDefs(posA) : [];
      var inner = wvBarRow("Punkte", A.pts, D.pts) + wvCmpRow("Punkte", A.pts, D.pts) +
        wvCmpRow("Spiele", A.g, D.g, { raw: true }) +
        wvCmpRow("Ø Punkte / Spiel", A.g ? A.pts / A.g : null, D.g ? D.pts / D.g : null);
      if (title.indexOf("Saison") !== -1) inner += wvCmpRow("Beste Woche", A.best, D.best);
      defs.forEach(function (df) {
        inner += wvCmpRow(df[0], wvSumKey(A.sums, df[1]), wvSumKey(D.sums, df[1]), { lowBetter: !!df[2], fmt: function (v) { return String(Math.round(v * 10) / 10); } });
      });
      return wvCard(title, inner);
    }
    var pa = playedWeeks(w.add), pd = playedWeeks(w.drop);
    var note = posA !== posD ? '<div class="hint" style="margin:0 0 10px;">Unterschiedliche Positionen – es werden nur die Fantasy-Punkte verglichen.</div>' : "";
    return note + block({ a: all, d: all }, "Saison-Statistiken") + block({ a: pa.slice(-3), d: pd.slice(-3) }, "Letzte 3 Spiele");
  }

  function wvLeagueHtml(c) {
    var w = state.wv;
    var scope = w.scope === "ros" ? "ros" : "week";
    var roster = rosterById(state.myRosterId);
    var hyp = wvHypRoster(roster, w.add, w.drop);
    var rows = (state.rosters || []).map(function (r) {
      var v = scope === "week" ? wvLineupPts(r, state.week) : wvLineupRos(r);
      return { id: r.roster_id, name: teamName(r), v: v, after: r.roster_id === state.myRosterId ? (scope === "week" ? wvLineupPts(hyp, state.week) : wvLineupRos(hyp)) : v };
    }).filter(function (r) { return r.v !== null; });
    if (!rows.length) return '<div class="loading">Prognosen werden geladen…</div>';
    var mn = Math.min.apply(null, rows.map(function (r) { return r.v; })), mx = Math.max.apply(null, rows.map(function (r) { return r.v; }));
    function score(v) { return mx === mn ? 50 : (v - mn) / (mx - mn) * 100; }
    rows.forEach(function (r) { r.sBefore = score(r.v); r.sAfter = score(r.after); });
    var before = rows.slice().sort(function (a, b) { return b.sBefore - a.sBefore; });
    var after = rows.slice().sort(function (a, b) { return b.sAfter - a.sAfter; });
    var rankBefore = 0; before.forEach(function (r, i) { if (r.id === state.myRosterId) rankBefore = i + 1; });
    var body = after.map(function (r, i) {
      var mine = r.id === state.myRosterId;
      var d = r.sAfter - r.sBefore;
      return '<tr class="' + (mine ? "mine" : "") + '"><td style="font-weight:800;">' + (i + 1) + "</td><td>" + escapeHtml(r.name) + "</td><td><b>" + r.sAfter.toFixed(1) + "</b></td><td>" + (mine ? wvSignedHtml(d) : "") + "</td></tr>";
    }).join("");
    var myAfterRank = 0; after.forEach(function (r, i) { if (r.id === state.myRosterId) myAfterRank = i + 1; });
    var scopeBtns = '<div style="display:flex;gap:6px;margin-bottom:12px;">' +
      '<button type="button" class="filter-chip wv-scope' + (scope === "week" ? " active" : "") + '" data-scope="week">Woche ' + state.week + "</button>" +
      '<button type="button" class="filter-chip wv-scope' + (scope === "ros" ? " active" : "") + '" data-scope="ros">Rest der Saison</button></div>';
    return scopeBtns + '<div class="hint" style="margin:0 0 10px;">Power Ranking der Liga nach projizierten Lineup-Punkten (jeweils beste Aufstellung). Der Score ist auf die Liga <b>vor</b> dem Move skaliert (bester Wert = 100) – dein Team kann also über 100 steigen. Dein Rang: ' + rankBefore + ". → <b>" + myAfterRank + ".</b></div>" +
      '<div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>Team</th><th>Score</th><th>Δ</th></tr></thead><tbody>' + body + "</tbody></table></div>";
  }

  function wvCompute() {
    var w = state.wv, d = wvData(), cur = state.week;
    var roster = rosterById(state.myRosterId);
    var hyp = wvHypRoster(roster, w.add, w.drop);
    var c = {};
    c.wkBefore = wvLineupPts(roster, cur);
    c.wkAfter = wvLineupPts(hyp, cur);
    c.rosBefore = wvLineupRos(roster);
    c.rosAfter = wvLineupRos(hyp);
    c.rosDelta = c.rosBefore === null ? null : c.rosAfter - c.rosBefore;
    var oppId = wvOpponentRosterId();
    c.winBefore = (oppId !== null && c.wkBefore !== null) ? wvWinPct(c.wkBefore, oppId) : null;
    c.winAfter = (oppId !== null && c.wkAfter !== null) ? wvWinPct(c.wkAfter, oppId) : null;
    c.addRos = d.rosVal[w.add] === undefined ? null : d.rosVal[w.add];
    c.dropRos = d.rosVal[w.drop] === undefined ? null : d.rosVal[w.drop];
    c.addWk = d.wkVal[w.add] === undefined ? null : d.wkVal[w.add];
    c.dropWk = d.wkVal[w.drop] === undefined ? null : d.wkVal[w.drop];
    var weeksLeft = Math.max(1, (state.lastRegWeek || cur) - cur + 1);
    c.addAvg = c.addRos === null ? null : c.addRos / weeksLeft;
    c.dropAvg = c.dropRos === null ? null : c.dropRos / weeksLeft;
    c.addStarts = bestProjectedLineup(hyp, cur).indexOf(w.add) !== -1;
    c.dropStarts = bestProjectedLineup(roster, cur).indexOf(w.drop) !== -1;
    // Power-Score ROS (skaliert auf die Liga vor dem Move)
    var vals = (state.rosters || []).map(function (r) { return wvLineupRos(r); }).filter(function (v) { return v !== null; });
    c.powRos = null;
    if (vals.length && c.rosBefore !== null) {
      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      var sc = function (v) { return mx === mn ? 50 : (v - mn) / (mx - mn) * 100; };
      c.powRos = { before: sc(c.rosBefore), after: sc(c.rosAfter) };
    }
    return c;
  }

  function renderWaiverAnalysis() {
    var wrap = el("<div></div>");
    if (state.playersLoading || !state.players || state.projectionsLoading || state.weeklyProjectionsLoading) {
      wrap.appendChild(el('<div class="card"><h2>Waiver-Analyse</h2><div class="loading">Spieler und Prognosen werden geladen…</div></div>'));
      return wrap;
    }
    if (!state.weeklyProjections || !Object.keys(state.weeklyProjections).length) {
      wrap.appendChild(el('<div class="card"><h2>Waiver-Analyse</h2><div class="error" style="margin:0;">' + escapeHtml(state.weeklyProjectionsError || "Keine Wochenprognosen verfügbar – die Analyse braucht sie für die Lineup-Berechnung.") + "</div></div>"));
      return wrap;
    }
    var roster = rosterById(state.myRosterId);
    if (!roster) return wrap;
    var w = state.wv;
    var d = wvData();
    var owner = rosterOwnerMap();
    if (w.add && owner[w.add] !== undefined) w.add = null;
    if (w.drop && (roster.players || []).indexOf(w.drop) === -1) w.drop = null;

    var posChips = ["ALL"].concat(RANK_POSITIONS).map(function (p) {
      return '<button type="button" class="filter-chip wv-pos' + (w.pos === p ? " active" : "") + '" data-pos="' + p + '">' + (p === "ALL" ? "Alle" : (p === "DEF" ? "DST" : p)) + "</button>";
    }).join("");
    var pick = '<div class="card"><h2>Waiver-Analyse</h2>' +
      '<div class="hint">Wähle einen freien Spieler (Add) und einen eigenen Spieler (Drop). Die Analyse rechnet dein bestes Lineup mit und ohne den Tausch – für diese Woche und den Rest der Saison.</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">' + posChips + "</div>" +
      '<input id="wv-search" type="text" placeholder="Freien Spieler suchen…" value="' + escapeHtml(w.q || "") + '" style="width:100%;margin-bottom:8px;" />' +
      '<label style="font-size:12px;font-weight:800;color:var(--green);">+ ADD (frei, Top 80 nach Restsaison-Prognose)</label>' +
      '<select id="wv-add" style="width:100%;margin:4px 0 10px;">' + wvAddOptionsHtml() + "</select>" +
      '<label style="font-size:12px;font-weight:800;color:var(--red);">− DROP (mein Team)</label>' +
      '<select id="wv-drop" style="width:100%;margin:4px 0 10px;">' + wvDropOptionsHtml() + "</select>" +
      '<button type="button" class="secondary" id="wv-reset">Zurücksetzen</button></div>';
    wrap.appendChild(el(pick));

    if (!w.add || !w.drop) {
      wrap.appendChild(el('<div class="card"><div class="hint" style="margin:0;">Wähle Add und Drop, um die Analyse zu sehen.</div></div>'));
      return wrap;
    }

    var tabs = [["overview", "Übersicht"], ["games", "Spiele"], ["stats", "Stats"], ["league", "Liga"]].map(function (t) {
      return '<button type="button" class="filter-chip wv-tab' + (w.tab === t[0] ? " active" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
    }).join("");
    var body;
    if (w.tab === "games") body = wvGamesHtml();
    else if (w.tab === "stats") body = wvStatsHtml();
    else if (w.tab === "league") body = wvLeagueHtml();
    else body = wvOverviewHtml(wvCompute());
    var hdr = '<div style="display:flex;gap:10px;margin-bottom:12px;">' + wvHeaderCard(w.add, "add") + wvHeaderCard(w.drop, "drop") + "</div>";
    wrap.appendChild(el('<div>' + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">' + tabs + "</div>" + hdr + body + "</div>"));
    return wrap;
  }

  // ---------- Dynasty-Wert (eigene Schätzung + optional importierte Werte, z. B. KTC) ----------
  var DYN_CURVE = {
    QB: { peak: 34, slope: 0.10 }, RB: { peak: 26, slope: 0.20 }, WR: { peak: 29, slope: 0.12 }, TE: { peak: 29, slope: 0.12 },
    DL: { peak: 30, slope: 0.12 }, LB: { peak: 29, slope: 0.13 }, DB: { peak: 29, slope: 0.13 }, K: { peak: 38, slope: 0.10 }, DEF: { peak: 99, slope: 0 }
  };
  var DYN_YEAR_W = [1, 0.85, 0.72, 0.61, 0.52];
  var DYN_SCALE = 9500;

  function dynLoadKtc() {
    if (state._ktcLoaded) return;
    state._ktcLoaded = true;
    try { var raw = localStorage.getItem("ffdash-ktc"); state.ktc = raw ? JSON.parse(raw) : {}; } catch (e) { state.ktc = {}; }
    if (!state.ktc) state.ktc = {};
  }

  function dynEstimates() {
    var c = state._dynCache;
    if (c && c.ref === state.projections && c.key === state.scoringKey && c.n === (state.rosters || []).length) return c.map;
    var map = {};
    if (!state.projections || !state.players) return map;
    var byPos = {};
    Object.keys(state.projections).forEach(function (pid) {
      var p = state.players[pid];
      if (!p || !DYN_CURVE[p.position]) return;
      var v = projPointsFor(pid);
      if (v <= 0) return;
      (byPos[p.position] = byPos[p.position] || []).push({ pid: pid, v: v });
    });
    var sfN = ((state.league && state.league.roster_positions) || []).filter(function (x) { return x === "SUPER_FLEX"; }).length;
    var teams = (state.rosters || []).length || 10;
    var raw = {}, maxRaw = 0;
    Object.keys(byPos).forEach(function (pos) {
      var arr = byPos[pos].sort(function (a, b) { return b.v - a.v; });
      var cutoff = gradeBaseFor(pos) + (pos === "QB" ? sfN * teams * 0.6 : 0);
      var base = arr[Math.min(arr.length - 1, Math.max(0, Math.round(cutoff) - 1))].v;
      var cv = DYN_CURVE[pos];
      var posFactor = (pos === "K" || pos === "DEF") ? 0.15 : 1;
      arr.forEach(function (x) {
        var vor = x.v - base;
        if (vor <= 0) { raw[x.pid] = 0; return; }
        var age = playerAgeOf(x.pid);
        if (age === null) age = 26;
        var sum = 0;
        DYN_YEAR_W.forEach(function (w, y) { sum += w * Math.max(0, 1 - Math.max(0, age + y - cv.peak) * cv.slope); });
        var r = vor * sum * posFactor;
        raw[x.pid] = r;
        if (r > maxRaw) maxRaw = r;
      });
    });
    Object.keys(raw).forEach(function (pid) { map[pid] = maxRaw > 0 ? Math.round(raw[pid] / maxRaw * DYN_SCALE) : 0; });
    state._dynCache = { ref: state.projections, key: state.scoringKey, n: (state.rosters || []).length, map: map };
    return map;
  }

  function dynValueOf(pid) {
    dynLoadKtc();
    if (state.ktc[pid] !== undefined) return state.ktc[pid];
    var m = dynEstimates();
    return m[pid] || 0;
  }
  function dynIsCustom(pid) { dynLoadKtc(); return state.ktc[pid] !== undefined; }

  function dynPickValue(season, round) {
    var dp = computeDraftPicks();
    var first = dp ? dp.seasons[0] : season;
    var share = { 1: 0.30, 2: 0.15, 3: 0.075, 4: 0.04 }[round] || 0.02;
    return Math.round(DYN_SCALE * share * Math.pow(0.9, Math.max(0, season - first)));
  }

  function dynPickLabel(pk) {
    var o = rosterById(pk.origin);
    return pk.season + " Runde " + pk.round + (pk.origin === state.myRosterId ? "" : " (von " + (o ? teamName(o) : "Team " + pk.origin) + ")");
  }

  function dynImportKtc(text) {
    dynLoadKtc();
    var idx = {};
    Object.keys(state.players || {}).forEach(function (pid) {
      var p = state.players[pid];
      if (!p || !DYN_CURVE[p.position] || p.position === "DEF") return;
      var k = String(p.full_name || ((p.first_name || "") + " " + (p.last_name || ""))).toLowerCase().replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim().replace(/ (jr|sr|ii|iii|iv)$/, "");
      if (!k) return;
      if (!idx[k] || (p.team && !state.players[idx[k]].team)) idx[k] = pid;
    });
    var lines = String(text || "").split(/\r?\n/), matched = 0, total = 0, added = {};
    lines.forEach(function (ln) {
      if (!ln.trim()) return;
      var nums = ln.match(/\d+(?:[.,]\d+)?/g);
      if (!nums) return;
      total++;
      var val = parseFloat(String(nums[nums.length - 1]).replace(",", "."));
      if (isNaN(val)) return;
      var words = ln.toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
      for (var len = 3; len >= 2; len--) {
        var hit = null;
        for (var i = 0; i + len <= words.length && !hit; i++) {
          var cand = words.slice(i, i + len).join(" ").replace(/ (jr|sr|ii|iii|iv)$/, "");
          if (idx[cand]) hit = idx[cand];
        }
        if (hit) { added[hit] = val; matched++; break; }
      }
    });
    Object.keys(added).forEach(function (pid) { state.ktc[pid] = added[pid]; });
    try { localStorage.setItem("ffdash-ktc", JSON.stringify(state.ktc)); } catch (e) { /* ignore */ }
    state._dynCache = null;
    return { matched: matched, total: total };
  }

  function dynImportCardHtml() {
    dynLoadKtc();
    var n = Object.keys(state.ktc).length;
    return '<div class="card"><h2>Eigene Werte importieren (z. B. KeepTradeCut)</h2><div class="hint">Ohne Import schätzt das Dashboard den Dynasty-Wert selbst aus Saison-Prognose, Alter und Positionsknappheit. Du kannst stattdessen echte Werte einfügen: je Zeile ein Spieler mit Wert, z. B. <i>„Josh Allen 9200“</i> oder eine kopierte KTC-Tabelle. Erkannt wird der Name und die letzte Zahl der Zeile. Die Werte bleiben in diesem Browser gespeichert; Spieler ohne Import behalten die Schätzung (Skala 0–10.000).</div>' +
      '<textarea id="ktc-text" rows="5" style="width:100%;margin-bottom:8px;" placeholder="Josh Allen 9200&#10;Ja\'Marr Chase 9800"></textarea>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><button type="button" id="ktc-apply">Werte übernehmen</button><button type="button" class="secondary" id="ktc-clear">Importierte Werte löschen</button><span style="color:var(--muted);font-size:13px;">' + n + " Spieler mit eigenem Wert" + (state.ktcMsg ? " · " + escapeHtml(state.ktcMsg) : "") + "</span></div></div>";
  }

  function dynTeamValue(roster) {
    var players = 0, picks = 0;
    (roster.players || []).forEach(function (pid) { players += dynValueOf(pid); });
    if (state.tradedPicks) {
      var dp = computeDraftPicks();

    }
    return { players: players, picks: picks, total: players + picks };
  }

  function renderDynastyValue(me) {
    var box = el("<div></div>");
    var rows = (state.rosters || []).map(function (r) { var v = dynTeamValue(r); return { id: r.roster_id, name: teamName(r), v: v }; })
      .sort(function (a, b) { return b.v.total - a.v.total; });
    var maxT = rows.length ? rows[0].v.total || 1 : 1;
    var body = rows.map(function (r, i) {
      var mine = r.id === me.rosterId;
      return '<tr class="' + (mine ? "mine" : "") + '"><td style="font-weight:800;">' + (i + 1) + "</td><td>" + escapeHtml(r.name) + "</td><td>" + r.v.players.toLocaleString("de-DE") + "</td><td>" + (state.tradedPicks ? r.v.picks.toLocaleString("de-DE") : "–") + '</td><td><div style="display:flex;align-items:center;gap:8px;"><div class="bar-track" style="width:90px;height:12px;"><div class="bar-fill" style="width:' + Math.max(2, r.v.total / maxT * 100).toFixed(0) + '%;background:var(--green);"></div></div><b>' + r.v.total.toLocaleString("de-DE") + "</b></div></td></tr>";
    }).join("");
    box.appendChild(el('<div class="card"><h2>Dynasty-Wert im Ligavergleich</h2><div class="hint">Summe der Dynasty-Werte aller Spieler (und Draft Picks) pro Team, Skala wie bei KeepTradeCut (bester Spieler ≈ 9.500). Der Wert verbindet Prognose über dem Ersatzniveau der Position mit der Altersentwicklung der nächsten 5 Jahre – junge Spieler und Spieler auf knappen Positionen zählen mehr. Es ist eine Schätzung, kein Marktpreis.</div><div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>Team</th><th>Spieler</th><th>Picks</th><th>Gesamt</th></tr></thead><tbody>' + body + "</tbody></table></div></div>"));
    var mineR = rosterById(me.rosterId);
    var top = (mineR.players || []).map(function (pid) { return { pid: pid, v: dynValueOf(pid), a: playerAgeOf(pid) }; }).filter(function (x) { return x.v > 0; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 12);
    var trs = top.map(function (x) {
      return "<tr><td>" + pnLink(x.pid, nameOf(x.pid)) + "</td><td>" + posTag(positionOf(x.pid)) + '</td><td style="color:' + (x.a !== null ? ageColor(x.a) : "inherit") + ';font-weight:800;">' + (x.a !== null ? x.a.toFixed(1) : "–") + "</td><td><b>" + x.v.toLocaleString("de-DE") + "</b>" + (dynIsCustom(x.pid) ? ' <span style="color:var(--muted);font-size:11px;">eigener Wert</span>' : "") + "</td></tr>";
    }).join("");
    box.appendChild(el('<div class="card"><h2>Meine wertvollsten Spieler</h2><div style="overflow-x:auto;"><table><thead><tr><th>Spieler</th><th>Pos</th><th>Alter</th><th>Dynasty-Wert</th></tr></thead><tbody>' + trs + "</tbody></table></div></div>"));
    box.appendChild(el(dynImportCardHtml()));
    return box;
  }

  // ---------- Trade-Analyse: bis zu 3 Spieler pro Seite ----------
  function trHyp(roster, outPids, inPids) {
    var copy = {};
    Object.keys(roster).forEach(function (k) { copy[k] = roster[k]; });
    copy.roster_id = "hyp|" + roster.roster_id + "|" + outPids.join(",") + ">" + inPids.join(",");
    copy.players = (roster.players || []).filter(function (pid) { return outPids.indexOf(pid) === -1; }).concat(inPids);
    return copy;
  }

  function trChipsHtml(pids, selected, cls) {
    var d = wvData();
    var list = (pids || []).filter(function (pid) { return RANK_POSITIONS.indexOf(positionOf(pid)) !== -1; }).sort(function (a, b) {
      return wvPosOrder(positionOf(a)) - wvPosOrder(positionOf(b)) || (d.rosVal[b] || 0) - (d.rosVal[a] || 0);
    });
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + list.map(function (pid) {
      var v = d.rosVal[pid];
      var pos = positionOf(pid);
      return '<button type="button" class="filter-chip ' + cls + (selected.indexOf(pid) !== -1 ? " active" : "") + '" data-pid="' + escapeHtml(pid) + '">' +
        escapeHtml(shortPlayerName(pid)) + " · " + (pos === "DEF" ? "DST" : pos) + (v ? " · " + v.toFixed(0) : "") + "</button>";
    }).join("") + "</div>";
  }

  function trPickObjs(keys) {
    var dp = computeDraftPicks();
    if (!dp) return [];
    var out = [];
    (keys || []).forEach(function (k) {
      var parts = k.split("|");
      var pk = dp.picks.filter(function (x) { return x.season === parseInt(parts[0], 10) && x.round === parseInt(parts[1], 10) && x.origin === parseInt(parts[2], 10); })[0];
      if (pk) out.push(pk);
    });
    return out;
  }

  function trPickChips(ownerId, selected, cls) {
    var dp = computeDraftPicks();
    if (!dp) return "";
    var list = dp.picks.filter(function (pk) { return pk.owner === ownerId; }).sort(function (a, b) { return a.season - b.season || a.round - b.round; });
    if (!list.length) return "";
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">' + list.map(function (pk) {
      var key = pk.season + "|" + pk.round + "|" + pk.origin;
      return '<button type="button" class="filter-chip ' + cls + (selected.indexOf(key) !== -1 ? " active" : "") + '" data-key="' + key + '">🎟 ' + escapeHtml(dynPickLabel(pk)) + "</button>";
    }).join("") + "</div>";
  }

  function trSideCard(pids, kind, pickKeys) {
    var isGet = kind === "get";
    var d = wvData();
    var rows = pids.map(function (pid) {
      var v = d.rosVal[pid];
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid var(--border);">' +
        '<img src="' + photoUrlFor(pid) + '" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:50%;background:var(--bg);" onerror="this.style.visibility=\'hidden\';" />' +
        '<div style="min-width:0;flex:1;"><div style="font-weight:800;font-size:14px;">' + pnLink(pid, shortPlayerName(pid)) + injuryTagHtml(pid) + '</div><div style="color:var(--muted);font-size:12px;">' + playerMetaLine(pid) + "</div></div>" +
        '<div style="text-align:right;font-size:12px;color:var(--muted);">ROS<br><b style="color:var(--ink);font-size:14px;">' + (v ? v.toFixed(1) : "–") + "</b></div>" +
        '<div style="text-align:right;font-size:12px;color:var(--muted);min-width:52px;">Wert<br><b style="color:var(--ink);font-size:14px;">' + dynValueOf(pid).toLocaleString("de-DE") + "</b></div></div>";
    }).join("") + trPickObjs(pickKeys).map(function (pk) {
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid var(--border);"><div style="flex:1;font-weight:800;font-size:14px;">🎟 ' + escapeHtml(dynPickLabel(pk)) + '</div><div style="text-align:right;font-size:12px;color:var(--muted);min-width:52px;">Wert<br><b style="color:var(--ink);font-size:14px;">' + dynPickValue(pk.season, pk.round).toLocaleString("de-DE") + "</b></div></div>";
    }).join("");
    return '<div style="flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card, #fff);">' +
      '<div style="background:' + (isGet ? "var(--green)" : "var(--red)") + ';color:#fff;font-weight:800;font-size:13px;padding:3px 0;text-align:center;">' + (isGet ? "+ ICH BEKOMME" : "− ICH GEBE") + "</div>" + rows + "</div>";
  }

  function trSum(pids, map) {
    var t = 0, any = false;
    pids.forEach(function (pid) { var v = map[pid]; if (v !== undefined && v !== null) { t += v; any = true; } });
    return any ? t : null;
  }

  function trCompute() {
    var t = state.tr, d = wvData(), cur = state.week;
    var mine = rosterById(state.myRosterId), partner = rosterById(t.partner);
    var hm = trHyp(mine, t.give, t.get), hp = trHyp(partner, t.get, t.give);
    var c = { partnerName: teamName(partner) };
    c.wkBefore = wvLineupPts(mine, cur); c.wkAfter = wvLineupPts(hm, cur);
    c.rosBefore = wvLineupRos(mine); c.rosAfter = wvLineupRos(hm);
    c.rosDelta = c.rosBefore === null ? null : c.rosAfter - c.rosBefore;
    c.pBefore = wvLineupRos(partner); c.pAfter = wvLineupRos(hp);
    c.pDelta = c.pBefore === null ? null : c.pAfter - c.pBefore;
    var oppId = wvOpponentRosterId();
    var oB = null, oA = null;
    if (oppId === t.partner) { oB = wvLineupPts(partner, cur); oA = wvLineupPts(hp, cur); }
    c.winBefore = (oppId !== null && c.wkBefore !== null) ? wvWinPct(c.wkBefore, oppId, oB) : null;
    c.winAfter = (oppId !== null && c.wkAfter !== null) ? wvWinPct(c.wkAfter, oppId, oA) : null;
    c.getRos = trSum(t.get, d.rosVal); c.giveRos = trSum(t.give, d.rosVal);
    c.getWk = trSum(t.get, d.wkVal); c.giveWk = trSum(t.give, d.wkVal);
    var weeksLeft = Math.max(1, (state.lastRegWeek || cur) - cur + 1);
    c.getAvg = c.getRos === null ? null : c.getRos / weeksLeft; c.giveAvg = c.giveRos === null ? null : c.giveRos / weeksLeft;
    var lineAfter = bestProjectedLineup(hm, cur), lineBefore = bestProjectedLineup(mine, cur);
    c.getStarters = t.get.filter(function (p) { return lineAfter.indexOf(p) !== -1; }).length;
    c.giveStarters = t.give.filter(function (p) { return lineBefore.indexOf(p) !== -1; }).length;
    var vals = (state.rosters || []).map(function (r) { return wvLineupRos(r); }).filter(function (v) { return v !== null; });
    c.powRos = null;
    if (vals.length && c.rosBefore !== null) {
      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      var sc = function (v) { return mx === mn ? 50 : (v - mn) / (mx - mn) * 100; };
      c.powRos = { before: sc(c.rosBefore), after: sc(c.rosAfter), pBefore: sc(c.pBefore), pAfter: sc(c.pAfter) };
    }
    c.hm = hm; c.hp = hp;
    var gp = trPickObjs(t.getPicks), vp = trPickObjs(t.givePicks);
    c.dynGet = t.get.reduce(function (a, p) { return a + dynValueOf(p); }, 0) + gp.reduce(function (a, k) { return a + dynPickValue(k.season, k.round); }, 0);
    c.dynGive = t.give.reduce(function (a, p) { return a + dynValueOf(p); }, 0) + vp.reduce(function (a, k) { return a + dynPickValue(k.season, k.round); }, 0);
    function avgAge(pids) { var a = pids.map(playerAgeOf).filter(function (x) { return x !== null; }); return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
    c.ageGet = avgAge(t.get); c.ageGive = avgAge(t.give);
    return c;
  }

  function trOverviewHtml(c) {
    var t = state.tr, cur = state.week;
    var verdict;
    if (c.rosDelta === null) verdict = "";
    else if (c.rosDelta >= 1) verdict = '<span style="color:var(--green);">✔ Der Trade hilft dir: ' + c.rosDelta.toFixed(1) + " Lineup-Punkte mehr bis Ende der regulären Saison.</span>";
    else if (c.rosDelta <= -1) verdict = '<span style="color:var(--red);">✘ Der Trade schadet dir: ' + Math.abs(c.rosDelta).toFixed(1) + " Lineup-Punkte weniger bis Ende der regulären Saison.</span>";
    else verdict = '<span style="color:var(--gold);">≈ Kaum Unterschied für dein Lineup (' + (c.rosDelta >= 0 ? "+" : "") + c.rosDelta.toFixed(1) + " Punkte).</span>";
    var sum = '<div style="font-weight:700;margin-bottom:8px;">' + verdict + "</div>" +
      '<div style="font-weight:800;color:var(--muted);margin:6px 0 2px;">Woche ' + cur + "</div>" +
      '<div style="padding:3px 0;">Startaufstellung: ' + (c.wkBefore === null ? "–" : "<b>" + c.wkBefore.toFixed(1) + " → " + c.wkAfter.toFixed(1) + "</b> (" + wvSignedHtml(c.wkAfter - c.wkBefore) + ")") + "</div>" +
      '<div style="padding:3px 0;">Siegchance: ' + (c.winBefore === null ? "–" : "<b>" + c.winBefore.toFixed(0) + "% → " + c.winAfter.toFixed(0) + "%</b> (" + wvSignedHtml(c.winAfter - c.winBefore, 1, " pp") + ")") + "</div>" +
      '<div style="font-weight:800;color:var(--muted);margin:10px 0 2px;">Rest der Saison (bis Woche ' + (state.lastRegWeek || cur) + ")</div>" +
      '<div style="padding:3px 0;">Lineup-Punkte: ' + (c.rosBefore === null ? "–" : "<b>" + c.rosBefore.toFixed(1) + " → " + c.rosAfter.toFixed(1) + "</b> (" + wvSignedHtml(c.rosDelta) + ")") + "</div>" +
      '<div style="padding:3px 0;">Power-Score: ' + (c.powRos === null ? "–" : "<b>" + c.powRos.before.toFixed(1) + " → " + c.powRos.after.toFixed(1) + "</b> (" + wvSignedHtml(c.powRos.after - c.powRos.before) + ")") + "</div>";
    var out = wvCard("Zusammenfassung", sum);
    var dd = c.dynGet - c.dynGive, dpct = c.dynGive > 0 ? dd / c.dynGive * 100 : null;
    var dverdict = Math.abs(dpct === null ? 0 : dpct) <= 10 ? '<span style="color:var(--gold);">≈ Dynasty-Wert ausgeglichen</span>' : (dd > 0 ? '<span style="color:var(--green);">✔ Du gewinnst Dynasty-Wert: +' + dd.toLocaleString("de-DE") + (dpct === null ? "" : " (" + dpct.toFixed(0) + " %)") + "</span>" : '<span style="color:var(--red);">✘ Du verlierst Dynasty-Wert: ' + dd.toLocaleString("de-DE") + (dpct === null ? "" : " (" + dpct.toFixed(0) + " %)") + "</span>");
    out += wvCard("Dynasty-Wert", '<div style="font-weight:700;margin-bottom:6px;">' + dverdict + "</div>" +
      wvBarRow("Dynasty-Wert (Summe)", c.dynGet, c.dynGive) +
      wvCmpRow("Dynasty-Wert", c.dynGet, c.dynGive, { fmt: function (v) { return Math.round(v).toLocaleString("de-DE"); } }) +
      wvCmpRow("Ø Alter (Spieler)", c.ageGet, c.ageGive, { lowBetter: true }) +
      '<div class="hint" style="margin:8px 0 0;font-size:12px;">Links: was du bekommst, rechts: was du abgibst. Wert = Schätzung aus Prognose, Alter und Positionsknappheit (oder importierter Wert, z. B. KeepTradeCut). Picks zählen mit festen Anteilen (Runde 1 ≈ 30 % des Topwerts, jedes Jahr weiter 10 % weniger).</div>');
    out += wvCard("Impact Rest der Saison",
      wvBarRow("Prognose Restsaison (Summe)", c.getRos, c.giveRos) +
      wvCmpRow("Ø Punkte / Woche", c.getAvg, c.giveAvg) +
      wvCmpRow("Lineup-Punkte ROS", c.rosAfter, c.rosBefore) +
      wvCmpRow("Power-Score ROS", c.powRos ? c.powRos.after : null, c.powRos ? c.powRos.before : null));
    out += wvCard("Impact Woche " + cur,
      wvTextRow("Davon Starter", c.getStarters + " von " + t.get.length, c.giveStarters + " von " + t.give.length, c.getStarters > c.giveStarters, c.giveStarters > c.getStarters) +
      wvCmpRow("Prognose Woche " + cur + " (Summe)", c.getWk, c.giveWk) +
      wvCmpRow("Startaufstellung", c.wkAfter, c.wkBefore) +
      wvCmpRow("Siegchance (%)", c.winAfter, c.winBefore, { fmt: function (v) { return v === null ? "–" : v.toFixed(1) + "%"; } }));
    var pv = c.pDelta === null ? "–" : "<b>" + c.pBefore.toFixed(1) + " → " + c.pAfter.toFixed(1) + "</b> (" + wvSignedHtml(c.pDelta) + ")";
    var fair = "";
    if (c.rosDelta !== null && c.pDelta !== null) {
      fair = c.rosDelta > 1 && c.pDelta > 1 ? "Beide Teams profitieren." : (c.rosDelta > 1 && c.pDelta < -1 ? "Du gewinnst auf Kosten von " + escapeHtml(c.partnerName) + "." : (c.rosDelta < -1 && c.pDelta > 1 ? escapeHtml(c.partnerName) + " gewinnt auf deine Kosten." : (c.rosDelta < -1 && c.pDelta < -1 ? "Beide Teams verlieren Lineup-Punkte." : "Ausgeglichen.")));
    }
    out += wvCard("Gegenseite: " + escapeHtml(c.partnerName), '<div style="padding:3px 0;">Lineup-Punkte ROS: ' + pv + '</div><div style="padding:3px 0;">Power-Score: ' + (c.powRos ? "<b>" + c.powRos.pBefore.toFixed(1) + " → " + c.powRos.pAfter.toFixed(1) + "</b> (" + wvSignedHtml(c.powRos.pAfter - c.powRos.pBefore) + ")" : "–") + '</div><div style="padding:3px 0;font-weight:700;">' + fair + "</div>");
    return out;
  }

  function trGamesHtml() {
    var t = state.tr, cur = state.week;
    loadNflSchedule(); ensureDefenseStatsLoaded();
    if (!state.nflWeekOpponents) return '<div class="loading">Spielplan wird geladen…</div>';
    var ranks = state.defenseRanks || computeDefenseRankings() || {};
    function line(pid, wk) {
      var p = state.players[pid], pos = positionOf(pid);
      var o = p && p.team && state.nflWeekOpponents[wk] ? state.nflWeekOpponents[wk][p.team] : null;
      var nm = '<span style="color:var(--muted);font-size:12px;">' + escapeHtml(shortPlayerName(pid)) + "</span> ";
      if (!o) return '<div style="padding:2px 0;">' + nm + '<span style="color:var(--muted);font-weight:700;">Bye</span></div>';
      var rk = ranks[o.opp] && ranks[o.opp][pos] ? ranks[o.opp][pos] : null;
      return '<div style="padding:2px 0;">' + nm + '<span style="font-weight:800;">' + (o.isHome ? "vs. " : "@ ") + escapeHtml(o.opp) + "</span>" + (rk ? " " + rankBadgeHtml(rk) : "") + "</div>";
    }
    var rows = "";
    for (var wk = cur; wk <= 18; wk++) {
      rows += '<div style="display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;gap:6px;padding:7px 2px;border-top:1px solid var(--border);text-align:center;' + (wk === cur ? "background:var(--green-light);" : "") + '"><div>' +
        t.get.map(function (p) { return line(p, wk); }).join("") + '</div><div style="color:var(--muted);font-size:12px;font-weight:700;">W' + wk + "</div><div>" + t.give.map(function (p) { return line(p, wk); }).join("") + "</div></div>";
    }
    return '<div class="hint" style="margin:0 0 10px;">Links die Spieler, die du bekommst, rechts die, die du abgibst. Gegner-Rang gegen die jeweilige Position: 1 = stärkste Defense (<b style="color:var(--red);">rot</b>, schweres Matchup), 32 = schwächste Defense (<b style="color:var(--green);">grün</b>, leichtes Matchup).</div>' + wvCard("Spielplan ab Woche " + cur, rows);
  }

  function trStatsHtml() {
    var t = state.tr, last = (state.week || 1) - 1;
    if (last < 1) return '<div class="hint">Noch keine gespielte Woche in dieser Saison.</div>';
    ensureDefenseStatsLoaded();
    for (var lw = 1; lw <= last; lw++) if (!state.weeklyStats || !state.weeklyStats[lw]) return '<div class="loading">Statistiken werden geladen…</div>';
    var d = wvData();
    var all = []; for (var i = 1; i <= last; i++) all.push(i);
    function played(pid) { return all.filter(function (wk) { var r = state.weeklyStats[wk][pid]; return r && (r.gp === undefined || parseFloat(r.gp) > 0); }); }
    function rowFor(pid) {
      var S = wvAggregate(pid, all), L = wvAggregate(pid, played(pid).slice(-3));
      return { pts: S.pts, g: S.g, best: S.best, l3: L.g ? L.pts / L.g : null,
        html: "<tr><td>" + pnLink(pid, shortPlayerName(pid)) + " <span style=\"color:var(--muted);font-size:12px;\">" + escapeHtml(positionOf(pid) === "DEF" ? "DST" : positionOf(pid)) + "</span></td><td>" + S.g + "</td><td><b>" + S.pts.toFixed(1) + "</b></td><td>" + (S.g ? (S.pts / S.g).toFixed(1) : "–") + "</td><td>" + (L.g ? (L.pts / L.g).toFixed(1) : "–") + "</td><td>" + (S.best === null ? "–" : S.best.toFixed(1)) + "</td><td>" + (d.rosVal[pid] ? d.rosVal[pid].toFixed(1) : "–") + "</td><td>" + (d.rosRank[pid] ? positionOf(pid) + d.rosRank[pid] : "–") + "</td></tr>" };
    }
    function table(pids, title) {
      var rs = pids.map(rowFor);
      var tp = rs.reduce(function (a, r) { return a + r.pts; }, 0), tg = rs.reduce(function (a, r) { return a + r.g; }, 0);
      var ros = trSum(pids, d.rosVal);
      var total = '<tr style="border-top:2px solid var(--border);font-weight:800;"><td>Summe</td><td>–</td><td>' + tp.toFixed(1) + "</td><td>" + (tg ? (tp / tg).toFixed(1) : "–") + "</td><td>–</td><td>–</td><td>" + (ros === null ? "–" : ros.toFixed(1)) + "</td><td>–</td></tr>";
      return wvCard(title, '<div style="overflow-x:auto;"><table><thead><tr><th>Spieler</th><th>Spiele</th><th>Punkte</th><th>Ø</th><th>Ø L3</th><th>Beste Wo.</th><th>ROS</th><th>Rang</th></tr></thead><tbody>' + rs.map(function (r) { return r.html; }).join("") + total + "</tbody></table></div>");
    }
    return '<div class="hint" style="margin:0 0 10px;">Ø L3 = Durchschnitt der letzten 3 gespielten Spiele, ROS = Prognose Restsaison, Rang = Positions-Rang nach ROS.</div>' + table(t.get, "Ich bekomme") + table(t.give, "Ich gebe");
  }

  function trLeagueHtml(c) {
    var t = state.tr;
    var scope = t.scope === "ros" ? "ros" : "week";
    var rows = (state.rosters || []).map(function (r) {
      var ro = r.roster_id === state.myRosterId ? c.hm : (r.roster_id === t.partner ? c.hp : r);
      var f = scope === "week" ? function (x) { return wvLineupPts(x, state.week); } : wvLineupRos;
      return { id: r.roster_id, name: teamName(r), v: f(r), after: f(ro) };
    }).filter(function (r) { return r.v !== null; });
    if (!rows.length) return '<div class="loading">Prognosen werden geladen…</div>';
    var mn = Math.min.apply(null, rows.map(function (r) { return r.v; })), mx = Math.max.apply(null, rows.map(function (r) { return r.v; }));
    function score(v) { return mx === mn ? 50 : (v - mn) / (mx - mn) * 100; }
    rows.forEach(function (r) { r.sB = score(r.v); r.sA = score(r.after); });
    var before = rows.slice().sort(function (a, b) { return b.sB - a.sB; });
    var after = rows.slice().sort(function (a, b) { return b.sA - a.sA; });
    var rb = 0, ra = 0;
    before.forEach(function (r, i) { if (r.id === state.myRosterId) rb = i + 1; });
    after.forEach(function (r, i) { if (r.id === state.myRosterId) ra = i + 1; });
    var body = after.map(function (r, i) {
      var inTrade = r.id === state.myRosterId || r.id === t.partner;
      return '<tr class="' + (r.id === state.myRosterId ? "mine" : "") + '"><td style="font-weight:800;">' + (i + 1) + "</td><td>" + escapeHtml(r.name) + "</td><td><b>" + r.sA.toFixed(1) + "</b></td><td>" + (inTrade ? wvSignedHtml(r.sA - r.sB) : "") + "</td></tr>";
    }).join("");

  // ---------- Dynasty-Analyse: Kader-Alter & Zusammensetzung ----------
  function playerAgeOf(pid) {
    var p = state.players && state.players[pid];
    if (!p) return null;
    var a = parseFloat(p.age);
    if (!isNaN(a) && a > 0) return a;
    if (p.birth_date) {
      var b = new Date(p.birth_date);
      if (!isNaN(b.getTime())) return Math.round((Date.now() - b.getTime()) / (365.25 * 86400000) * 10) / 10;
    }
    return null;
  }

  function ageColor(a) { return a <= 25 ? "var(--green)" : (a <= 28 ? "var(--gold)" : "var(--red)"); }

  var DYN_BUCKETS = [
    { label: "≤ 23", test: function (a) { return a < 24; }, color: "#2E7D32" },
    { label: "24–25", test: function (a) { return a >= 24 && a < 26; }, color: "#7CB342" },
    { label: "26–27", test: function (a) { return a >= 26 && a < 28; }, color: "#F9A825" },
    { label: "28–29", test: function (a) { return a >= 28 && a < 30; }, color: "#EF6C00" },
    { label: "30+", test: function (a) { return a >= 30; }, color: "#C62828" }
  ];

  function dynTeamStats(r) {
    var positions = activePositions().filter(function (x) { return x !== "K" && x !== "DEF"; });
    var allPos = activePositions();
    var counts = {}, ages = [], wSum = 0, wAge = 0, byPosAges = {}, buckets = DYN_BUCKETS.map(function () { return 0; });
    allPos.forEach(function (x) { counts[x] = 0; });
    var starterSet = {};
    (r.starters || []).forEach(function (pid) { if (pid && pid !== "0") starterSet[pid] = true; });
    var starterAges = [];
    (r.players || []).forEach(function (pid) {
      var pos = positionOf(pid);
      if (counts[pos] !== undefined) counts[pos]++;
      var a = playerAgeOf(pid);
      if (a === null || positions.indexOf(pos) === -1) return;
      ages.push(a);
      if (!byPosAges[pos]) byPosAges[pos] = [];
      byPosAges[pos].push(a);
      if (starterSet[pid]) starterAges.push(a);
      DYN_BUCKETS.forEach(function (b, i) { if (b.test(a)) buckets[i]++; });
      var w = typeof projPointsFor === "function" ? projPointsFor(pid) : 0;
      if (w > 0) { wSum += w; wAge += w * a; }
    });
    function avg(arr) { return arr.length ? arr.reduce(function (x, y) { return x + y; }, 0) / arr.length : null; }
    var byPosAvg = {};
    positions.forEach(function (x) { byPosAvg[x] = avg(byPosAges[x] || []); });
    return { rosterId: r.roster_id, name: teamName(r), total: (r.players || []).length, counts: counts, avgAge: avg(ages), starterAge: avg(starterAges), weightedAge: wSum > 0 ? wAge / wSum : null,
      byPosAvg: byPosAvg, buckets: buckets, n: ages.length, positions: positions };
  }

  function renderDynastyPicks(me) {

    var dp = computeDraftPicks();

    var sel = state.dynSeason === "all" || dp.seasons.indexOf(parseInt(state.dynSeason, 10)) === -1 ? "all" : parseInt(state.dynSeason, 10);

      }).join("");
    box.appendChild(el('<div class="card"><h2>Draft Picks im Ligavergleich</h2><div class="hint">Basis: Sleeper-Daten zu getauschten Picks, ' + dp.rounds + " Runden pro Draft, Jahre " + dp.seasons[0] + "–" + dp.seasons[dp.seasons.length - 1] + ". Jedes Team startet mit eigenen Picks (" + base + " pro Runde" + (sel === "all" ? " über alle Jahre" : "") + '). <b style="color:var(--green);">Grün</b> = mehr, <b style="color:var(--red);">rot</b> = weniger als dieser Grundbestand. „Early“ = Runde 1–2. Sortiert nach Early-Picks.</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">' + chips + '</div><div style="overflow-x:auto;"><table><thead><tr><th>Team</th>' + heads + "<th>Early</th><th>Σ</th></tr></thead><tbody>" + rows + "</tbody></table></div></div>"));

    var ownedMine = dp.picks.filter(function (pk) { return pk.owner === me.rosterId; }).sort(function (a, b) { return a.season - b.season || a.round - b.round; });
    var tradedAway = dp.picks.filter(function (pk) { return pk.origin === me.rosterId && pk.owner !== me.rosterId; }).sort(function (a, b) { return a.season - b.season || a.round - b.round; });
    function nm(id) { var r = rosterById(id); return r ? teamName(r) : "Team " + id; }
    function line(pk, extra) { return '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-top:1px solid var(--border);"><span><b>' + pk.season + "</b> · Runde " + pk.round + "</span><span style=\"color:var(--muted);\">" + extra + "</span></div>"; }
    var mineHtml = ownedMine.length ? ownedMine.map(function (pk) { return line(pk, pk.origin === me.rosterId ? "eigener Pick" : "von " + escapeHtml(nm(pk.origin))); }).join("") : '<div class="hint" style="margin:0;">Keine Picks.</div>';
    var awayHtml = tradedAway.length ? tradedAway.map(function (pk) { return line(pk, "an " + escapeHtml(nm(pk.owner))); }).join("") : '<div class="hint" style="margin:0;">Keine eigenen Picks abgegeben.</div>';
    box.appendChild(el('<div class="card"><h2>Meine Draft Picks</h2><div class="hint">Du besitzt ' + ownedMine.length + " Picks (" + ownedMine.filter(function (pk) { return pk.round <= 2; }).length + " in Runde 1–2).</div>" + mineHtml + '<h3 style="margin:14px 0 6px;">Abgegebene eigene Picks</h3>' + awayHtml + "</div>"));
    return box;
  }

  function renderDynasty() {
    var wrap = el("<div></div>");
    if (state.playersLoading || !state.players) {
      wrap.appendChild(el('<div class="card"><h2>Dynasty-Analyse</h2><div class="loading">Spielerdaten werden geladen…</div></div>'));

    }

    if (!me) return wrap;
    var posList = activePositions();
    var slots = starterSlotsByPosition();

    function rankOf(key, asc) {
      var vals = stats.filter(function (t) { return t[key] !== null; }).sort(function (a, b) { return asc ? a[key] - b[key] : b[key] - a[key]; });
      for (var i = 0; i < vals.length; i++) if (vals[i].rosterId === me.rosterId) return (i + 1) + "/" + vals.length;

    var myAges = (me && rosters.filter(function (r) { return r.roster_id === me.rosterId; })[0].players || []).map(function (pid) { return { pid: pid, a: playerAgeOf(pid) }; }).filter(function (x) { return x.a !== null && ["K", "DEF"].indexOf(positionOf(x.pid)) === -1; });
    var oldest = myAges.slice().sort(function (a, b) { return b.a - a.a; })[0];

      tile("Ø Alter Starter", f1(me.starterAge), "Liga Ø " + f1(leagueAvg("starterAge")), me.starterAge !== null ? ageColor(me.starterAge) : null) +
      tile("Wertgewichtet", f1(me.weightedAge), "nach Saison-Prognose") +
      tile("Rang (1 = jüngster)", rankOf("avgAge", true), "Kader-Alter") +
      tile("Älteste/r", oldest ? oldest.a.toFixed(1) : "–", oldest ? escapeHtml(shortPlayerName(oldest.pid)) : "") +
      tile("Jüngste/r", youngest ? youngest.a.toFixed(1) : "–", youngest ? escapeHtml(shortPlayerName(youngest.pid)) : "") +
      tile("Kadergröße", me.total, me.n + " mit Altersangabe (ohne K/DST)");
    wrap.appendChild(el('<div class="card"><h2>Dynasty-Analyse · ' + escapeHtml(me.name) + '</h2><div class="hint">Alter und Zusammensetzung deines Kaders im Ligavergleich. Gerechnet wird mit dem aktuellen Alter laut Sleeper; Kicker und Defense (DST) zählen nicht mit. Je jünger, desto länger bleibt der Kader konkurrenzfähig – wichtig vor allem bei RB (Leistungsabfall oft ab 27–28).</div><div class="player-card-bio" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;">' + tiles + "</div></div>"));

    // Alter Liga-Tabelle
    var byAge = stats.slice().sort(function (a, b) { return (a.avgAge === null ? 99 : a.avgAge) - (b.avgAge === null ? 99 : b.avgAge); });
    var posHead = me.positions.map(function (x) { return "<th>Ø " + x + "</th>"; }).join("");
    var ageBody = byAge.map(function (t, i) {

    }).join("");
    wrap.appendChild(el('<div class="card"><h2>Kader-Alter im Ligavergleich</h2><div class="hint">Sortiert nach Ø Alter (jüngstes Team zuerst). „Starter“ = aktuell aufgestellte Spieler, „gewichtet“ = Alter nach Saison-Prognose gewichtet (Leistungsträger zählen mehr).</div><div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>Team</th><th>Ø Kader</th><th>Ø Starter</th><th>Ø gewichtet</th>' + posHead + "</tr></thead><tbody>" + ageBody + "</tbody></table></div></div>"));

    // Altersverteilung (gestapelte Balken)
    var legend = DYN_BUCKETS.map(function (b) { return '<span class="legend-dot"><i style="background:' + b.color + ';"></i>' + b.label + "</span>"; }).join("");
    var dist = byAge.map(function (t) {

      }).join("");

    }).join("");
    wrap.appendChild(el('<div class="card"><h2>Altersverteilung</h2><div class="hint" style="margin-bottom:6px;">Anzahl Spieler pro Altersgruppe (ohne K/DST).</div><div style="margin-bottom:8px;">' + legend + "</div>" + dist + "</div>"));

    // Zusammensetzung
    var need = posList.map(function (x) { return slots[x] ? x + " " + slots[x] : null; }).filter(Boolean).join(" · ");
    var avgCounts = {};
    posList.forEach(function (x) { avgCounts[x] = stats.reduce(function (a, t) { return a + t.counts[x]; }, 0) / (stats.length || 1); });
    var avgTotal = stats.reduce(function (a, t) { return a + t.total; }, 0) / (stats.length || 1);
    var compHead = posList.map(function (x) { return "<th>" + (x === "DEF" ? "DST" : x) + "</th>"; }).join("");
    var compBody = stats.slice().sort(function (a, b) { return (a.rosterId === me.rosterId ? -1 : 0) - (b.rosterId === me.rosterId ? -1 : 0) || a.name.localeCompare(b.name); }).map(function (t) {

    wrap.appendChild(el('<div class="card"><h2>Kader-Zusammensetzung</h2><div class="hint">Anzahl Spieler pro Position (inkl. Bank, IR und Taxi). <b style="color:var(--green);">Grün</b> = deutlich mehr als der Liga-Durchschnitt (ab 1,5 Spieler), <b style="color:var(--red);">rot</b> = deutlich weniger.' + (need ? " Deine Starterplätze: " + need + (flexInfo.length ? " + " + flexInfo.length + "× Flex" : "") + "." : "") + '</div><div style="overflow-x:auto;"><table><thead><tr><th>Team</th>' + compHead + "<th>Σ</th></tr></thead><tbody>" + compBody + avgRow + needRow + "</tbody></table></div></div>"));

    // Mein Kader nach Alter
    var mineRoster = rosters.filter(function (r) { return r.roster_id === me.rosterId; })[0];

      .sort(function (x, y) { return (y.a === null ? -1 : y.a) - (x.a === null ? -1 : x.a); });

    var filterDefs = [

    ];

    var infoText = {

      ros: "Summe der Wochenprognosen von der aktuellen Woche bis zum Ende der regulären Saison (Bye-Wochen zählen automatisch 0). Mit aktiver Verletzungs-Option werden geschätzte Ausfallwochen abgezogen — die Dauer ist eine Annahme, Sleeper liefert sie nicht.",
      waiver: "Wie Rest of Season, standardmäßig nur freie Spieler. Spalten: Prognose der aktuellen Woche, Rest-of-Season-Punkte und Δ = Restsaison-Punkte minus dein schwächster Starter auf dieser Position (Anzahl Starterplätze aus deinen Liga-Einstellungen; FLEX nicht eingerechnet). Grün = Verbesserung gegenüber deinem aktuellen Starter."
    }[sub];

    wrap.appendChild(el(
      '<div class="card" style="padding:16px 20px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">' +
      '<h2 style="font-size:20px;margin:0;">Rankings' + infoBtn("rank-page-info") + "</h2>" + '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;">' + legend + "</div></div>" +
      infoBox("rank-page-info", infoText) +

    var anyRows = false;
    var cards = RANK_POSITIONS.map(function (pos) {
      var list = data[pos].filter(function (it) { return passes(it.status); });
      var expanded = !!state.rankExpanded[pos];
      var limit = expanded ? 40 : 10;
      var shown = list.slice(0, limit);
      if (shown.length) anyRows = true;

      var best = null;
      for (var i = 0; i < list.length; i++) {

      }
      var chip = best ? '<span class="rank-chip">' + (mode === "waiver" ? "Bester Freier" : "Bester eigener") + " #" + best.rank + "</span>" : "";

      var colHead = mode === "waiver"

        : '<div class="rank-colhead"><span style="width:26px;">RK</span><span style="width:30px;"></span><span style="flex:1;">PLAYER</span><span style="width:48px;text-align:right;">' + (mode === "week" ? "PKT." : "ROS") + "</span></div>";

      var rowsHtml = shown.length
        ? shown.map(function (it) { return rankRowHtml(it, mode); }).join("")
        : '<div class="hint" style="margin:6px 8px;font-size:13px;">Keine Spieler für diese Ansicht.</div>';
      var more = list.length > shown.length ? '<div class="rank-more">+ ' + (list.length - shown.length) + " weitere — mit ⤢ vergrößern</div>" : "";

      return '<div class="rank-card' + (expanded ? " expanded" : "") + '">' +
        '<div class="rank-card-head"><div style="display:flex;align-items:center;flex-wrap:wrap;"><span class="rank-pos">' + pos + "</span>" + chip + "</div>" +
        '<button type="button" class="rank-expand" data-pos="' + pos + '" title="' + (expanded ? "Verkleinern" : "Vergrößern") + '">' + (expanded ? "⤡" : "⤢") + "</button></div>" +
        colHead + rowsHtml + more + "</div>";
    }).join("");

    wrap.appendChild(el('<div class="rank-grid' + (mode === "waiver" ? " wide" : "") + '">' + cards + "</div>"));
    if (!anyRows) {
      wrap.appendChild(el('<div class="card"><div class="hint" style="margin:0;">Für diese Ansicht gibt es keine Spieler mit Prognose. Wechsle den Filter oder die Woche.</div></div>'));
    }

    if (state.statsCardPid) {
      var cw = Math.max(1, state.week - 1);
      loadWeeklyStats(cw);
      loadNflverse();
      loadPlayerIdCrosswalk();
      if (state.weeklyStats && !state.weeklyStatsLoading[cw]) {
        var modal = renderPlayerCardModal(state.statsCardPid, cw);
        if (modal) wrap.appendChild(modal);
      } else {
        wrap.appendChild(el('<div class="modal-overlay" id="player-card-overlay"><div class="modal-card" style="height:auto;padding:28px;"><div class="loading">Spieler-Karte wird geladen…</div></div></div>'));
      }
    }

    return wrap;
  }


  // ---------- Ranking Experten (eigene Rankings, Original bleibt unverändert) ----------
  function rankPillsHtml(sub) {
    var subDefs = [
      { id: "week", label: "Week Rankings" },
      { id: "ros", label: "Rest of Season Rankings" },
      { id: "waiver", label: "Waiver Wire Rankings" },
      { id: "expert", label: "Ranking Experten" }
    ];
    return subDefs.map(function (d) {
      return '<button type="button" class="pill rank-sub-tab' + (sub === d.id ? " active" : "") + '" data-sub="' + d.id + '">' + d.label + "</button>";
    }).join("");
  }

  function expertStoreKey() { return "ffdash.expert." + (state.league ? state.league.league_id : "x"); }

  function expertLoad() {
    var ex = state.expert;
    var key = expertStoreKey();
    if (ex.loadedFor === key) return;
    ex.loadedFor = key;
    ex.rankings = [];
    ex.activeId = null;
    ex.storageOk = true;
    try {
      var raw = window.localStorage.getItem(key);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.rankings)) { ex.rankings = d.rankings; ex.activeId = d.activeId || null; }
      }
    } catch (e) { ex.storageOk = false; }
    ex.rankings.forEach(function (r) {
      if (!r.matchupPlayers) r.matchupPlayers = {};
      delete r.matchup;
      if (!r.overrides) r.overrides = {};
      if (!r.hidden) r.hidden = {};
    });
    if (!expertActive() && ex.rankings.length) ex.activeId = ex.rankings[0].id;
  }

  function expertSave() {
    var ex = state.expert;
    try {
      window.localStorage.setItem(expertStoreKey(), JSON.stringify({ rankings: ex.rankings, activeId: ex.activeId }));
    } catch (e) { ex.storageOk = false; }
  }

  function expertActive() {
    var ex = state.expert;
    return ex.rankings.filter(function (r) { return r.id === ex.activeId; })[0] || null;
  }

  function expertCreate(name, base, fromCfg) {
    var ex = state.expert;
    var cfg = {
      id: "r" + Date.now().toString(36) + Math.floor(Math.random() * 1000),
      name: (name && name.trim()) || ("Mein Ranking " + (ex.rankings.length + 1)),
      base: base === "ros" ? "ros" : "week",
      week: state.rankWeek || state.week,
      matchupPlayers: {},
      injuries: !!state.applyInjuries,
      overrides: {},
      hidden: {}
    };
    if (fromCfg) {
      cfg.base = fromCfg.base; cfg.week = fromCfg.week; cfg.injuries = fromCfg.injuries;
      cfg.matchupPlayers = JSON.parse(JSON.stringify(fromCfg.matchupPlayers || {}));
      cfg.overrides = JSON.parse(JSON.stringify(fromCfg.overrides || {}));
      cfg.hidden = JSON.parse(JSON.stringify(fromCfg.hidden || {}));
    }
    ex.rankings.push(cfg);
    ex.activeId = cfg.id;
    ex.showNew = false;
    expertSave();
    return cfg;
  }

  // Berechnet die eigene Rangliste; das "Original" (Week/ROS mit globalen Einstellungen) wird nur zum Vergleich gerechnet.
  function computeExpertRanking(cfg) {
    var owner = rosterOwnerMap();
    var origData = buildRankingData(cfg.base, cfg.week, owner);
    var origMap = {};
    RANK_POSITIONS.forEach(function (pos) {
      origData[pos].forEach(function (it) { origMap[it.pid] = { rank: it.rank, val: it.val }; });
    });
    var saved = state.applyInjuries;
    state.applyInjuries = !!cfg.injuries;
    var data;
    try { data = buildRankingData(cfg.base, cfg.week, owner); } finally { state.applyInjuries = saved; }
    var useMatchup = cfg.base === "week";
    RANK_POSITIONS.forEach(function (pos) {
      var list = data[pos];
      list.forEach(function (it) {
        var o = origMap[it.pid];
        it.origRank = o ? o.rank : null;
        it.origVal = o ? o.val : null;
        it.adj = cfg.overrides[it.pid] || 0;
        it.hidden = !!cfg.hidden[it.pid];
        it.mpct = useMatchup ? (cfg.matchupPlayers[it.pid] !== undefined ? cfg.matchupPlayers[it.pid] : 100) : 0;
        it.mpctChanged = useMatchup && it.mpct !== 100;
        it.baseMM = null;
        if (it.val === null) return;
        var mm = 1;
        if (it.mpct > 0) {
          var mi = matchupInfoFor(it.pid, cfg.week);
          if (mi) mm = 1 + (it.mpct / 100) * (matchupMultiplier(mi.rank) - 1);
        }
        it.baseMM = it.val * mm;
        it.val = Math.max(0, it.baseMM + it.adj);
      });
      list.sort(function (a, b) {
        if (a.val === null && b.val === null) return 0;
        if (a.val === null) return 1;
        if (b.val === null) return -1;
        return b.val - a.val;
      });
      var r = 0;
      list.forEach(function (it) {
        if (it.val !== null && !it.hidden) { r += 1; it.rank = r; } else it.rank = null;
      });
    });
    return data;
  }

  function expertRowHtml(it, upOv, downOv, cfg) {
    var p = state.players[it.pid];
    var isDef = it.pos === "DEF";
    var name = isDef ? (p.last_name || it.pid) : (((p.first_name || "").charAt(0) ? (p.first_name || "").charAt(0) + ". " : "") + (p.last_name || nameOf(it.pid)));
    var team = isDef ? it.pid : (p.team || "FA");
    var img = isDef
      ? "https://sleepercdn.com/images/team_logos/nfl/" + String(it.pid).toLowerCase() + ".png"
      : "https://sleepercdn.com/content/nfl/players/thumb/" + it.pid + ".jpg";
    var cls = it.status === "mine" ? "rank-mine" : (it.status === "free" ? "rank-free" : "rank-other");
    var chg = "–", chgCol = "var(--muted)";
    if (it.rank !== null && it.origRank !== null) {
      var d = it.origRank - it.rank;
      if (d > 0) { chg = "▲" + d; chgCol = "var(--green)"; }
      else if (d < 0) { chg = "▼" + (-d); chgCol = "var(--red)"; }
    }
    var hasAdj = it.adj !== 0;
    var changed = hasAdj || it.mpctChanged;
    var insCells = (cfg.base === "week") ? insightCellsHtml(computeInsights(it.pid, cfg.week, it.rank, false)) : "";
    var hasVal = it.val !== null;
    return '<div class="expert-row ' + cls + (changed ? " is-changed" : "") + '">' +
      '<span class="rk">' + (it.rank !== null ? it.rank : "–") + "</span>" +
      '<span class="chg" style="color:' + chgCol + ';" title="Veränderung gegenüber dem Original-Ranking (Original: #' + (it.origRank !== null ? it.origRank : "–") + ')">' + chg + "</span>" +
      '<img src="' + img + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\';" />' +
      '<span class="nm expert-name"' + (insCells ? ' style="flex:none;width:170px;"' : "") + ' data-pid="' + escapeHtml(it.pid) + '">' + escapeHtml(name) + '<span class="tm">' + escapeHtml(team) + "</span>" + injuryTagHtml(it.pid) +
      (it.mpctChanged ? '<span class="inj" style="color:var(--gold);" title="Abweichender Matchup-Einfluss (Standard: 100 %)">⚔ ' + it.mpct + "%</span>" : "") + "</span>" +
      insCells +
      '<span class="orig">' + (it.origVal !== null ? it.origVal.toFixed(1) : "–") + "</span>" +
      (hasVal
        ? '<input type="number" step="0.5" class="adj-input ex-adj" data-pid="' + escapeHtml(it.pid) + '" value="' + (hasAdj ? (Math.round(it.adj * 100) / 100) : "") + '" placeholder="±0" />'
        : '<span style="width:74px;flex-shrink:0;"></span>') +
      '<span class="fin">' + (hasVal ? it.val.toFixed(1) : "–") + "</span>" +
      '<span class="acts">' +
      '<button type="button" class="ex-btn ex-move" data-pid="' + escapeHtml(it.pid) + '" data-ov="' + (upOv !== null ? upOv : "") + '" ' + (upOv === null ? "disabled" : "") + ' title="Eine Position nach oben">▲</button>' +
      '<button type="button" class="ex-btn ex-move" data-pid="' + escapeHtml(it.pid) + '" data-ov="' + (downOv !== null ? downOv : "") + '" ' + (downOv === null ? "disabled" : "") + ' title="Eine Position nach unten">▼</button>' +
      '<button type="button" class="ex-btn ex-reset" data-pid="' + escapeHtml(it.pid) + '" ' + (changed ? "" : "disabled") + ' title="Anpassung und Matchup-Einfluss zurücksetzen">↺</button>' +
      '<button type="button" class="ex-btn ex-hide" data-pid="' + escapeHtml(it.pid) + '" title="Spieler aus diesem Ranking ausblenden">✕</button>' +
      "</span></div>";
  }

        bars + "</div>"));

      var posRank = computePositionRankRows(state.myRosterId);
      var rankRows = posRank.rankRows, weakest = posRank.weakest, strongest = posRank.strongest;

      if (rankRows.length > 0) {
        wrap.appendChild(el(
          '<div class="card"><h2>Position Strength' + infoBtn("pos-strength") + "</h2>" +
          infoBox("pos-strength", "Rang deiner Positionsgruppe im Ligavergleich (weiter außen = stärker; Rang 1 = beste Gruppe der Liga). Grün = obere 40%, Gold = Mittelfeld, Rot = untere 30%.") +
          buildRankRadarSVG(rankRows) +

        ));

      if (weakest && strongest) {

          '<div style="font-size:12px;color:var(--muted);margin-top:4px;">Rang ' + weakest.rank + " von " + weakest.total + " · " + weakest.points.toFixed(1) + " Pkt.</div></div>" +
          '<div class="stat-col"><div class="label" style="color:var(--green);font-weight:700;">Stärkste Positionsgruppe</div>' +
          '<div class="score-num" style="font-size:22px;">' + escapeHtml(strongest.pos) + '</div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:4px;">Rang ' + strongest.rank + " von " + strongest.total + " · " + strongest.points.toFixed(1) + " Pkt.</div></div>" +
          "</div></div>"
        ));

    var reserveIds = (roster.reserve || []).filter(Boolean);
    var taxiIds = (roster.taxi || []).filter(Boolean);

    var split = splitStartBench((roster.players || []).filter(function (x) { return !parked[x]; }), roster);
    function renderKaderGroup(pids, forceBadge) {
      return pids.map(function (pid) {
        var pts = projPointsFor(pid);
        var starter = isStarter(roster, pid);
        var dim = (state.calcMode === "starters" && !starter) ? "opacity:0.5;" : "";
        var badge = forceBadge ? '<span class="badge-bench">' + forceBadge + "</span>" : (starter ? '<span class="badge-start">Start</span>' : '<span class="badge-bench">Bank</span>');
        var oppBadge = opponentRankBadge(pid);
        var wx = playerWeatherBadge(pid);
        var injSt = injuryStatusFor(pid);
        if (injSt) {

          badge += ' <span class="severity-badge" style="background:transparent;border:1.5px solid ' + injCol + ";color:" + injCol + ';padding:2px 8px;font-size:11px;">' + escapeHtml(injSt) + "</span>";
        }
        var meta = badge + '<span style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;">' + pts.toFixed(1) + " Pkt.</span>" +
          (oppBadge ? " " + oppBadge : "") + (wx ? ' <span style="font-size:11px;">' + wx + "</span>" : "");
        var extraLine = [];
        var statLine = statBreakdownFor(pid);
